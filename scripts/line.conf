# The release line: the one place its versions are named (spec 005, Decision 2).
# Grammar: one NAME=value per line, the value only letters, digits and ._+-; a line starting with #
# is a comment; nothing else, no blank lines (scripts/line.py and common.sh both refuse one).
# Read by scripts/steps/common.sh, scripts/python-wasi-cross and scripts/line.py, which derive
# PYTHON_MM (3.15) and PYTHON_TAG (315) from PYTHON_VERSION.
PYTHON_VERSION=3.15.0
WASI_SDK_VERSION=33
WASI_SDK_DIR=wasi-sdk-33.0-arm64-macos
HOST_PYTHON_ARCHIVE=cpython-3.15.0+20261009-aarch64-apple-darwin-install_only.tar.gz
CYTHON_WHEEL=cython-3.3.0-cp315-cp315-macosx_11_0_arm64.whl
WASMTIME_DIR=wasmtime-v49.0.3-aarch64-macos
WASI_LIBC_COMMIT=161b3195
LLVM_COMMIT=4434dabb
