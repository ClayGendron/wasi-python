# The release line: the one place its versions are named.
# Grammar: one NAME=value per line, the value only letters, digits and ._+-; a line starting with #
# is a comment; nothing else, no blank lines (scripts/line.py and common.sh both refuse one).
# Read by scripts/steps/common.sh, scripts/python-wasi-cross and scripts/line.py, which derive
# PYTHON_MM (3.15) and PYTHON_TAG (315) from PYTHON_VERSION.
PYTHON_VERSION=3.15.2
WASI_SDK_VERSION=34
# The build hosts' own inputs: each host-specific name once per build host,
# prefixed by the host's key (MACOS_ARM64, LINUX_AARCH64, LINUX_X86_64). line.sh and line.py set
# the plain name (WASI_SDK_DIR, ...) for the host they run on; every host builds the same bytes.
MACOS_ARM64_WASI_SDK_DIR=wasi-sdk-34.0-arm64-macos
MACOS_ARM64_HOST_PYTHON_ARCHIVE=cpython-3.15.2+20261026-aarch64-apple-darwin-install_only.tar.gz
MACOS_ARM64_CYTHON_WHEEL=cython-3.3.0-cp315-cp315-macosx_11_0_arm64.whl
MACOS_ARM64_NINJA_WHEEL=ninja-1.13.2-py3-none-macosx_10_9_universal2.whl
MACOS_ARM64_WASMTIME_DIR=wasmtime-v50.0.1-aarch64-macos
MACOS_ARM64_COMPILER_SDK_DIR=wasi-sdk-34.0-arm64-macos
MACOS_ARM64_PKGCONF_WHEEL=pkgconf-3.0.7.post0-py3-none-macosx_11_0_arm64.whl
MACOS_ARM64_NUMPY_HOST_WHEEL=numpy-2.5.4-cp315-cp315-macosx_14_0_arm64.whl
LINUX_AARCH64_WASI_SDK_DIR=wasi-sdk-34.0-arm64-linux
LINUX_AARCH64_HOST_PYTHON_ARCHIVE=cpython-3.15.2+20261026-aarch64-unknown-linux-gnu-install_only.tar.gz
LINUX_AARCH64_CYTHON_WHEEL=cython-3.3.0-cp315-cp315-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl
LINUX_AARCH64_NINJA_WHEEL=ninja-1.13.2-py3-none-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
LINUX_AARCH64_WASMTIME_DIR=wasmtime-v50.0.1-aarch64-linux
LINUX_AARCH64_COMPILER_SDK_DIR=wasi-sdk-34.0-arm64-linux
LINUX_AARCH64_PKGCONF_WHEEL=pkgconf-3.0.7.post0-py3-none-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl
LINUX_AARCH64_NUMPY_HOST_WHEEL=numpy-2.5.4-cp315-cp315-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
LINUX_X86_64_WASI_SDK_DIR=wasi-sdk-34.0-x86_64-linux
LINUX_X86_64_HOST_PYTHON_ARCHIVE=cpython-3.15.2+20261026-x86_64-unknown-linux-gnu-install_only.tar.gz
LINUX_X86_64_CYTHON_WHEEL=cython-3.3.0-cp315-cp315-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
LINUX_X86_64_NINJA_WHEEL=ninja-1.13.2-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
LINUX_X86_64_WASMTIME_DIR=wasmtime-v50.0.1-x86_64-linux
LINUX_X86_64_PKGCONF_WHEEL=pkgconf-3.0.7.post0-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
LINUX_X86_64_NUMPY_HOST_WHEEL=numpy-2.5.4-cp315-cp315-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
# The SDK whose clang compiles on each host: each
# host's own. Every compile carries -ffp-contract=off (step 10), which makes wasi-sdk's x86_64 and
# aarch64 builds of clang emit the same bytes. The five LINUX_X86_64_*_DEB names are the fallback,
# switched off: LINUX_X86_64_COMPILER_SDK_DIR=wasi-sdk-34.0-arm64-linux would run that SDK's clang
# under the pinned qemu-aarch64 with the four aarch64 runtime packages. Kept one release.
LINUX_X86_64_COMPILER_SDK_DIR=wasi-sdk-34.0-x86_64-linux
LINUX_X86_64_EMULATOR_DEB=qemu-user_10.0.13+ds-0+deb13u1_amd64.deb
LINUX_X86_64_AARCH64_LIBC_DEB=libc6_2.41-12+deb13u4_arm64.deb
LINUX_X86_64_AARCH64_LIBSTDCXX_DEB=libstdc++6_14.2.0-19_arm64.deb
LINUX_X86_64_AARCH64_LIBGCC_DEB=libgcc-s1_14.2.0-19_arm64.deb
LINUX_X86_64_AARCH64_LIBTINFO_DEB=libtinfo6_6.5+20250216-2_arm64.deb
WASI_LIBC_COMMIT=2e6fb9d8
LLVM_COMMIT=895aa2c8
