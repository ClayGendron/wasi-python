# The release line: the one place its versions are named (spec 005, Decision 2).
# Grammar: one NAME=value per line, the value only letters, digits and ._+-; a line starting with #
# is a comment; nothing else, no blank lines (scripts/line.py and common.sh both refuse one).
# Read by scripts/steps/common.sh, scripts/python-wasi-cross and scripts/line.py, which derive
# PYTHON_MM (3.15) and PYTHON_TAG (315) from PYTHON_VERSION.
PYTHON_VERSION=3.15.0
WASI_SDK_VERSION=33
# The build hosts' own inputs (spec 012, Decision 1): each host-specific name once per build host,
# prefixed by the host's key (MACOS_ARM64, LINUX_AARCH64, LINUX_X86_64). line.sh and line.py set
# the plain name (WASI_SDK_DIR, ...) for the host they run on; every host builds the same bytes.
MACOS_ARM64_WASI_SDK_DIR=wasi-sdk-33.0-arm64-macos
MACOS_ARM64_HOST_PYTHON_ARCHIVE=cpython-3.15.0+20261009-aarch64-apple-darwin-install_only.tar.gz
MACOS_ARM64_CYTHON_WHEEL=cython-3.3.0-cp315-cp315-macosx_11_0_arm64.whl
MACOS_ARM64_NINJA_WHEEL=ninja-1.13.2-py3-none-macosx_10_9_universal2.whl
MACOS_ARM64_WASMTIME_DIR=wasmtime-v49.0.3-aarch64-macos
LINUX_AARCH64_WASI_SDK_DIR=wasi-sdk-33.0-arm64-linux
LINUX_AARCH64_HOST_PYTHON_ARCHIVE=cpython-3.15.0+20261009-aarch64-unknown-linux-gnu-install_only.tar.gz
LINUX_AARCH64_CYTHON_WHEEL=cython-3.3.0-cp315-cp315-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl
LINUX_AARCH64_NINJA_WHEEL=ninja-1.13.2-py3-none-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
LINUX_AARCH64_WASMTIME_DIR=wasmtime-v49.0.3-aarch64-linux
LINUX_X86_64_WASI_SDK_DIR=wasi-sdk-33.0-x86_64-linux
LINUX_X86_64_HOST_PYTHON_ARCHIVE=cpython-3.15.0+20261009-x86_64-unknown-linux-gnu-install_only.tar.gz
LINUX_X86_64_CYTHON_WHEEL=cython-3.3.0-cp315-cp315-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
LINUX_X86_64_NINJA_WHEEL=ninja-1.13.2-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
LINUX_X86_64_WASMTIME_DIR=wasmtime-v49.0.3-x86_64-linux
WASI_LIBC_COMMIT=161b3195
LLVM_COMMIT=4434dabb
