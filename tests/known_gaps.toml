# Known gaps (spec 002, Decision 4): checks that fail today in exactly the named way, each with
# the document that will close it. A gap is an allowance, not a backlog.
#
# `match` names the exact set of findings: their count and the digest of the sorted list, as the
# check prints them. One more finding, or one fewer, is a different failure and turns the run red,
# so an allowance can only change through an edit here, which is a judge change and needs
# `--accept-judge "<reason>"`. A gap whose check passes fails the run until it is removed.

# numpy's and pandas' own tests (spec 050): each class of known failures, listed by node id in
# tests/upstream/expected/<group>/<class>.txt, and each test that traps the guest. A class whose
# list is empty has no gap (condition C1).

