# The judge's own command-line options that must exist before pytest reads any conftest: with no
# path given, pytest parses the command line first, so an option the harness plugin adds from
# tests/conftest.py would be unknown. A dev-only member of this repository's uv workspace, never a
# dependency of the wasi-python wheel, whose metadata every user installs.
[project]
name = "wasi-python-judge-options"
version = "1"
description = "The wasi-python judge's --tier option, registered before any conftest is read."
requires-python = ">=3.11"
dependencies = []

[project.entry-points.pytest11]
wasi_python_judge_options = "wasi_python_judge_options"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["wasi_python_judge_options.py"]
