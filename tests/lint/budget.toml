# The fast tier's budget (tests/harness/budget.py). A normal-tier goal check whose fuel, on any
# platform, is past its family's cap below is a finding: in the gather, on each record's own fuel,
# so the pull request that grows it is red; at the acceptance from CI's record; and in lint, on the
# accepted fuel. A goal check whose time in the quick job is past `seconds` is a warning, never a
# failure, since a duration depends on its host. A product check's family is its file, by stem; an
# upstream check's is its package. Each cap is twice the largest fuel accepted for its family at
# ce46da7d, the acceptance this file was written against. A family with fuel and no cap is a
# finding, and so is a cap no family uses.
#
# A check over budget is listed under [[over]] with the specification that will move it to the
# slow normal tier or the release tier, by its number (one not yet landed), and why it grew:
#   [[over]]
#   check = "<node id>"
#   closes_with = "<NNN>"
#   reason = "<why>"
# A listed check is reported, naming that specification; an entry whose check is no longer over
# budget is a finding, so the list only shrinks. Changing this file is a judge change.

seconds = 60

