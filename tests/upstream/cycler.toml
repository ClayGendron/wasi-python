# cycler's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "cycler"
driver = "package"
grant = "/upstream-cycler"
test_source = true
wheel = "cycler-0.12.1-py3-none-any.whl"
budget = 17_000_000_000
stage_folders = []
support_files = ["test_cycler.py"]
extra_sys_path = ["."]
cwd = "tree"
markers = []

[groups.cycler-smoke]
paths = ["test_cycler.py"]
smoke = "the whole suite: a smaller smoke group would cost as much, a session's start being most of it"
fuel = 17_000_000_000
measured = 10_845_151_082

