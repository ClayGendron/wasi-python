# seaborn's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "seaborn"
driver = "package"
grant = "/upstream-seaborn"
test_source = true
budget = 3_317_000_000_000
stage_folders = ["tests"]
extra_sys_path = ["."]
cwd = "tree"
markers = []

[groups.seaborn-smoke]
paths = ["tests/test_utils.py", "tests/_core/test_data.py"]
smoke = "a few files that import the package from the zip and run its core paths"
fuel = 56_000_000_000
measured = 36_965_127_265

