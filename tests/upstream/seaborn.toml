[[split]]
file = "tests/test_categorical.py"
groups = ["seaborn-r-5", "seaborn-r-5b", "seaborn-r-5c"]
keywords = [
    "TestStripPlot or TestSwarmPlot or TestBeeswarm",
    "TestBarPlot or TestPointPlot or TestCountPlot",
]

[[not_selected]]
files = ["tests/test_base.py"]
reason = "it applies a mark to a fixture function, which pytest 8 deprecated and the kit's pytest 9 refuses: the module cannot be collected"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "newer-dependencies"
group = "seaborn-smoke"
outcome = "failed"
match = "has no attribute 'in1d'|has no attribute 'VisibleDeprecationWarning'|KeyError: 'labelleft'|Series\\.index are different|Regex pattern did not match|^AssertionError:$"
reason = "seaborn 0.13.2's tests predate the numpy 2.5, pandas 3 and matplotlib 3.11 the product ships: an API they call is gone, or a value they compare changed (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "no-pyarrow-interchange"
group = "seaborn-smoke"
outcome = "failed"
match = "converting data source to a pandas DataFrame"
reason = "the dataframe interchange protocol's conversion to pandas needs pyarrow, which the product does not carry (README)"
closes_with = "docs/reference/limitations.md"

