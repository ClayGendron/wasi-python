# numpy 2.5.2's pytest.ini `filterwarnings`, transcribed (spec 050, Decision 6), plus one ignore:
# the driver imports hypothesis before pytest, so pytest cannot rewrite `_hypothesis_globals`.
# Upstream's addopts are the driver's (Decision 5).
[pytest]
filterwarnings =
    error
    ignore:Not importing directory
    ignore:numpy.dtype size changed
    ignore:numpy.ufunc size changed
    ignore::UserWarning:cpuinfo,
    ignore: divide by zero encountered in log
    ignore: invalid value encountered in log
    ignore:the matrix subclass is not:PendingDeprecationWarning
    ignore:Importing from numpy.matlib is:PendingDeprecationWarning
    ignore:assertions not in test modules or plugins:pytest.PytestConfigWarning
    ignore:Matplotlib is currently using agg, which is a non-GUI backend, so cannot show the figure.:UserWarning
    ignore:`numpy.typing.mypy_plugin` is deprecated:DeprecationWarning
    ignore:Due to \'_pack_\', the
    ignore::pytest.PytestAssertRewriteWarning
