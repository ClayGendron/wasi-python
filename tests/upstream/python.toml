# The classes of known failures (Decision 12): a failed or errored test goes to the first class of
# its group whose outcome and `match` (a regular expression searched in the one-line reason) fit.

[[expected]]
id = "no-ctypes"
group = "cpython-fs"
outcome = "error"
match = 'ctypes is unavailable'
reason = "no ctypes calls: the stand-in imports, so the tests run, and every call raises OSError (README)"
closes_with = "README.md"

[[expected]]
id = "no-mmap"
group = "cpython-fs"
outcome = "error"
match = "mmap is unavailable|cannot access local variable 'm'"
reason = "no mmap: pandas imports mmap unconditionally, so the stand-in imports, and every map raises OSError (README)"
closes_with = "README.md"

[[expected]]
