# CPython's own tests in the guest (spec 065). A judge file: every edit is a judge change.
#
# runner        regrtest: CPython's own runner, run in one guest process per group (Decision 9)
# component     the source component whose pinned tarball holds Lib/test (the need and the tie)
# grant         the stage's own read-only grant, apart from numpy's and pandas' (Decision 15)
# resources     -u for regrtest: CPython's own `make test` less largefile (Decision 15)
# options       --fail-env-changed, as CPython's CI (Decision 5)
# warnings      "error": the warnings half of CI's `-W error -bb` (Decision 8)
# [groups.*]    one guest session and one check each: `list` names the plan file (one module per
#               line, in run order) and `fuel` the cap (Decision 10)
# not_selected  modules that fail to load, listed nowhere, each with its reason and closer (11)
# trap          tests that end the guest in a trap: deselected from their group on every host by
#               full id, each run alone by its own check (Decision 1)
# expected      classes of known failures, listed by test id under expected/<group>/ (Decision 12)
# deselected    tests that must not run, by full id, each a gap (Decision 21)
# environment   modules allowed to leave the environment altered, by kind of change (Decision 21)
# host_dependent results that differ by host, recorded per system (Decision 21; none today)
#
# The driver's adaptations, with their reasons, are in tests/upstream/regrtest_drive.py: A2 (make
# /tmp), A1 (single.clear_caches gives the ctypes stand-in a no-op _reset_cache, until spec 074),
# and -W error.

package = "python"
runner = "regrtest"
component = "cpython"
grant = "/cpython"
resources = "all,-cpu,-gui,-largefile"
options = ["--fail-env-changed"]
warnings = "error"

[groups.cpython-fs]
list = "python/cpython-fs.txt"
fuel = 100_000_000_000

[groups.cpython-archives]
list = "python/cpython-archives.txt"
fuel = 250_000_000_000

[groups.cpython-a]
list = "python/cpython-a.txt"
fuel = 410_000_000_000

[groups.cpython-b]
list = "python/cpython-b.txt"
fuel = 490_000_000_000

[groups.cpython-c]
list = "python/cpython-c.txt"
fuel = 560_000_000_000

[[not_selected]]
modules = ["test_ctypes"]
reason = "the ctypes stand-in imports, then every use raises OSError (README: no ctypes)"
closes_with = "README.md"

[[not_selected]]
modules = ["test_code", "test_genericalias"]
reason = "they name ctypes.pythonapi, py_object and Array at import, which the stand-in lacks (spec 074, follow-up A)"
closes_with = "context/research/2026-10-18-cpythons-own-tests-under-the-runtime.md"

[[not_selected]]
modules = ["test_class", "test_with", "test_getpath"]
reason = "an unguarded import of _testinternalcapi, which --disable-test-modules leaves out (question 101 answered: spec 088, the judge-only binary)"
closes_with = "context/roadmap.md"

[[not_selected]]
modules = ["test_ensurepip", "test_venv", "test_sysconfig"]
reason = "ensurepip and venv are not in the zip (no pip, no venv: constitution section 3); test_sysconfig imports test.support.venv"
closes_with = "README.md"

[[not_selected]]
modules = ["test_ast"]
reason = "one module-level line lists the stdlib's folder (test_ast/test_ast.py:41), which is a zip"
closes_with = "README.md"

[[not_selected]]
modules = ["test_time", "test_calendar", "test_strptime", "test_os.test_posix"]
reason = "platform.libc_ver() at import opens sys.executable, a file the guest does not have (spec 074, follow-up A: sys.executable empty)"
closes_with = "context/research/2026-10-18-cpythons-own-tests-under-the-runtime.md"

