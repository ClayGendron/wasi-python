# pandas 3.1.0's [tool.pytest.ini_options], transcribed (spec 050, Decision 6): its
# filterwarnings, xfail_strict and empty_parameter_set_mark. Its markers are registered by its
# pandas/conftest.py, which the driver stages. Not its addopts' --capture=no or --durations
# (the driver's options are Decision 5's).
[pytest]
empty_parameter_set_mark = fail_at_collect
xfail_strict = true
filterwarnings =
    error
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
    error::pytest.PytestWarning
    ignore::pytest.PytestCacheWarning
    ignore:.*encoding.* argument not specified:EncodingWarning
    error:.*encoding.* argument not specified:EncodingWarning:pandas
    ignore:unclosed database in <sqlite3.Connection object*:ResourceWarning
    ignore:.*FileIO:pytest.PytestUnraisableExceptionWarning
    ignore:More than 20 figures have been opened:RuntimeWarning
    ignore:BuiltinImporter.module_repr() is deprecated and slated for removal in Python 3.12:DeprecationWarning
    ignore:Bitwise inversion:DeprecationWarning
    ignore:Plugin file tracers
    ignore:Couldn't import C tracer
    ignore:.*grpcio.*Post-Quantum Cryptography:FutureWarning
    ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:fastparquet
