via = "sqlite3"

[package.zstd]
# libzstd, linked into _zstd: CPython's test_zstd reaches it, and the zstd cases of test_tarfile,
# test_zipfile, test_zipfile64, test_zipimport and test_shutil.
kind = "via"
via = "compression.zstd"

