# drawsvg, a project that ships no tests: its golden job holds the guest to native Python on
# drawsvg's own code, which says the interpreters agree, not that drawsvg's SVG is right.

[package.drawsvg]
kind = "none"
reason = "drawsvg 2.4.2 ships no tests: none in its sdist, none in its repository at the 2.4.2 tag or at master (read 2026-10-31)"
checked_by = ["vector_drawings", "svg_to_png"]
# SVG to PNG through cairo: the three C libraries and cffi's C backend are reached through
# cairocffi's suite, which calls every part of cairo the bindings declare, through the backend;
# cffi's own C tests make ABI-mode calls, which the guest cannot make. The packages' suites come
# from their sdists.

[package.pixman]
kind = "via"
via = "cairocffi"

[package.libpng]
kind = "via"
via = "cairocffi"

[package.cairo]
kind = "via"
via = "cairocffi"

[package.cffi]
kind = "via"
via = "cairocffi"

[package.cairocffi]
# its own suite from its sdist, groups in tests/upstream/cairocffi.toml: test_cairo.py in the
