# Every component of the artifact names its own test suite, or why it does not run yet (spec 063,
# Decision 15). One [package.<name>] per name in paths.PACKAGES, needs.SOURCE_COMPONENTS (cpython is
# python, sqlite is sqlite-autoconf) and the linked runtimes; the judge checks it
# (test_every_package_names_its_own_suite). Kinds:
#   suite       its groups are in tests/upstream/<name>.toml and in a release shard
#   via         its own suite cannot run here; `via` names what reaches it: a suite or later entry,
#               python, or a module of stdlib_modules
#   build-only  used only to compile another package; `reason`
#   later       `reason`, and `closes_with` naming the specification (written or reserved in
#               context/roadmap.md) that runs its suite
#   none        the project ships no tests at its pinned version, in its sdist or in its
#               repository at the release's tag; `reason` says where that was read, and
#               `checked_by` names the golden jobs (tests/jobs/) that import and run it. Refused
#               when tests/upstream/<name>.toml exists, or when a named job does not import one of
#               its names in recipes/snapshot-packages.txt. A version move reads its sdist and its
#               repository's tag again and rewrites `reason`.
# A specification that adds a package adds its entry (AGENTS.md).

stdlib_modules = ["zlib", "bz2", "lzma", "sqlite3", "compression.zstd"]

[package.numpy]
kind = "suite"

[package.pandas]
kind = "suite"

[package.python]
# CPython's own suite (regrtest), five groups in tests/upstream/python.toml (spec 065).
kind = "suite"

[package.wasi-libc]
kind = "via"
via = "python"

[package.llvm-runtimes]
# libc++, libc++abi, libunwind, compiler-rt: linked into every binary.
kind = "via"
via = "python"

[package.zlib]
kind = "via"
via = "zlib"

[package.bzip2]
kind = "via"
via = "bz2"

[package.xz]
kind = "via"
via = "lzma"

[package.sqlite-autoconf]
