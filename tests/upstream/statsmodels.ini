# statsmodels' own pytest settings (its pyproject.toml), transcribed. Left out, each for its
# reason: --durations and --junitxml (reports, not selection), junit_family (the same),
# --randomly-dont-reset-seed (an option of a plugin neither the kit nor the tests need),
# --strict (the driver passes --strict-markers, its current name). Registered here: two
# markers its tests use and the sdist registers nowhere.
[pytest]
minversion = 8.4.1
xfail_strict = true
empty_parameter_set_mark = fail_at_collect
filterwarnings =
    ignore:`formatargspec`:DeprecationWarning:statsmodels
    ignore:Using or importing:DeprecationWarning
    ignore:Session._key_changed is deprecated:DeprecationWarning
    error:Support for multi-dimensional:DeprecationWarning
    error:Mutating unit root tests is deprecated:FutureWarning
    error:Lag selection has changed:DeprecationWarning
    error:More than 20 figures have been opened:RuntimeWarning:
    error:Inequality constraints incompatible::
    error:Parameters are not consistent with a::
    ignore:The --strict option is deprecated:pytest.PytestDeprecationWarning
    error:The default for reindex:FutureWarning:
    error:Values in x were outside bounds:RuntimeWarning:
    error:The random_state property is deprecated:FutureWarning
    error:random_state is deprecated:FutureWarning
    error:seed is deprecated:FutureWarning
    error:get_state is deprecated:FutureWarning
    error:Conversion of an array with ndim:DeprecationWarning:
    error:the matrix subclass is not the recommended::
    error:The Dataframe Interchange Protocol::
    error:Setting the shape:DeprecationWarning:
    error:After 0.17 or January 2028:FutureWarning:
    error:A future version of pandas:
    error:The inplace keyword in::
    error:Keyword arguments have been passed:FutureWarning:
    error:After statsmodels 0.15 is released:FutureWarning:
    error:Passing `None` as the seed currently:FutureWarning:
    error:the 'random_state' keyword is deprecated:FutureWarning:
    error:the 'seed' keyword is deprecated:FutureWarning:
    error:the 'center' keyword is deprecated:FutureWarning:
    error:Unpacking:FutureWarning:
    error:The test statistic is outside:statsmodels.tools.sm_exceptions.InterpolationWarning:
    error:The design matrix is:statsmodels.tools.sm_exceptions.SingularMatrixWarning:
    error:Fast medcouple algorithm:UserWarning:
    error:medcouple is undefined:UserWarning:
    error:Provided `endog` series:UserWarning:
markers =
    example: mark a test that runs example code
    matplotlib: mark a test that requires matplotlib
    slow: mark a test as slow
    smoke: mark a test as a smoke test
    high_memory: mark a test as a high memory utilization test
    low_precision: mark a test as low precision
    todo: mark a test as incomplete
    polars: mark a test that requires polars
    singleton_randomstate: mark a test as changing the singleton RandomState
    joblib: mark a test as using joblib for parallel computation
    thread_unsafe: pytest-run-parallel's marker
    skip_randomstate_check: statsmodels' marker its conftest reads
