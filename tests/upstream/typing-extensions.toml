# typing-extensions's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "typing-extensions"
driver = "package"
grant = "/upstream-typing-extensions"
test_source = true
wheel = "typing_extensions-4.16.0-py3-none-any.whl"
budget = 29_000_000_000
stage_folders = []
support_files = ["src/test_typing_extensions.py", "src/_typed_dict_test_helper.py"]
extra_sys_path = ["src"]
cwd = "tree"
markers = []

[groups.typing-extensions-smoke]
paths = ["src/test_typing_extensions.py"]
docstring_modules = ["typing_extensions"]
smoke = "the whole suite: a smaller smoke group would cost as much, a session's start being most of it"
fuel = 29_000_000_000
measured = 18_832_226_118

[[expected]]
id = "no-processes"
group = "typing-extensions-smoke"
outcome = "failed"
match = "wasi does not support processes|has no attribute 'pipe'|_multiprocessing|multiprocessing\\.synchronize|_posixsubprocess|has no attribute 'fork'|ProcessPoolExecutor|BrokenProcessPool|has no attribute 'getppid'"
reason = "no processes: the guest cannot start one (README)"
closes_with = "README.md"

[[expected]]
id = "python-3-15"
group = "typing-extensions-smoke"
outcome = "failed"
match = "Tuples differ: \\(\\[\\],\\) != \\(\\[\\], \\[\\]\\)|anonymous_sentinel|frozendict|list\\.remove\\(x\\): x not in l|has no attribute 'makeSuite'|ResourceWarnin"
reason = "the test expects an older CPython's behaviour or message (typing, ElementTree, unittest), and the product is CPython 3.15 (README)"
closes_with = "README.md"

