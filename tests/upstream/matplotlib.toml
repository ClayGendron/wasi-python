# matplotlib's own tests in the guest (spec 066). A judge file: every edit is a judge change.
#
# driver = "package"  a family of its own: grant /upstream-matplotlib, stage, kit copy, budget
# stage_folders       tarball folders staged under the grant's tree/ (members only)
# support_files       tarball members staged as data, never imported (cm.pyi, read by test_typing)
# package_paths       product package -> staged folder appended to its __path__
# support_packages    product subpackages the zip leaves out, found through package_paths
# cwd                 /tmp/work (matplotlib writes ./result_images/) or "tree" (the tree root)
# [groups.*]          one guest session and one check each; fuel cap 1.5 times the fuel the
#                     re-survey measured (decisions.md, "Every test of every package we build")
# budget              the sum of the family's caps

package = "matplotlib"
driver = "package"
grant = "/upstream-matplotlib"
budget = 5_494_000_000_000
stage_folders = [
    "lib/matplotlib/tests",
