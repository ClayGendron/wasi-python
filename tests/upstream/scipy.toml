    "scipy/special/tests/test_round.py",
]
reason = "each imports one of scipy's test-only C modules (_test_ccallback, _test_multivariate, _ctest, _cytest, _test_internal), which the product leaves out on purpose; the judge-only binary the roadmap reserves (088) links them; it fails to load without them"
