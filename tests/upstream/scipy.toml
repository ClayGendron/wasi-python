# scipy's own tests in the guest. A judge file: every edit is a judge change.
#
# The suite runs whole in the release tier, before a publication; two smoke groups run in the
# normal tier at every check, chosen to touch every compiled subpackage and every carried patch
# (smoke_cover says which file or golden job line covers each). Every test runs in exactly one
# tier: the smoke groups run upstream's normal marker, a marker release group runs their slow and
# very slow cases, and the path release groups run every other staged file whole.
#
# stage_folders   every top-level tests folder of the sdist but scipy.odr's (out of this line:
#                 the product's scipy.odr is a stand-in module)
# package_inits   the ancestors' __init__.py are staged too, so pytest names every module by its
#                 package; the generated package_paths entries are the product's own packages
# derived         the three tables scipy's build makes from its text data for special's tests,
#                 made in the guest from staged members; their facts are on derived_row's row
# env             set for every run of the family, each with its reason
# [groups.*]      one guest session and one check each; cap 1.5 times the measured fuel

package = "scipy"
driver = "package"
grant = "/upstream-scipy"
budget = 97_807_000_000_000
stage_folders = [
    "scipy/_lib/tests",
    "scipy/cluster/hierarchy/tests",
    "scipy/cluster/vq/tests",
    "scipy/constants/tests",
    "scipy/datasets/tests",
    "scipy/differentiate/tests",
    "scipy/fft/_duccfft/tests",
    "scipy/fft/tests",
    "scipy/fftpack/tests",
    "scipy/integrate/_ivp/tests",
    "scipy/integrate/tests",
    "scipy/interpolate/tests",
    "scipy/io/_harwell_boeing/tests",
    "scipy/io/arff/tests",
    "scipy/io/matlab/tests",
    "scipy/io/tests",
    "scipy/linalg/tests",
    "scipy/ndimage/tests",
    "scipy/optimize/_trustregion_constr/tests",
    "scipy/optimize/tests",
    "scipy/signal/tests",
    "scipy/sparse/csgraph/tests",
    "scipy/sparse/linalg/_dsolve/tests",
    "scipy/sparse/linalg/_eigen/arpack/tests",
    "scipy/sparse/linalg/_eigen/lobpcg/tests",
    "scipy/sparse/linalg/_eigen/tests",
    "scipy/sparse/linalg/_isolve/tests",
    "scipy/sparse/linalg/tests",
    "scipy/sparse/tests",
    "scipy/spatial/tests",
    "scipy/spatial/transform/tests",
    "scipy/special/tests",
    "scipy/stats/tests",
]
package_inits = true
support_files = [
    "scipy/conftest.py",
    "scipy/special/utils/makenpz.py",
]
marker = "not slow and not xslow"
release_marker = "slow or xslow"
derived_row = "scipy-special-1"
cwd = "/tmp/work"
markers = []

[env.SCIPY_XSLOW]
value = "1"
reason = "scipy's very slow cases run, in whichever tier their file is in; its tests read the variable outside their marker too, so it is set for every group"

[[derived]]
script = "scipy/special/utils/makenpz.py"
args = ["boost"]
inputs = "scipy/special/tests/data/boost"
output = "scipy/special/tests/data/boost.npz"
measured = 5_780_000_000
fuel = 8_700_000_000

[[derived]]
script = "scipy/special/utils/makenpz.py"
args = ["gsl"]
inputs = "scipy/special/tests/data/gsl"
output = "scipy/special/tests/data/gsl.npz"
measured = 1_240_000_000
fuel = 1_900_000_000

[[derived]]
