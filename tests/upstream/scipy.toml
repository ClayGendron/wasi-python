reason = "the hypothesis case for hyp1f1 does not finish in the guest: in its group it ran past about 10 T of fuel, about 20 minutes, and was stopped; alone it runs out of the trap's 50 G. Why its drawn arrays keep hyp1f1 computing is not read yet (README)"
