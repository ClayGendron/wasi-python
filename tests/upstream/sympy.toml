docstring_flags = 44
# Not doctested, as sympy's own doctest runner leaves them out (its doctest blacklist):
#   sympy.core.compatibility: a backwards-compatibility shim: importing it warns
#   sympy.core.trace: a backwards-compatibility shim: importing it warns
#   sympy.galgebra: no longer part of SymPy: importing it raises
#   sympy.this: it prints text
#   sympy.parsing.autolev: it needs antlr4, which the product lacks; the rest is generated code
#   sympy.parsing.latex._antlr: generated code, and it needs antlr4
#   sympy.parsing.latex._parse_latex_antlr: it needs antlr4
#   sympy.parsing.sym_expr: it needs lfortran
#   sympy.plotting.pygletplot: it needs pyglet, and upstream leaves it out on CI
#   sympy.printing.aesaracode: it needs aesara
#   sympy.testing.randtest: a deprecated stub: importing it warns
#   sympy.utilities.autowrap: upstream disabled it for doctest failures on its bot
#   sympy.utilities.tmpfiles: a deprecated stub to be removed
#   sympy.utilities.pytest: a deprecated stub to be removed
#   sympy.utilities.runtests: a deprecated stub to be removed
#   sympy.utilities.randtest: a deprecated stub to be removed
#   doc/src/modules/plotting.rst: it draws live plots
#   doc/src/modules/numeric-computation.rst: it needs aesara, cupy and jax

