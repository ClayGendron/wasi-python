[pytest]
python_files = test_*.py *_test.py *_solution.py
xfail_strict = true
markers =
    gettz
    import_star
    isoparser
    parserinfo
    rrule
    rruleset
    rrulestr
    smoke
    tz_resolve_imaginary
    tzfile
    tzlocal
    tzoffset
    tzstr
    no_cover: pytest-cov's marker, which the conftest adds
filterwarnings =
    error
    error::DeprecationWarning
    error::PendingDeprecationWarning
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
