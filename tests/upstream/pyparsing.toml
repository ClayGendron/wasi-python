# pyparsing's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "pyparsing"
driver = "package"
grant = "/upstream-pyparsing"
test_source = true
wheel = "pyparsing-3.3.3-py3-none-any.whl"
budget = 1_092_000_000_000
stage_folders = ["tests", "examples"]
extra_sys_path = ["."]
cwd = "tree"
markers = []

[groups.pyparsing-smoke]
paths = ["tests/test_simple_unit.py", "examples/tiny/tests"]
smoke = "a few files that import the package from the zip and run its core paths"
fuel = 22_000_000_000
measured = 14_078_557_904

[groups.pyparsing-r-unit-1]
paths = ["tests/test_unit.py"]
tier = "release"
release_by = "path"
fuel = 120_000_000_000
measured = 79_535_447_260

[groups.pyparsing-r-unit-2]
paths = ["tests/test_unit.py"]
tier = "release"
release_by = "path"
fuel = 150_000_000_000
measured = 94_870_386_414

[groups.pyparsing-r-unit-3]
paths = ["tests/test_unit.py"]
tier = "release"
release_by = "path"
fuel = 150_000_000_000
measured = 94_975_456_694

[groups.pyparsing-r-unit-4]
paths = ["tests/test_unit.py"]
tier = "release"
release_by = "path"
