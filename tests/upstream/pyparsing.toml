[groups.pyparsing-r]
paths = [
    "tests/test_examples.py",
    "tests/test_matplotlib_cases.py",
    "tests/test_pep8_converter.py",
    "tests/test_pre_pep8_deprecation_warnings.py",
    "tests/test_testing.py",
    "tests/test_util.py",
    "examples/test_bibparse.py",
]
tier = "release"
release_by = "path"
fuel = 210_000_000_000
measured = 135_886_394_007

[[split]]
file = "tests/test_unit.py"
groups = [
    "pyparsing-r-unit-1",
    "pyparsing-r-unit-2",
    "pyparsing-r-unit-3",
    "pyparsing-r-unit-4",
    "pyparsing-r-unit-5",
    "pyparsing-r-unit-6",
]
keywords = [
    "Test02_WithoutPackrat",
    "Test03_EnablePackratParsing or Test04_WithPackrat",
    "Test05_EnableBoundedPackratParsing or Test06_WithBoundedPackrat",
    "Test07_EnableUnboundedPackratParsing or Test08_WithUnboundedPackrat",
    "Test09_WithLeftRecursionParsing",
]

[[not_selected]]
files = ["tests/test_diagram.py"]
reason = "it imports railroad (railroad-diagrams) at module level, and every test in it draws a diagram with it: the product lacks pyparsing's diagram feature"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "no-processes"
group = "pyparsing-r-unit-6"
outcome = "failed"
match = "wasi does not support processes|has no attribute 'pipe'|_multiprocessing|multiprocessing\\.synchronize|_posixsubprocess|has no attribute 'fork'|ProcessPoolExecutor|BrokenProcessPool|has no attribute 'getppid'"
reason = "no processes: the guest cannot start one (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "pyparsing-no-railroad"
group = "pyparsing-r"
outcome = "failed"
match = "pyparsing\\[diagrams\\]"
reason = "the example draws a railroad diagram, and railroad is not in the product (README)"
closes_with = "docs/reference/limitations.md"

