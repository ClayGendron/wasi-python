# tomli-w's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "tomli-w"
driver = "package"
grant = "/upstream-tomli-w"
test_source = true
wheel = "tomli_w-1.2.0-py3-none-any.whl"
budget = 21_000_000_000
stage_folders = ["tests", "benchmark"]
extra_sys_path = ["."]
cwd = "tree"
markers = []
kit_extra = ["tomli"]

[groups.tomli-w-smoke]
paths = ["tests"]
smoke = "the whole suite: a smaller smoke group would cost as much, a session's start being most of it"
fuel = 21_000_000_000
measured = 13_535_428_450

