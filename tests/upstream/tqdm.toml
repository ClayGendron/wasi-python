# tqdm's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "tqdm"
driver = "package"
grant = "/upstream-tqdm"
test_source = true
wheel = "tqdm-4.70.1-py3-none-any.whl"
budget = 38_000_000_000
stage_folders = ["tests"]
extra_sys_path = ["."]
cwd = "tree"
markers = []
kit_extra = ["pytest-asyncio"]

[groups.tqdm-smoke]
paths = ["tests"]
smoke = "the whole suite: a smaller smoke group would cost as much, a session's start being most of it"
fuel = 38_000_000_000
measured = 24_683_197_530

[[expected]]
id = "no-asyncio-loop-error"
group = "tqdm-smoke"
outcome = "error"
match = "\\[Errno 58\\] Not supported|unraisable exception warnings|Exception ignored while calling deallocator"
reason = "an operation WASI does not support answers ENOTSUP: asyncio's event loop opens a socket pair for its self-pipe, and what a failed loop leaves behind is reported at teardown (README)"
closes_with = "README.md"

[[expected]]
id = "no-processes-error"
group = "tqdm-smoke"
outcome = "error"
match = "wasi does not support processes|has no attribute 'pipe'|_multiprocessing|multiprocessing\\.synchronize|_posixsubprocess|has no attribute 'fork'|ProcessPoolExecutor|BrokenProcessPool|has no attribute 'getppid'"
reason = "no processes: the guest cannot start one (README)"
closes_with = "README.md"

[[expected]]
id = "no-processes"
group = "tqdm-smoke"
outcome = "failed"
match = "wasi does not support processes|has no attribute 'pipe'|_multiprocessing|multiprocessing\\.synchronize|_posixsubprocess|has no attribute 'fork'|ProcessPoolExecutor|BrokenProcessPool|has no attribute 'getppid'"
reason = "no processes: the guest cannot start one (README)"
closes_with = "README.md"

[[expected]]
id = "no-threads-error"
group = "tqdm-smoke"
outcome = "error"
match = "can't start new thread|thread constructor failed|start_new_thread|unable to start watchdog thread|TqdmMonitorWarning|instances still in existence|'NoneType' object does not support the context manager protocol"
reason = "no threads: the guest cannot start one (README), so tqdm's monitor and write locks are absent too"
closes_with = "README.md"

[[expected]]
id = "no-threads"
group = "tqdm-smoke"
outcome = "failed"
match = "can't start new thread|thread constructor failed|start_new_thread|unable to start watchdog thread|TqdmMonitorWarning|instances still in existence|'NoneType' object does not support the context manager protocol"
reason = "no threads: the guest cannot start one (README), so tqdm's monitor and write locks are absent too"
closes_with = "README.md"

