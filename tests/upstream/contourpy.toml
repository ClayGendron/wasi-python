# contourpy's own tests in the guest (spec 066). A judge file: every edit is a judge change.
# The keys are matplotlib.toml's. A [[split]] names one file too big for one group, its groups in
# order, and one -k expression fewer than groups: group i runs "(e_i) and not (e_1 or ... e_i-1)",
# the last "not (e_1 or ... e_n-1)", so every collected test of the file is in exactly one group
# (Decision 11; the owner, "Every test of every package we build", 2026-10-20).

package = "contourpy"
driver = "package"
grant = "/upstream-contourpy"
budget = 6_630_000_000_000
stage_folders = ["tests"]
extra_sys_path = ["."]
cwd = "tree"  # compare_images opens tests/baseline_images/... by a relative path (the re-survey)
markers = []

[groups.contourpy-1]
paths = [
    "tests/test_array.py",
    "tests/test_build_config.py",
    "tests/test_chunk.py",
    "tests/test_config.py",
    "tests/test_constructor.py",
    "tests/test_convert.py",
    "tests/test_dechunk.py",
    "tests/test_enum.py",
]
