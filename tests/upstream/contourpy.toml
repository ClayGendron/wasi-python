# contourpy's own tests in the guest. A judge file: every edit is a judge change.
# The keys are matplotlib.toml's. A [[split]] names one file too big for one group, its groups in
# order, and one -k expression fewer than groups: group i runs "(e_i) and not (e_1 or ... e_i-1)",
# the last "not (e_1 or ... e_n-1)", so every collected test of the file is in exactly one group
# of the split. Every test of every package we build runs (the owner, 2026-10-20).
#
# Two tiers. The normal tier runs at every check; the release tier only before a publication.
# Which tests are slow is the project's choice, and nothing is left out of both (the owner,
# 2026-10-20). contourpy's are its own `slow` marker (--runslow's 1000 by 1000 cases) and its
# `random_big` cases, which its own CI leaves out of its emulated legs (-k "not big"). Normal
# groups run `marker`; marker release groups `release_marker`; keyword release groups `marker`
# with the [[release_select]] keyword, and a normal group over one of its files the keyword's
# negation. A split's groups share one tier and one kind.

package = "contourpy"
driver = "package"
grant = "/upstream-contourpy"
budget = 8_865_000_000_000
stage_folders = ["tests"]
extra_sys_path = ["."]
# compare_images opens tests/baseline_images/... by a relative path and, when an image differs,
# writes result_images/ beside it: a writable folder holding a copy of the baselines (with the
# read-only tree root, a differing text image failed on the write instead)
