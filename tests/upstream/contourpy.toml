# test_filled.py, split per tier and kind: its random_big cases (the keyword release tier), its
# ten slow cases (the marker release tier, about 91 G each), and the rest (the normal tier).
[[split]]
file = "tests/test_filled.py"
groups = [
    "contourpy-filled-1",
    "contourpy-filled-2",
    "contourpy-filled-3",
    "contourpy-filled-4",
    "contourpy-filled-5",
    "contourpy-filled-6",
    "contourpy-filled-7",
]
keywords = [
    "random_big and serial and None",
    "random_big and serial and False",
    "random_big and serial and True",
    "random_big and threaded and None",
    "random_big and threaded and False",
    "random_big and threaded and True",
]

