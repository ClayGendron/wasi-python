reason = "contourpy's --runtext baselines differ from the text matplotlib 3.11.2 with FreeType 2.14.3 draws here, past contourpy's thresholds (max 100, mean 0.02): the same images without text match (max at most 52 of 255, mean at most 0.0003), with text max 255 and mean 3.5 to 8.4 (contourpy's own image-difference log, the build); contourpy's own CI runs --runtext on one pinned configuration; native matplotlib at the same pins fails the same way (the confirming review, EXECUTED)"
