# Every test (the owner, "Every test of every package we build"): contourpy's own opt-in slow
# and text cases run too. --runslow stays so its conftest does not skip a slow case before -m
# sees it; the tier decides where each runs.
args = ["--runslow", "--runtext"]
marker = "not slow"
release_marker = "slow"

