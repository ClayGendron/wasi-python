[[expected]]
id = "numpy-2-promotion"
group = "mpmath-smoke"
outcome = "failed"
match = "assert np\\.float16\\(0\\.0\\) < \\(2\\.0 \\*\\* -53\\)"
reason = "mpmath 1.3.0's test predates numpy 2's promotion rules (NEP 50): the Python float bound is cast to float16 and underflows to 0 (README)"
closes_with = "docs/reference/limitations.md"

