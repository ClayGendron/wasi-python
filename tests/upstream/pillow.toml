# Pillow's own tests in the guest (spec 066). A judge file: every edit is a judge change.
# The keys are matplotlib.toml's. Tests/oss-fuzz/test_fuzzers.py runs (the review, H2): it imports
# its sibling fuzzers, so Tests/oss-fuzz is on extra_sys_path.

package = "pillow"
driver = "package"
grant = "/upstream-pillow"
budget = 910_000_000_000
stage_folders = ["Tests", "checks"]
# selftest.py: Pillow's doctest self-test (its Makefile runs it), run by docstring
support_files = ["selftest.py"]
docstring_modules = ["selftest"]
extra_sys_path = [".", "Tests/oss-fuzz"]
cwd = "tree"  # Pillow opens Tests/images/... by relative paths; none of its failures is the folder's
markers = []

[groups.pillow]
paths = ["Tests", "checks"]
fuel = 910_000_000_000
measured = 605_066_723_558

[[not_selected]]
files = ["Tests/test_main.py"]
reason = "every case runs python -m PIL in a subprocess (no processes on WASI)"
closes_with = "docs/reference/limitations.md"

[[not_selected]]
files = ["checks/check_release_notes.py"]
reason = "it reads docs/releasenotes/*.rst for a leftover TODO: Pillow's documentation, not staged and not the product"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "no-mmap"
group = "pillow"
outcome = "failed"
match = 'mmap is unavailable'
reason = "no mmap: the stand-in raises OSError (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "no-mmap-silent"
group = "pillow"
outcome = "failed"
match = '^assert None is not None$|^assert 0$'
reason = "Pillow falls back from mmap silently, so a test that checks for a mapped buffer or readonly == 1 fails on the fallback (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "builtin-no-file"
group = "pillow"
outcome = "failed"
match = "has no attribute '__file__'"
reason = "PIL._imaging is a builtin module, without __file__ (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "wasm32-memory"
group = "pillow"
outcome = "failed"
match = 'Out of memory|MemoryError'
reason = "python.wasm declares no maximum memory, so wasm32's 4 GiB bounds it; these decompression samples ask for more (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "open-empty-path"
group = "pillow"
outcome = "failed"
match = "Is a directory: ''"
reason = "in the guest open('') answers IsADirectoryError (EISDIR), where the test expects FileNotFoundError (README)"
closes_with = "docs/reference/limitations.md"

[[not_selected]]
files = ["checks/32bit_segfault_check.py"]
reason = "a script, not a test: on a 32-bit Python it asks for a 999,999-square image so that a native build raises MemoryError instead of crashing; pytest reports that expected MemoryError as a collection error. In the guest it raises MemoryError, as the script means (EXECUTED, the build)"
closes_with = "docs/reference/limitations.md"

[[not_selected]]
files = ["checks/check_icns_dos.py", "checks/check_j2k_dos.py"]
reason = "denial-of-service reproductions, not tests: each passes when Image.open returns or raises without hanging; pytest reports the expected UnidentifiedImageError at import as a collection error. In the guest each raised it at once (EXECUTED, the build); JPEG 2000 is not in the product (zlib and JPEG only, specs 023 and 170)"
closes_with = "context/specifications/023-matplotlib-first-milestone.md"

[[not_selected]]
files = ["checks/check_fli_oob.py", "checks/check_jp2_overflow.py"]
reason = "valgrind reproductions run by hand, not tests: each opens its crash samples by a path relative to the folder it is run from (images/fli_oob/... from Tests/, 00r0_gray_l.jp2 and 00r1_graya_la.jp2 from Tests/images/) and prints each exception, so at the tree root its first open raises FileNotFoundError at import, a collection error (EXECUTED, the build); every one of those samples is loaded by Tests/oss-fuzz/test_fuzzers.py::test_fuzz_images, which runs and passes"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "no-resource-module"
group = "pillow"
outcome = "failed"
match = "Unsupported platform for standard library module 'resource'"
reason = "WASI has no resource module (getrusage), which checks/check_imaging_leaks.py measures memory with (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "not-pillows-wheel"
group = "pillow"
outcome = "failed"
match = "^AssertionError: assert (\\{|set\\(\\) ==)"
reason = "checks/check_wheel.py asserts the modules, codecs and features of Pillow's PyPI wheels; the product builds Pillow with zlib and JPEG only (specs 023 and 170)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "fli-overflow-native"
group = "pillow"
outcome = "failed"
match = "unrecognized data stream contents"
reason = "checks/check_fli_overflow.py wants the crafted overflow file to load without raising; the repo's oracle, native Pillow 13.0.0, raises the same OSError (EXECUTED, the build), and Pillow's own test commands never run this check (testpaths = Tests): an upstream check that fails natively too, and does not crash in the guest"
closes_with = "context/upstream/32-pillow-check-fli-overflow/notes.md"
