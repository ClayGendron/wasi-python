# plotly 7.1.0's pytest settings from its pyproject.toml, transcribed: its two markers. One ignore:
# the driver imports the package before pytest, so pytest cannot rewrite it.
[pytest]
markers =
    nodev: mark a test as nodev
    matplotlib: mark a test as matplotlib
filterwarnings =
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
