# pandas' own tests in the guest (spec 050). A judge file: every edit is a judge change.
# The keys are numpy.toml's. `support` names files staged for import but not collected: tests in
# two groups import pandas.tests.extension.decimal (groupby/aggregate/test_other.py,
# reshape/concat/test_concat.py). The Styler's eight templates are staged where pandas' own tests
# read them by path, beside the tests as in pandas' source tree (style/test_html.py's `env`
# fixture and `test_html_template_extends_options`; spec 041): the product reads its own copies
# from the zip, through the carried patch.

package = "pandas"
marker = "not slow and not network and not db"
args = ["--no-strict-data-files"]
path_packages = ["pandas"]
markers = []
support = [
    "pandas/conftest.py",
    "pandas/tests/extension/__init__.py",
    "pandas/tests/extension/decimal/__init__.py",
    "pandas/tests/extension/decimal/array.py",
    "pandas/io/formats/templates/html.tpl",
    "pandas/io/formats/templates/html_style.tpl",
    "pandas/io/formats/templates/html_table.tpl",
    "pandas/io/formats/templates/latex.tpl",
    "pandas/io/formats/templates/latex_longtable.tpl",
    "pandas/io/formats/templates/latex_table.tpl",
    "pandas/io/formats/templates/string.tpl",
    "pandas/io/formats/templates/typst.tpl",
]

[groups.pandas-frame]
paths = ["pandas/tests/frame"]
fuel = 520_000_000_000

[groups.pandas-groupby]
paths = ["pandas/tests/groupby"]
fuel = 720_000_000_000

[groups.pandas-reshape]
paths = ["pandas/tests/reshape"]
fuel = 160_000_000_000

[groups.pandas-io-parser]
paths = ["pandas/tests/io/parser"]
fuel = 135_000_000_000

[groups.pandas-io-formats]
paths = ["pandas/tests/io/formats"]
fuel = 120_000_000_000

[groups.pandas-tslibs]
paths = ["pandas/tests/tslibs"]
fuel = 59_000_000_000

[groups.pandas-internals]
paths = ["pandas/tests/internals"]
fuel = 28_000_000_000

[groups.pandas-libs]
paths = ["pandas/tests/libs"]
fuel = 35_000_000_000

# The classes of known failures (Decision 10): a failed or errored test goes to the first class
# of its group whose outcome and `match` (a regular expression searched in the one-line reason)
# fit. Each class's members are listed in expected/<group>/<id>.txt and admitted as one gap.
# A class a fix emptied keeps its id, an empty list and the closer that emptied it, as a record,
# and has no gap (C1). Failures that come back need a gap with a new closer, not this one.

[[expected]]
id = "zip-code-names"
group = "pandas-frame"
outcome = "failed"
match = 'Warning not set with correct stacklevel'
reason = "the zip's code objects carry relative file names, so pandas' warnings point inside pandas"
closes_with = "context/specifications/051-what-the-upstream-tests-found.md"

[[expected]]
id = "zip-code-names"
group = "pandas-groupby"
outcome = "failed"
match = 'Warning not set with correct stacklevel'
reason = 'the same'
closes_with = "context/specifications/051-what-the-upstream-tests-found.md"

[[expected]]
id = "zip-code-names"
group = "pandas-reshape"
outcome = "failed"
match = 'Warning not set with correct stacklevel'
reason = 'the same'
closes_with = "context/specifications/051-what-the-upstream-tests-found.md"

[[expected]]
id = "zip-code-names"
group = "pandas-io-parser"
outcome = "failed"
match = 'Warning not set with correct stacklevel'
reason = 'the same'
closes_with = "context/specifications/051-what-the-upstream-tests-found.md"

[[expected]]
id = "no-mmap"
group = "pandas-io-parser"
outcome = "failed"
match = 'mmap is unavailable'
reason = 'no mmap on WASI'
closes_with = "README.md"

[[expected]]
id = "zip-code-names"
group = "pandas-io-formats"
outcome = "failed"
match = 'Warning not set with correct stacklevel'
reason = "the zip's code objects carry relative file names, so pandas' warnings point inside pandas"
closes_with = "context/specifications/051-what-the-upstream-tests-found.md"

[[expected]]
id = "no-processes"
group = "pandas-tslibs"
outcome = "failed"
match = 'wasi does not support processes'
reason = 'no processes: subprocess is unavailable on WASI'
closes_with = "README.md"

# pandas' Styler, and `to_latex`, which renders through it (spec 039): the tests that import
# jinja2 ran as skips before it was in the zip, and failed where the Styler loaded its templates
# by path from the zip. Spec 041's carried patch reads them from the zip and emptied both classes;
# its eleven Styler files that stopped at collection are selected again.

[[expected]]
id = "styler-templates"
group = "pandas-frame"
outcome = "failed"
match = 'TemplateNotFound'
reason = "pandas' Styler loads html.tpl with jinja2's FileSystemLoader by path from the zip (inspect.getmembers and the LaTeX repr reach it)"
closes_with = "context/specifications/041-files-read-by-path-from-the-zip.md"

[[expected]]
id = "styler-templates"
group = "pandas-io-formats"
outcome = "failed"
match = 'TemplateNotFound|Regex pattern did not match'
reason = "the same; jinja2's TemplateNotFound is a LookupError, so test_filepath_or_buffer_arg's pytest.raises(LookupError, match='unknown encoding') for to_latex catches it with another message"
closes_with = "context/specifications/041-files-read-by-path-from-the-zip.md"
