# xarray 2026.9.0's pytest settings from its pyproject.toml, transcribed: its markers, its test
# file names, and its rule that a warning raised from xarray's own code is an error, with its
# allowances for the packages the guest has (zarr's, pyarrow's, flox's and netCDF4's are left
# out, since none is carried). Its addopts name pytest-mypy-plugins' option, which the kit does
# not carry, and the typing tests that plugin runs are not collected. One ignore: the driver imports
# the package before pytest, so pytest cannot rewrite it.
[pytest]
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
markers =
    flaky: flaky tests
    mypy: type annotation tests
    network: tests requiring a network connection
    slow: slow tests
    slow_hypothesis: slow hypothesis tests
    asyncio: pytest-asyncio's marker
filterwarnings =
    error:::xarray.*
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5.:DeprecationWarning
    default:::xarray.tests.test_strategies
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
