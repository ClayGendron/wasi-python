# markupsafe's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "markupsafe"
driver = "package"
grant = "/upstream-markupsafe"
test_source = true
budget = 19_000_000_000
stage_folders = ["tests"]
extra_sys_path = ["."]
cwd = "tree"
markers = []

[groups.markupsafe-smoke]
paths = ["tests"]
smoke = "the whole suite: a smaller smoke group would cost as much, a session's start being most of it"
fuel = 19_000_000_000
measured = 12_337_837_819

