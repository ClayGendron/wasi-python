[[expected]]
id = "wasm32-int32"
group = "xarray-r-coding"
outcome = "failed"
match = "dtype\\('int32'\\) == dtype\\('int64'\\)"
reason = "numpy's default integer is 32 bits on wasm32, so an integer array these tests make without a dtype is int32 where they expect int64 (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "wasm32-int32"
group = "xarray-r-dataset"
outcome = "failed"
match = "^assert False$"
reason = "numpy's default integer is 32 bits on wasm32: the array DataArray(range(12)) makes is int32, so its DataFrame does not equal the int64 frame pandas builds from range(12) (README)"
closes_with = "docs/reference/limitations.md"

[[expected]]
id = "wasm32-int32"
group = "xarray-r-rest"
outcome = "failed"
match = 'dtype\(.int32.\) == <class .numpy\.int64.>|\.\.\. int32 8B 5 2. == .Left and rig\.\.\.int64 16B 5 2.$|  int64 8B 36. == .<xarray\.Data\.\.\.  int32 4B 36.$|^AssertionError: assert .<xarray\.Data\.\.\.\. 7\.0 7\.0 7\.0. == |^AssertionError: assert .<xarray\.Data\.\.\.4 32B 1 2 1 2. == '
reason = "numpy's default integer is 32 bits on wasm32, so an integer array these tests make without a dtype is int32: its repr's dtype and byte size, or its dtype, differ from the int64 the tests expect (README)"
closes_with = "docs/reference/limitations.md"

