[[expected]]
id = "no-mmap"
group = "xarray-r-backends"
outcome = "failed"
match = 'mmap is unavailable|^Failed: DID NOT WARN\. No warnings of type \(<class .UserWarning.>,\) were emitted\.$'
reason = "no mmap: scipy's netCDF3 reader maps a file it is given by path, and the stand-in raises OSError (README); two tests that expect a warning from such a read see the error first, as natively with mmap disabled (EXECUTED: the same 160 fail there). open_dataset(path, mmap=False) or a file object reads the same files"
closes_with = "docs/reference/limitations.md"

