# annotated-types's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite is the smoke group, in the normal tier: each test in exactly one
# tier.
#
# The group's `measured` is its fuel in run 43912197491 on linux, the first run of a set built
# with this group, and its cap the rule's of it.

package = "annotated-types"
driver = "package"
grant = "/upstream-annotated-types"
test_source = true
wheel = "annotated_types-0.8.0-py3-none-any.whl"
budget = 18_000_000_000
stage_folders = ["tests"]
extra_sys_path = ["."]
cwd = "tree"
markers = []

[groups.annotated-types-smoke]
paths = ["tests"]
smoke = "the whole suite: a smaller smoke group would cost as much, a session's start being most of it"
fuel = 18_000_000_000
measured = 11_447_226_227
