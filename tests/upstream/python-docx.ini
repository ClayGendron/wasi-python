# python-docx 1.2.0's pytest settings from its pyproject.toml, transcribed: its collection rules and
# `filterwarnings = error`. Two ignores: the tests' own grammar helper (tests/unitutil/cxml.py)
# calls pyparsing names that pyparsing 3.3, the version the product carries, deprecates; and the
# driver imports the package before pytest, so pytest cannot rewrite it.
[pytest]
python_files = test_*.py
python_classes = Test Describe
python_functions = it_ its_ they_ and_ but_
filterwarnings =
    error
    ignore::pyparsing.warnings.PyparsingDeprecationWarning
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
