# packaging's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "packaging"
driver = "package"
grant = "/upstream-packaging"
test_source = true
wheel = "packaging-26.3-py3-none-any.whl"
budget = 3_969_000_000_000
stage_folders = ["tests"]
extra_sys_path = ["."]
cwd = "tree"
markers = []
kit_extra = ["pretend"]

[groups.packaging-smoke]
paths = [
    "tests/test_tags.py",
    "tests/test_utils.py",
    "tests/test_licenses.py",
    "tests/test_metadata.py",
]
smoke = "a few files that import the package from the zip and run its core paths"
fuel = 29_000_000_000
measured = 19_219_356_067

