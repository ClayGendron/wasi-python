[pytest]
python_files = test_*.py
markers =
    pil_required: PIL required to run test
    pil_not_installed: Run test only if PIL is not installed
    not_py33: Do not run test on Python 3.
    lxml_required: lxml required
    defusedxml_required: defusedxml required
    lxml_buffering: lxml >= 3.4.0
    no_lxml: do not use lxml
    pandas_required: Pandas required
    numpy_required: Numpy required
    defusedxml_not_installed: x
    lxml_not_installed: x
    no_pypy: x
filterwarnings =
    error
    ignore::FutureWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
