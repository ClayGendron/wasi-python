# imageio 2.38.1 sets no pytest options of its own. Its test_images fixture reads pytest's cache,
# which the driver turns off: a test-side stand-in gives a cache held in memory for the session,
# which names the staged images, so the fixture neither makes their folder nor clones them.
# One ignore: the driver imports the package before pytest, so pytest cannot rewrite it.
[pytest]
addopts = -p pytest_cache_stand_in
session_cache =
    imageio_test_binaries=/upstream-imageio/tree/.test_images
filterwarnings =
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
