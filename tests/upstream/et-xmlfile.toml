# et-xmlfile's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "et-xmlfile"
driver = "package"
grant = "/upstream-et-xmlfile"
test_source = true
wheel = "et_xmlfile-2.0.0-py3-none-any.whl"
budget = 24_000_000_000
stage_folders = ["et_xmlfile/tests"]
cwd = "/tmp/work"
markers = []
package_inits = true

[groups.et-xmlfile-smoke]
paths = ["et_xmlfile/tests"]
smoke = "the whole suite: a smaller smoke group would cost as much, a session's start being most of it"
fuel = 24_000_000_000
measured = 15_580_522_224

[[expected]]
id = "python-3-15"
group = "et-xmlfile-smoke"
outcome = "failed"
match = "Tuples differ: \\(\\[\\],\\) != \\(\\[\\], \\[\\]\\)|anonymous_sentinel|frozendict|list\\.remove\\(x\\): x not in l|has no attribute 'makeSuite'|ResourceWarnin"
reason = "the test expects an older CPython's behaviour or message (typing, ElementTree, unittest), and the product is CPython 3.15 (README)"
closes_with = "docs/reference/limitations.md"

