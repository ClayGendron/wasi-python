# pydantic-core 2.50.4's pytest settings from its pyproject.toml, transcribed: its log format,
# strict xfails, its marker and its warnings as errors. Its timeout and benchmark options are
# pytest-timeout's and pytest-benchmark's, plugins the kit does not carry, so they are left out,
# and two markers its tests use are declared for them: pytest-timeout's and pytest-run-parallel's.
# One ignore: the driver imports the package before pytest, so pytest cannot rewrite it.
[pytest]
log_format = %(name)s %(levelname)s: %(message)s
xfail_strict = true
markers =
    skip_gc_traverse_check: skip the automatic GC traversal completeness check
    thread_unsafe: pytest-run-parallel's marker
    timeout: pytest-timeout's marker (a clock; not run)
filterwarnings =
    error
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
