# scikit-learn's own tests in the guest. A judge file: every edit is a judge change.
#
# The suite runs whole in the release tier, before a publication; one smoke group runs in the
# normal tier at every check, chosen to touch every compiled subpackage and the carried patch
# (smoke_cover says which file or golden job line covers each). scikit-learn marks no test slow,
# so the smoke files run whole in the normal tier and the path release groups run every other
# staged file whole: every test runs in exactly one tier.
#
# component       the source tree's name, as its tarball names it
# package_inits   the ancestors' __init__.py are staged too (see scipy.toml)
# env             set for every run of the family, each with its reason

package = "scikit-learn"
driver = "package"
grant = "/upstream-scikit-learn"
component = "scikit_learn"
budget = 15_171_000_000_000
stage_folders = [
    "sklearn/_loss/tests",
    "sklearn/callback/tests",
    "sklearn/cluster/_hdbscan/tests",
    "sklearn/cluster/tests",
    "sklearn/compose/tests",
    "sklearn/covariance/tests",
    "sklearn/cross_decomposition/tests",
    "sklearn/datasets/tests",
    "sklearn/decomposition/tests",
    "sklearn/ensemble/_hist_gradient_boosting/tests",
    "sklearn/ensemble/tests",
    "sklearn/experimental/tests",
    "sklearn/feature_extraction/tests",
    "sklearn/feature_selection/tests",
    "sklearn/frozen/tests",
    "sklearn/gaussian_process/tests",
    "sklearn/impute/tests",
    "sklearn/inspection/_plot/tests",
    "sklearn/inspection/tests",
    "sklearn/linear_model/_glm/tests",
    "sklearn/linear_model/tests",
    "sklearn/manifold/tests",
    "sklearn/metrics/_plot/tests",
    "sklearn/metrics/cluster/tests",
    "sklearn/metrics/tests",
    "sklearn/mixture/tests",
    "sklearn/model_selection/tests",
    "sklearn/neighbors/tests",
    "sklearn/neural_network/tests",
    "sklearn/preprocessing/tests",
    "sklearn/semi_supervised/tests",
    "sklearn/svm/tests",
    "sklearn/tests",
    "sklearn/tree/tests",
    "sklearn/utils/_repr_html/tests",
    "sklearn/utils/tests",
]
package_inits = true
support_files = [
    "sklearn/conftest.py",
    "sklearn/externals/conftest.py",
]
cwd = "/tmp/work"
markers = []

[env.SKLEARN_RUN_FLOAT32_TESTS]
value = "1"
reason = "the float32 cases of each test run too"

[env.SKLEARN_SEED]
value = "0"
reason = "the package's setup seeds the global generators from this, not from the product's own draws, so no change elsewhere moves every test on the global generator"

[smoke_cover]
"sklearn" = "sklearn/tests/test_isotonic.py"
"sklearn.__check_build" = "sklearn/tests/test_isotonic.py"
"sklearn._loss" = "job tests/jobs/machine_learning.py:74 LogisticRegression"
"sklearn.cluster" = "sklearn/cluster/tests/test_dbscan.py"
"sklearn.cluster._hdbscan" = "sklearn/cluster/_hdbscan/tests"
"sklearn.datasets" = "sklearn/datasets/tests/test_svmlight_format.py"
"sklearn.decomposition" = "sklearn/decomposition/tests/test_online_lda.py"
"sklearn.ensemble" = "release-only: its one compiled module serves the classic gradient boosting, whose test file costs past a smoke file's reach, and no golden line calls it"
"sklearn.ensemble._hist_gradient_boosting" = "sklearn/ensemble/_hist_gradient_boosting/tests/test_splitting.py"
"sklearn.feature_extraction" = "sklearn/feature_extraction/tests/test_feature_hasher.py"
"sklearn.linear_model" = "sklearn/linear_model/tests/test_sag.py"
"sklearn.manifold" = "release-only: its compiled modules serve t-SNE, whose test file costs past a smoke file's reach, and no golden line calls it"
"sklearn.metrics" = "job tests/jobs/machine_learning.py:117 KNeighborsClassifier"
"sklearn.metrics._pairwise_distances_reduction" = "sklearn/metrics/tests/test_pairwise_distances_reduction.py"
"sklearn.metrics.cluster" = "sklearn/metrics/cluster/tests"
"sklearn.neighbors" = "sklearn/neighbors/tests/test_kd_tree.py"
"sklearn.preprocessing" = "sklearn/preprocessing/tests/test_target_encoder.py"
"sklearn.svm" = "sklearn/svm/tests"
"sklearn.tree" = "sklearn/tree/tests/test_split.py"
"sklearn.utils" = "sklearn/utils/tests/test_sparsefuncs.py"
"sklearn.utils._repr_html" = "sklearn/utils/_repr_html/tests"

[[not_selected]]
files = [
    "sklearn/cluster/tests/test_hierarchical.py",
    "sklearn/metrics/tests/test_dist_metrics.py",
]
reason = "each builds memory-mapped arrays at import (create_memmap_backed_data), and the mmap stand-in raises, so the file cannot load"
