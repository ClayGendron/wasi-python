# joblib's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "joblib"
driver = "package"
grant = "/upstream-joblib"
test_source = true
wheel = "joblib-1.6.0-py3-none-any.whl"
budget = 96_000_000_000
stage_folders = ["joblib/test", "doc"]
cwd = "/tmp/work"
markers = []
kit_extra = ["pytest-asyncio"]
docstring_flags = 12
package_inits = true

[groups.joblib-smoke]
paths = ["joblib/test/test_hashing.py", "joblib/test/test_logger.py", "joblib/test/test_disk.py"]
smoke = "a few files that import the package from the zip and run its core paths"
fuel = 29_000_000_000
measured = 18_695_644_621

[groups.joblib-r]
paths = ["joblib/test"]
tier = "release"
release_by = "path"
fuel = 42_000_000_000
measured = 27_799_661_945

[groups.joblib-r-doc]
docstring_packages = ["joblib"]
docstring_not_selected = ["joblib.externals", "joblib._memmapping_reducer", "joblib.executor", "joblib.pool"]
doctest_files = [["doc/user_guide/custom_parallel_backend.rst", 12], ["doc/user_guide/memory.rst", 12], ["doc/user_guide/parallel.rst", 12], ["doc/user_guide/parallel_numpy.rst", 12], ["doc/user_guide/persistence.rst", 12]]
tier = "release"
release_by = "path"
fuel = 25_000_000_000
measured = 16_097_655_151

[[not_selected]]
files = ["joblib/test/test_memmapping.py"]
reason = "it imports joblib's memmapping reducer, which needs _multiprocessing at import, and every test in it maps arrays into worker processes: the guest has neither"
closes_with = "README.md"

[[expected]]
id = "disk-usage-zero"
group = "joblib-smoke"
outcome = "failed"
match = "assert 0 >= 1024"
reason = "WASI's stat reports no allocated blocks, so joblib's disk_used sums to 0 (README)"
closes_with = "README.md"

[[expected]]
id = "joblib-cache-clock"
group = "joblib-smoke"
outcome = "failed"
match = "assert 12 == 2$|^assert not True$|^assert False$|^assert 0\\.3 < 0\\.3$"
reason = "joblib's cache and hashing tests compare ages and times; under the judge's counted clock (a microsecond a read) they are not the wall clock's (README)"
closes_with = "README.md"

[[expected]]
id = "no-mmap"
group = "joblib-smoke"
outcome = "failed"
match = "mmap is unavailable|No module named 'mmap'|^AssertionError: False is not true$"
reason = "no mmap: the stand-in raises OSError (README); xlrd opens a workbook with mmap, so a test that checks the error a bad workbook raises sees mmap's"
closes_with = "README.md"

[[expected]]
id = "no-processes"
group = "joblib-smoke"
outcome = "failed"
match = "wasi does not support processes|has no attribute 'pipe'|_multiprocessing|multiprocessing\\.synchronize|_posixsubprocess|has no attribute 'fork'|ProcessPoolExecutor|BrokenProcessPool|has no attribute 'getppid'"
reason = "no processes: the guest cannot start one (README)"
closes_with = "README.md"

[[expected]]
id = "wasi-mkdir"
group = "joblib-smoke"
outcome = "failed"
match = "DID NOT RAISE <class 'OSError'>"
reason = "joblib's mkdirp test expects OSError where WASI's file system answers otherwise (README)"
closes_with = "README.md"

[[expected]]
id = "joblib-cache-clock"
group = "joblib-r"
outcome = "failed"
match = "assert 12 == 2$|^assert not True$|^assert False$|^assert 0\\.3 < 0\\.3$"
reason = "joblib's cache and hashing tests compare ages and times; under the judge's counted clock (a microsecond a read) they are not the wall clock's (README)"
closes_with = "README.md"

[[expected]]
id = "no-asyncio-loop-error"
group = "joblib-r"
outcome = "error"
match = "\\[Errno 58\\] Not supported|unraisable exception warnings|Exception ignored while calling deallocator"
reason = "an operation WASI does not support answers ENOTSUP: asyncio's event loop opens a socket pair for its self-pipe, and what a failed loop leaves behind is reported at teardown (README)"
closes_with = "README.md"

[[expected]]
id = "no-asyncio-loop"
group = "joblib-r"
outcome = "failed"
match = "\\[Errno 58\\] Not supported|unraisable exception warnings|Exception ignored while calling deallocator"
reason = "an operation WASI does not support answers ENOTSUP: asyncio's event loop opens a socket pair for its self-pipe, and what a failed loop leaves behind is reported at teardown (README)"
closes_with = "README.md"

[[expected]]
# test_joblib_pickle_across_python_versions_with_mmap loads every pickle in its data folder in
# the order the host lists it, and each load meets mmap's OSError. A Python 3 pickle re-raises it;
# a Python 2 pickle, which the test expects to raise ValueError, fails on `assert isinstance(exc,
# ValueError)` instead. Which comes first is the host file system's order (APFS keeps one; ext4's
# differs between machines), so either message is this class's.
id = "no-mmap"
group = "joblib-r"
outcome = "failed"
match = "mmap is unavailable|No module named 'mmap'|^AssertionError: False is not true$|^AssertionError: assert False$"
reason = "no mmap: the stand-in raises OSError (README); xlrd opens a workbook with mmap, so a test that checks the error a bad workbook raises sees mmap's"
closes_with = "README.md"

[[expected]]
id = "no-processes"
group = "joblib-r"
outcome = "failed"
match = "wasi does not support processes|has no attribute 'pipe'|_multiprocessing|multiprocessing\\.synchronize|_posixsubprocess|has no attribute 'fork'|ProcessPoolExecutor|BrokenProcessPool|has no attribute 'getppid'"
reason = "no processes: the guest cannot start one (README)"
closes_with = "README.md"

[[expected]]
id = "doctest-output"
group = "joblib-r-doc"
outcome = "failed"
match = "doctest failed"
reason = "a docstring example whose printed output differs in the guest under the stdlib's doctest runner with upstream's flags (README)"
closes_with = "README.md"

