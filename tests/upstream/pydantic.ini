# pydantic 2.14.3's pytest settings from its pyproject.toml, transcribed: strict mode, its two
# markers and its warnings. Its benchmark options are pytest-benchmark's, a plugin the kit does
# not carry, so they are left out, and pytest-run-parallel's marker, which its tests use, is
# declared. One ignore: the driver imports the package before pytest, so pytest cannot rewrite it.
[pytest]
strict = true
markers =
    skip_json_schema_validation: Disable JSON Schema validation.
    timeout: pytest-timeout marker (no-op when plugin not installed)
    thread_unsafe: pytest-run-parallel's marker
filterwarnings =
    error
    ignore:path is deprecated.*:DeprecationWarning:
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
