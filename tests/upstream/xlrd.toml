# xlrd's own tests in the guest, from its test source. A judge file: every edit is a
# judge change. The whole suite runs in the release tier, a smoke group in the normal
# tier: each test in exactly one tier.

package = "xlrd"
driver = "package"
grant = "/upstream-xlrd"
test_source = true
wheel = "xlrd-2.0.2-py2.py3-none-any.whl"
budget = 17_000_000_000
stage_folders = ["tests"]
extra_sys_path = ["."]
cwd = "tree"
markers = []

[groups.xlrd-smoke]
paths = ["tests"]
smoke = "the whole suite: a smaller smoke group would cost as much, a session's start being most of it"
fuel = 17_000_000_000
measured = 11_269_922_111

[[expected]]
id = "no-mmap"
group = "xlrd-smoke"
outcome = "failed"
match = "mmap is unavailable|No module named 'mmap'|^AssertionError: False is not true$"
reason = "no mmap: the stand-in raises OSError (README); xlrd opens a workbook with mmap, so a test that checks the error a bad workbook raises sees mmap's"
closes_with = "docs/reference/limitations.md"

