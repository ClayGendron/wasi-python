# tinycss2 1.5.1's pytest options (pyproject.toml): its JSON test data is not a test folder. One
# ignore: the driver imports the package before pytest, so pytest cannot rewrite it.
[pytest]
norecursedirs = tests/css-parsing-tests
filterwarnings =
    ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning
