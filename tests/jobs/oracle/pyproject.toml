# The native oracle for the golden jobs (spec 002, Decision 11): the guest's package pins, natively.
# Python is the line's own pinned host Python (scripts/line.conf), which tests/harness/jobs.py
# unpacks under build/oracle/python/ after checking its hash: the pinned uv (0.9.22) cannot install
# 3.15.0 (spec 005, Decision 9). Run it through tests/jobs/regen.py, which keeps every download
# under build/.
[project]
name = "wasi-python-oracle"
version = "0"
requires-python = "==3.15.0"
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.6",
    "python-dateutil==2.9.0.post0",
    "tzdata==2026.5",
    "six==1.17.0",
]

[tool.uv]
package = false
