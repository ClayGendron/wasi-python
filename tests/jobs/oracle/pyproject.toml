# The native oracle for the golden jobs (spec 002, Decision 11): the guest's package pins, natively.
# Python is the line's own pinned host Python (scripts/line.conf), which tests/harness/jobs.py
# unpacks under build/oracle/python/ after checking its hash: the pinned uv (0.9.22) cannot install
# 3.15.0 (spec 005, Decision 9). Run it through tests/jobs/regen.py, which keeps every download
# under build/.
[project]
name = "wasi-python-oracle"
version = "0"
requires-python = "==3.15.0"
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.6",
    "python-dateutil==2.9.0.post0",
    "tzdata==2026.5",
    "six==1.17.0",
    # matplotlib and its dependencies at the guest's pins (spec 023); contourpy is native only
    # (the guest has none until M2), at the version the research pinned.
    "matplotlib==3.11.2",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.67.0",
    "kiwisolver==1.5.1",
    "packaging==26.3",
    "pillow==13.0.0",
    "pyparsing==3.3.3",
    # lxml at the guest's pin (spec 046). Its wheels bundle libxml2 2.14.6 and libxslt 1.1.43, older
    # than the guest's 2.15.4 and 1.1.45, so the golden prints only what the two share.
    "lxml==6.1.3",
    # regex at the guest's pin (spec 047)
    "regex==2026.9.29",
    # Tier A at the guest's pins (spec 039, Decision 11), but pyyaml: it has no cp315 wheel, so uv
    # would build its sdist on the host with tools no lock pins. tests/harness/jobs.py stages its
    # pure tree from the pinned sdist instead, as the guest takes it, and puts it on PYTHONPATH.
    # markupsafe comes as its locked cp315 wheel, with its C speedups; the guest runs _native.
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
    "xlsxwriter==3.2.9",
    "xlrd==2.0.2",
    "pypdf==6.21.1",
    "beautifulsoup4==4.15.0",
    "soupsieve==3.0.3",
    "html5lib==1.1",
    "webencodings==0.6.1",
    "defusedxml==0.7.1",
    "xmltodict==1.0.4",
    "tomli-w==1.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
    "tabulate==0.10.0",
    "charset-normalizer==3.5.2",
    "networkx==3.7",
    "patsy==1.0.3",
    "sympy==1.14.0",
    "mpmath==1.3.0",
    "attrs==26.1.0",
    "more-itertools==11.2.1",
    "toolz==1.2.0",
    "tqdm==4.70.1",
    "typing-extensions==4.16.0",
    "joblib==1.6.0",
    "cloudpickle==3.1.2",
    "threadpoolctl==3.7.0",
    "narwhals==2.27.1",
]

[tool.uv.sources]
# charset-normalizer's pure wheel, the guest's own file: its platform wheels are mypyc-compiled.
charset-normalizer = { url = "https://files.pythonhosted.org/packages/fc/ad/d07d7862a62ffa6d79d68074d14823243dd235a77c45262acbf6adeb28bf/charset_normalizer-3.5.2-py3-none-any.whl" }

[tool.uv]
package = false
