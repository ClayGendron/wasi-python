# The release's shards. `uv run pytest --shard=<name>` runs one; the
# release workflow runs every shard of each system in that system's judge job, and `build` in the
# build-shard job; `gather` merges their records. A shard selects by exactly one of:
#   files   whole test modules (never the upstream file, whose group checks go with their groups)
#   groups  upstream groups, each with its suite check, its classes' checks and its traps
#   rest    every item no shard of the plan takes by files or groups (one shard; new files land here)
#   nodes   checks by node id, or every case of a function by `file::function`, taken from their
#           file's shard and run on exactly its systems (so one file can split in two)
# systems: macos, linux, windows; `build` is the build-shard job's own shard: it needs the build
# tree, and runs on a fresh arm64 Linux build on every run, tags included.
# Every upstream group is in exactly one Linux shard; every files shard but build runs on all three
# systems; rest runs on macOS and Linux; every product check file and runner unit file is in a files
# shard on all three systems, so rest holds only the rules and the judge's own tooling. Changing this file is a judge change (it is under tests/).

[shard.build]
# The build host's own checks: the trees of every component, the compile records, the zlib tarball.
files = ["tests/checks/test_v1_5_rebuild_from_pins.py", "tests/unit/test_pins.py"]
# Checks by node id: the recursion check on the wasmtime CLI needs the wasmtime CLI only the build
# host unpacks; its file stays in own-hostile (a node id kept, so nothing is retired). scikit-learn's
# and statsmodels' notice checks read the pinned sdists, which only the build host has.
nodes = [
  "tests/checks/test_v1_2_hostile_guest.py::test_recursion_raises_under_the_wasmtime_cli",
  "tests/checks/test_v1_1_artifact_set.py::test_scikit_learn_notice_carries_its_bundled_parts",
  "tests/checks/test_v1_1_artifact_set.py::test_statsmodels_notice_carries_its_bundled_parts",
]
systems = ["build"]

