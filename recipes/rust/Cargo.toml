# The Rust workspace of the build. Step 52 copies this file and Cargo.lock to build/, so the
# workspace's root is build/ and every path crate lies inside it: cargo hashes a path crate's place
# relative to the root into its symbol names, so the bytes do not depend on where the checkout is.
# orjson's tree sits at build/orjson-3.13.0 and pydantic-core's at build/pydantic_core-2.50.4,
# where the source-tree check reads them.
[workspace]
resolver = "3"
members = ["rust/modules", "rust/modules/probe"]

# orjson's own release profile, which cargo does not read for a dependency; pydantic-core's asks
# the same fat LTO and one codegen unit. No panic strategy is set here: step 52 passes the one the
# line names.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
incremental = false
