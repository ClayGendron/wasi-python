# _rust_probe: a private builtin module the build's own checks use, not an API. It panics on
# purpose, through PyO3's function wrapper and through a raw C entry point, and builds a hash map
# from Rust's standard library, whose keys come from the guest's entropy.
[package]
name = "rust_probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "=0.29.3", default-features = false, features = ["macros"] }
