[package]
name = "wasi-run-spike-lean"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# The same source on wasmtime 49.0.3 with only the features a runner needs, to size a release
# binary. gc and gc-drc are kept so the Config can name wasmtime-py's collector.
[dependencies]
wasmtime = { version = "=49.0.3", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation", "gc", "gc-drc", "addr2line", "demangle"] }
wasmtime-wasi = { version = "=49.0.3", default-features = false, features = ["p1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1

[[bin]]
name = "wasi-run-spike-lean"
path = "../src/main.rs"
