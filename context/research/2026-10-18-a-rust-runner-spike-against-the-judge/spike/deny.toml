# The spike's cargo-deny configuration (research): the permissive licences wasmtime's tree uses.
[graph]
all-features = false

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
         "Unicode-3.0", "Zlib", "Unlicense", "ISC"]
confidence-threshold = 0.9

[advisories]
version = 2

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
