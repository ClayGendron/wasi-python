# The smoke split as spec 095's Decision 7 draws it, for split.py. Paths are the sdists' own.
# Smoke groups are the normal tier; every other staged tests folder is a path release group
# (one per folder here; the build packs them by the 480 G bound); with a release_marker, the
# smoke paths' marked tests are a marker release group.

[scipy]
pkg = "scipy"
marker = "not slow and not xslow"
release_marker = "slow or xslow"
not_staged = ["scipy/odr/tests"]
not_selected = [
    "scipy/_lib/tests/test_ccallback.py",
    "scipy/integrate/tests/test_quadpack.py",
    "scipy/ndimage/tests/test_c_api.py",
    "scipy/special/tests/test_dd.py",
    "scipy/special/tests/test_round.py",
    "scipy/linalg/tests/test_cython_abi.py",
    "scipy/optimize/tests/test_cython_abi.py",
    "scipy/special/tests/test_cython_abi.py",
    "scipy/linalg/tests/_cython_examples/ilp64_test_package",
]

