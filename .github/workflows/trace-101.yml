# Temporary, removed in the next commit: one traced build from the pins on arm64 Linux, as
# build-shard builds, for evidence only. It lists every repository path the build touches, and
# prints the build-record checks' read: lines from this Linux tree. Docker on the owner's machine
# is down, so the trace runs here. It holds no secret, signs nothing and publishes nothing.
name: trace-101

on:
  push:
    branches: [spec/101-faster-release-run]

permissions: {}

env:
  SOURCE_DATE_EPOCH: "1767225600"
  UV_VERSION: "0.9.22"
  UV_LOCKED: "1"
  UV_PYTHON: "3.14.2"
  UV_BUILD_CONSTRAINT: release/build-constraints.txt

jobs:
  trace:
    name: a traced build from the pins (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: strace, from the runner's own distribution
        run: |
          command -v strace || { sudo apt-get update -q && sudo apt-get install -y -q strace; }
          strace -V | head -1
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins, traced
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/trace"
          strace -f -y -qq -s 65535 -e trace=%file,%process,chdir,fchdir \
            -o "|zstd -q -T0 -3 -o $RUNNER_TEMP/trace/trace.zst" scripts/build.sh
          ls -l "$RUNNER_TEMP/trace"
      - name: Every repository path the build touched
        run: |
          zstd -dc "$RUNNER_TEMP/trace/trace.zst" \
            | uv run --no-project python -I .github/trace-101/paths.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/trace/touched.tsv" \
            | tee "$RUNNER_TEMP/trace/stats.json"
          wc -l "$RUNNER_TEMP/trace/touched.tsv"
          cut -f1 "$RUNNER_TEMP/trace/touched.tsv" | head -400
      - name: The build-record checks, their read lines printed
        if: always()
        run: |
          uv run pytest -s -rA -p no:cacheprovider \
            "tests/checks/test_v1_5_rebuild_from_pins.py::test_every_compile_contracts_nothing" \
            "tests/checks/test_v1_5_rebuild_from_pins.py::test_every_build_python_is_pinned" \
            "tests/checks/test_v1_5_rebuild_from_pins.py::test_the_backend_orders_try_tables_alike" \
            "tests/checks/test_v1_5_rebuild_from_pins.py::test_ducc0s_fft_compiles_to_one_object" \
            "tests/checks/test_v1_5_rebuild_from_pins.py::test_one_qhull_is_linked" \
            "tests/checks/test_v1_5_rebuild_from_pins.py::test_the_guests_configure_results_are_recorded" \
            "tests/checks/test_v1_2_hostile_guest.py::test_recursion_raises_under_the_wasmtime_cli" \
            2>&1 | tee "$RUNNER_TEMP/trace/m1-linux.txt"
      - name: The set's own SHA256SUMS
        if: always()
        run: cp build/artifacts/SHA256SUMS "$RUNNER_TEMP/trace/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-101-findings
          path: |
            ${{ runner.temp }}/trace/touched.tsv
            ${{ runner.temp }}/trace/stats.json
            ${{ runner.temp }}/trace/m1-linux.txt
            ${{ runner.temp }}/trace/SHA256SUMS
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: trace-101-raw
          path: ${{ runner.temp }}/trace/trace.zst
          retention-days: 5
          compression-level: 0
          if-no-files-found: warn
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-101-logs
          path: build/logs/
          if-no-files-found: ignore
