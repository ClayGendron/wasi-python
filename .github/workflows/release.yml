# The release workflow.
#
# A pushed tag v<version> builds the artifact set from its pins, judges it in parallel shards on
# Linux, Windows and macOS (the judge's own checks on all three, numpy's and pandas' own test suites
# on Linux and one group of them on macOS and Windows; `gather` decides from every shard's hashed
# record), rebuilds it from the pins on arm64 Linux and x86_64 Linux and requires the same bytes,
# and publishes a GitHub release (and, once the owner enables it, the wheel on PyPI). A manual run
# (workflow_dispatch) is a dry run: build, rebuild, judge and gather, never sign or publish.
# Third-party actions are pinned by commit, their release named beside each. Every job that reads
# the build's files downloads them by the id the build job handed on, after a step that refuses an
# empty id, and checks them against the SHA-256 of SHA256SUMS the build job handed on before it uses
# them. Values reach scripts through env:, never as expressions.
# A dispatch on a branch other than main reuses a set the cache holds under this commit's key
# (release/set_key.py), and still rebuilds it from the pins three times on Linux; a pushed tag and
# a dispatch on main always build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      from-source:
        description: build the set from the pins even when a set for this commit is cached
        type: boolean
        default: false
      release-tier:
        description: judge the release tier too (a tag and a run on main always do)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "1767225600"
  UV_VERSION: "0.9.22"
  # The judge's own environment exactly as uv.lock pins it, on the Python it is developed with.
  UV_LOCKED: "1"
  UV_PYTHON: "3.14.2"
  # Every build of this package, the editable one uv run makes included, uses the pinned backend.
  UV_BUILD_CONSTRAINT: release/build-constraints.txt

jobs:
  inputs:
    name: the set's key, and whether this run may reuse a set
    # Only a dispatch on a branch other than main, not from-source, reuses a
    # set the cache holds under this commit's key. Every consumer compares reuse with == 'true', so
    # an empty or broken output builds from source.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      reuse: ${{ steps.decide.outputs.reuse }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The set's key (release/set_key.py prints what it hashes)
        id: key
        run: uv run --no-project python -I release/set_key.py key >> "$GITHUB_OUTPUT"
      - name: Is a set cached under the key
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Reuse only on a dispatch from a branch other than main
        id: decide
        env:
          FROM_SOURCE: ${{ inputs.from-source }}
          HIT: ${{ steps.lookup.outputs.cache-hit }}
        run: |
          reuse=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_TYPE" = branch ] \
            && [ "$GITHUB_REF" != refs/heads/main ] && [ "$FROM_SOURCE" != true ] && [ "$HIT" = true ]; then
            reuse=true
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "event $GITHUB_EVENT_NAME, $GITHUB_REF ($GITHUB_REF_TYPE), from-source '$FROM_SOURCE', cached '$HIT': reuse=$reuse"
      - name: Which tier this run judges
        # A pushed tag publishes and a run on main rehearses it: both judge the release tier, with
        # no input to turn it off. Any other dispatch judges the normal tier unless it asks.
        # Every consumer compares with == 'release', so an empty output judges the normal tier.
        id: tier
        env:
          RELEASE_TIER: ${{ inputs.release-tier }}
        run: |
          tier=normal
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then tier=release; fi
          if [ "$GITHUB_REF" = refs/heads/main ]; then tier=release; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$RELEASE_TIER" = true ]; then tier=release; fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "event $GITHUB_EVENT_NAME, $GITHUB_REF ($GITHUB_REF_TYPE), release-tier '$RELEASE_TIER': tier=$tier"

  build:
    name: build on arm64 macOS, or reuse a set
    # The published set is built on arm64 macOS; a branch dispatch whose key is cached reuses it on
    # Linux instead, and build-shard, the rebuild jobs and same-bytes prove it from the pins in
    # the same run. The build shard runs in build-shard, which has a build tree on every run.
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.reuse == 'true' && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      assets-id: ${{ steps.assets.outputs.artifact-id }}
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
      # python.wasm's SHA-256 for the gather, which never holds the assets.
      wasm-sha256: ${{ steps.wasm.outputs.sha256 }}
      # The set's own SHA256SUMS (not the release assets'), for the gather's G2 and G7.
      set-sums-sha256: ${{ steps.set-sums.outputs.sha256 }}
      # Built or reused, from what ran (the compile step's outcome), for the gather's G7.
      set-source: ${{ steps.compile.outcome == 'success' && 'built' || format('reused {0}', needs.inputs.outputs.key) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag's commit is checked against main's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The version, and the tag it is released under, agree
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run python release/version.py check --tag "$GITHUB_REF_NAME"
            # A release is cut from main: the tagged commit must be in main's history.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            uv run python release/version.py check
          fi
      - name: Download the pinned inputs
        if: needs.inputs.outputs.reuse != 'true'
        run: scripts/00_download.sh
      - name: Build from the pins
        id: compile
        if: needs.inputs.outputs.reuse != 'true'
        run: scripts/build.sh
      - name: The set this commit's key names
        if: needs.inputs.outputs.reuse == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ needs.inputs.outputs.key }}
          fail-on-cache-miss: true
      - name: The reused set in build/artifacts
        if: needs.inputs.outputs.reuse == 'true'
        run: |
          mkdir -p build
          mv wasi-python-set build/artifacts
      - name: The set is this commit's
        # Every run, no if: each file against the set's own SHA256SUMS, no other file, MANIFEST's
        # pin and recipe lines against this checkout; and a reused set's key.
        env:
          REUSED_KEY: ${{ needs.inputs.outputs.reuse == 'true' && needs.inputs.outputs.key || '' }}
        run: |
          if [ -n "$REUSED_KEY" ]; then
            uv run --no-project python -I release/set_key.py verify build/artifacts --key "$REUSED_KEY"
          else
            uv run --no-project python -I release/set_key.py verify build/artifacts
          fi
      - name: The wheel
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - name: The source trees are their tarballs plus the recorded patches
        # On a source run only: a reuse run has no tree here. build-shard runs the same step on
        # every run, with no if:.
        if: steps.compile.outcome == 'success'
        # All twenty-eight trees must pass (seaborn's sdist the twenty-seventh, statsmodels' the
        # twenty-eighth): a skipped check (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
            -k test_source_tree_matches_its_tarball | tee zero-patch.txt
          grep -Eq "^28 passed, [0-9]+ deselected in" zero-patch.txt
      - name: The SHA-256 of python.wasm, handed to the gather
        id: wasm
        run: echo "sha256=$(shasum -a 256 build/artifacts/python.wasm | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: The SHA-256 of the set's own SHA256SUMS, handed to the gather
        id: set-sums
        run: echo "sha256=$(shasum -a 256 build/artifacts/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: Release assets
        run: uv run python release/version.py assets build/artifacts dist/wasi_python-*.whl release-assets
      - name: The SHA-256 of SHA256SUMS, handed to every job that reads the assets
        id: sums
        run: echo "sha256=$(shasum -a 256 release-assets/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
      - name: What this run checks, signs and publishes
        env:
          ASSETS_ID: ${{ steps.assets.outputs.artifact-id }}
          ASSETS_DIGEST: ${{ steps.assets.outputs.artifact-digest }}
          SUMS_SHA256: ${{ steps.sums.outputs.sha256 }}
        run: |
          echo "release-assets: artifact $ASSETS_ID, digest $ASSETS_DIGEST"
          echo "SHA256SUMS: sha256 $SUMS_SHA256"
          cat release-assets/SHA256SUMS
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore

  rebuild-linux-arm64:
    name: rebuild from the pins (ubuntu-24.04-arm)
    # Two more hosts rebuild the whole set from an empty downloads/ and build/, beside the build,
    # and upload their SHA256SUMS; same-bytes compares each with the set's.
    # One job per host, not a matrix: a job's outputs are its own, while a matrix's legs share one
    # namespace, so one leg could hand on the other's ids and cast both votes.
    # Each runner compiles with its own pinned wasi-sdk clang, and every compile carries
    # -ffp-contract=off, set in the toolchain's own configuration files by step 10: that makes
    # wasi-sdk's x86_64 and aarch64 builds of clang emit the same bytes. So no input runs in
    # both jobs' compilers: each vote rests on its own host's toolchain. The emulated
    # compiler stays in the tree, switched off, for one release. Each job's time limit is 120
    # minutes, so a hung job frees the gate after two hours.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      sums-id: ${{ steps.sums.outputs.artifact-id }}
      wheel-id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The runner's own tools (unpinned host inputs, recorded here)
        # nproc: the core count beside every time figure. binfmt_misc: a runner that could run an
        # aarch64 program through its own, unpinned qemu would hide a gap in the emulated
        # compiler's closure.
        run: |
          uname -srm
          nproc
          echo "binfmt_misc: $(ls /proc/sys/fs/binfmt_misc/ 2> /dev/null | tr '\n' ' ')"
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
          # The runner's own python3, which step 10's shim keeps out of the build,
          # named so the log records what stood on PATH.
          python3 --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - id: sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-ubuntu-24.04-arm
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - id: wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-ubuntu-24.04-arm
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-logs-ubuntu-24.04-arm
          path: build/logs/
          if-no-files-found: ignore


  rebuild-linux-x86-64:
    name: rebuild from the pins (ubuntu-24.04)
    # The same steps as rebuild-linux-arm64; only the runner and the names differ.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      sums-id: ${{ steps.sums.outputs.artifact-id }}
      wheel-id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The runner's own tools (unpinned host inputs, recorded here)
        # nproc: the core count beside every time figure. binfmt_misc: a runner that could run an
        # aarch64 program through its own, unpinned qemu would hide a gap in the emulated
        # compiler's closure.
        run: |
          uname -srm
          nproc
          echo "binfmt_misc: $(ls /proc/sys/fs/binfmt_misc/ 2> /dev/null | tr '\n' ' ')"
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
          # The runner's own python3, which step 10's shim keeps out of the build,
          # named so the log records what stood on PATH.
          python3 --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - id: sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-ubuntu-24.04
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - id: wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-ubuntu-24.04
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-logs-ubuntu-24.04
          path: build/logs/
          if-no-files-found: ignore


  same-bytes:
    name: the same bytes from every host
    # Each rebuild's SHA256SUMS lists the whole set (the three artifacts, MANIFEST and the licences)
    # and must equal the set's, byte for byte, from arm64 Linux and from x86_64 Linux, each with its
    # own pinned clang. The .tar.xz asset is made from the set deterministically but is
    # outside this claim. attest and publish need this job, so a tag never signs or publishes bytes
    # that both hosts did not rebuild.
    needs: [build, rebuild-linux-arm64, rebuild-linux-x86-64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file.
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: The rebuild jobs handed on artifact ids
        env:
          ARM64_SUMS_ID: ${{ needs.rebuild-linux-arm64.outputs.sums-id }}
          ARM64_WHEEL_ID: ${{ needs.rebuild-linux-arm64.outputs.wheel-id }}
          X86_64_SUMS_ID: ${{ needs.rebuild-linux-x86-64.outputs.sums-id }}
          X86_64_WHEEL_ID: ${{ needs.rebuild-linux-x86-64.outputs.wheel-id }}
        run: |
          for id in "$ARM64_SUMS_ID" "$ARM64_WHEEL_ID" "$X86_64_SUMS_ID" "$X86_64_WHEEL_ID"; do
            case "$id" in
              "" | *[!0-9]*) echo "a rebuild job handed on no artifact id"; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-arm64.outputs.sums-id }}
          path: rebuilds/ubuntu-24.04-arm
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-arm64.outputs.wheel-id }}
          path: rebuilt-wheels/ubuntu-24.04-arm
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.sums-id }}
          path: rebuilds/ubuntu-24.04
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.wheel-id }}
          path: rebuilt-wheels/ubuntu-24.04
          digest-mismatch: error
      - name: Every rebuild's SHA256SUMS is the set's, byte for byte
        run: |
          mkdir set
          tar -xJf release-assets/*.tar.xz -C set
          sums=$(echo set/wasi-python-*/SHA256SUMS)
          for runner in ubuntu-24.04-arm ubuntu-24.04; do
            cmp "$sums" "rebuilds/$runner/SHA256SUMS"
            echo "$runner: the same SHA256SUMS"
          done
          cat "$sums"
      - name: The wheel carries the set and is the wheel each host rebuilt
        # Three rules name what differs; the last comparison covers everything else in the wheel
        # (runner.py, METADATA), so a wheel built from any other source or set fails.
        run: |
          sums="$PWD/$(echo set/wasi-python-*/SHA256SUMS)"
          wheel="$(echo release-assets/wasi_python-*.whl)"
          mkdir wheel && unzip -q "$wheel" -d wheel
          ( cd wheel/wasi_python/artifacts && sha256sum --strict -c "$sums" )
          cmp "$sums" wheel/wasi_python/artifacts/SHA256SUMS
          listed=$(awk '{print $2}' "$sums"; echo SHA256SUMS)
          present=$(cd wheel/wasi_python/artifacts && find . -type f | sed 's#^\./##')
          if [ "$(echo "$listed" | sort)" != "$(echo "$present" | sort)" ]; then
            echo "the wheel's artifacts are not exactly the set's"
            exit 1
          fi
          for runner in ubuntu-24.04-arm ubuntu-24.04; do
            rebuilt="rebuilt-wheels/$runner/$(basename "$wheel")"
            if ! cmp -s "$wheel" "$rebuilt"; then
              echo "$runner rebuilt a different wheel; entries only in one (name, mode, size, CRC, date):"
              python3 - "$wheel" "$rebuilt" <<'PY'
          import sys, zipfile
          a, b = ({(i.filename, oct(i.external_attr >> 16), i.file_size, i.CRC, i.date_time)
                   for i in zipfile.ZipFile(p).infolist()} for p in sys.argv[1:])
          for row in sorted(a ^ b):
              print("release" if row in a else "rebuilt", *row)
          print("(no entry differs: the zip's own records do)" if a == b else "")
          PY
              exit 1
            fi
            echo "$runner: the same wheel"
          done

  build-shard:
    name: the build shard on a fresh build (ubuntu-24.04-arm)
    # The build shard reads the build tree (the source trees, the compile records, the toolchain),
    # which a reused set does not have; so on every run, tags included, it runs here on a fresh
    # build from the pins (the owner's choice, 2026-10-20). Its record's artifact and
    # set_sums are this tree's own, and the gather's G2 holds them to the build job's.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      record-id: ${{ steps.record.outputs.artifact-id }}
      record-sha256: ${{ steps.record-sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # as the build job's: the judge reads the checkout's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - name: The source trees are their tarballs plus the recorded patches
        # All twenty-eight trees must pass (seaborn's sdist the twenty-seventh, statsmodels' the
        # twenty-eighth): a skipped check (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
