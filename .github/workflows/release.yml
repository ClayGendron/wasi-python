# The release workflow, and every change's check.
#
# One decision job (plan, release/ci_plan.py) reads what a run changes and picks the jobs it needs;
# every later job gates on its outputs with if:, never with a workflow-level paths: filter, so a
# skipped job reports success and the one required check, ci-status, is always reported. A pull
# request into dev runs quick (ruff, mypy, the pure-Python unit tests and the rules) beside the
# build and the judge's shards its paths need on Linux and Windows (macOS too when the platform
# module or the engine's pin changed; the upstream groups on Linux when the set, the suites or the
# harness changed) from the cached set, and the gather narrowed to what ran; the review job reads
# its review file, a check of its own. A merge into dev (a push) runs the merge-grade set: every
# normal-tier shard on its three systems and verify on three; when all of it is green,
# accept-record accepts the gather's record with no secret and accept-push, alone in the accept
# environment, pushes that acceptance onto dev with the deploy key, whose own run is the plan alone
# (after the release pull request, accept-release.yml pushes instead). A pull request into main, a
# dispatch and the weekly schedule run the release shape: the set built from its pins on arm64
# Linux and rebuilt on x86_64 Linux (which judges the build shard on its own tree) and on arm64
# macOS, the same bytes required, both tiers judged, never signing or publishing. A pushed tag
# v<version> judges nothing again, since its tree is the one the release pull request judged plus
# the commit that recorded that judgement: it builds and rebuilds the set from its pins and
# requires the same bytes, holds those bytes and the tagged tree to the release pull request's
# acceptance (judged), installs the wheel fresh on three systems, attests and publishes.
# Third-party actions are pinned by commit, their release named beside each. Every job that reads
# the build's files does so through the local action verify-artifact (the id guarded, the download
# by it, the check against the SHA-256 of SHA256SUMS the build job handed on) before it uses them.
# Values reach scripts through env:, never as expressions. A pull request's jobs check out its head
# commit, never the merge ref: the head is judged as it is, and the tree the squash puts on dev is
# judged by the run after the merge, whose red result red-run-issue opens an issue for.
name: release

on:
  pull_request:
    branches: [dev, main]
    # labeled: adding ci:full re-runs the check with the merge-grade set. edited: a new base runs
    # the selection again, so a pull request retargeted to main is judged in the release's shape;
    # a new title or description has its refusals read anew, re-using the run before it when that
    # run is green on the same head.
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [dev]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1" # weekly, on the default branch dev: the release tier and the rebuilds
  workflow_dispatch:
    inputs:
      from-source:
        description: build the set from the pins even when a set for this commit is cached
        type: boolean
        default: false
      release-tier:
        description: judge the release tier too (a run on main always does)
        type: boolean
        default: false
      weekly:
        description: the weekly run's shape (the release tier, the rebuilds, an issue when red), dispatched on dev
        type: boolean
        default: false

permissions: {}

# A pull request's newer push cancels its older run. A push to dev, a tag's run and the weekly run
# are never cancelled while running; a newer one of the same event replaces one still waiting to
# start, so of three quick merges the middle one gets no run, and the newest run judges them all.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('release-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_DATE_EPOCH: "1767225600"
  UV_VERSION: "0.9.22"
  # The judge's own environment exactly as uv.lock pins it, on the Python it is developed with.
  UV_LOCKED: "1"
  UV_PYTHON: "3.14.2"
  # Every build of this package, the editable one uv run makes included, uses the pinned backend.
  UV_BUILD_CONSTRAINT: release/build-constraints.txt

jobs:
  plan:
    name: plan
    # Which jobs this run needs, from its event and the paths it changes, and each judge job's
    # shards, generated from tests/release_shards.toml: no shard is named in this file.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # A push of documentation alone onto a green head re-uses that head's run, found by a read of
      # this pull request's runs.
      actions: read
    outputs:
      set: ${{ steps.plan.outputs.set }}
      runner: ${{ steps.plan.outputs.runner }}
      platform: ${{ steps.plan.outputs.platform }}
      harness: ${{ steps.plan.outputs.harness }}
      upstream: ${{ steps.plan.outputs.upstream }}
      workflow: ${{ steps.plan.outputs.workflow }}
      progress: ${{ steps.plan.outputs.progress }}
      news: ${{ steps.plan.outputs.news }}
      agents: ${{ steps.plan.outputs.agents }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      full: ${{ steps.plan.outputs.full }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
      publish: ${{ steps.plan.outputs.publish }}
      judge: ${{ steps.plan.outputs.judge }}
      accept: ${{ steps.plan.outputs.accept }}
      acceptance: ${{ steps.plan.outputs.acceptance }}
      weekly: ${{ steps.plan.outputs.weekly }}
      tier: ${{ steps.plan.outputs.tier }}
      build: ${{ steps.plan.outputs.build }}
      verify: ${{ steps.plan.outputs.verify }}
      coverage: ${{ steps.plan.outputs.coverage }}
      selected: ${{ steps.plan.outputs.selected }}
      refusals: ${{ steps.plan.outputs.refusals }}
      review_refusals: ${{ steps.plan.outputs.review_refusals }}
      macos: ${{ steps.plan.outputs.macos }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the merge base, the earlier tip and the pull request's commit messages
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The plan
        id: plan
        env:
          PLAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAN_BASE: ${{ github.event.pull_request.base.sha }}
          PLAN_BEFORE: ${{ github.event.before }}
          PLAN_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # The self-check, which names the author the review check holds the reviewer apart from.
          PLAN_BODY: ${{ github.event.pull_request.body }}
          PLAN_TITLE: ${{ github.event.pull_request.title }}
          PLAN_RELEASE_TIER: ${{ inputs.release-tier }}
          PLAN_WEEKLY: ${{ inputs.weekly }}
          PLAN_HEAD_REF: ${{ github.head_ref }}
          # An edit: its action, and the old base's name, which the event carries only when the
          # base moved.
          PLAN_ACTION: ${{ github.event.action }}
          PLAN_OLD_BASE: ${{ github.event.changes.base.ref.from }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python -I release/ci_plan.py

  quick:
    name: quick (ruff, mypy, the unit tests, lint)
    # Everything that needs no artifact set, on every run, beside the build and the judges: a
    # tree that fails it costs a few job-minutes more and still cannot merge, since ci-status
    # waits on it. lint is the writing conventions: it gates ci-status and is no goal check.
    # The push of an acceptance (the accepted state alone) needs nothing judged: the plan says so.
    needs: plan
    if: needs.plan.outputs.acceptance != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the rules read the git history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: ruff
        run: |
          uv run ruff check src tests release
          uv run ruff format --check src tests release
      - name: mypy
        run: uv run mypy
      - name: The unit tests that need no artifact set
        run: uv run pytest -p no:cacheprovider -q -m "not slow" -n 4 tests/unit
      - name: The rules checks
        # No artifact set here: a rule that reads it is blocked, and own-rest runs it with one. Its
        # JUnit report holds each check's time, which the next step reads.
        run: uv run pytest -p no:cacheprovider -q tests/checks/test_rules.py --partial "quick has no artifact set" --junitxml build/ci/quick-rules.xml
      - name: The rules checks' times against the budget
        # Warnings only, as annotations and in the job's summary: a duration depends on the host
        # that ran it, so it never fails a run; the fuel half of the budget is lint's and the
        # gather's, since fuel counts operations.
        run: uv run python tests/harness/budget.py --times build/ci/quick-rules.xml
      - name: lint
        # The writing conventions, and the accepted fuel against the budget's caps.
        run: uv run pytest -p no:cacheprovider -q tests/lint

  review:
    name: review
    # The review file's own check, apart from the code's: on every pull request into dev, the push
    # that carries the review file among them, whatever the plan judges, so a run re-used for that
    # push still reads it. Red while the plan refuses the review file (none after the last code,
    # signed by the author, or a verdict that does not begin "Lands"); a documentation-only pull
    # request asks none. It runs whatever happened before it, so a plan that failed leaves it red,
    # never skipped. ci-status reads the same refusals and does not wait for this job.
    needs: plan
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The plan refused no review file
        env:
          REVIEW_REFUSALS: ${{ needs.plan.outputs.review_refusals }}
        run: |
          if [ "$REVIEW_REFUSALS" != "[]" ]; then
            echo "the review check refused this pull request: ${REVIEW_REFUSALS:-(no plan)}"
            exit 1
          fi
          echo "the review file holds"

  inputs:
    name: the set's key, and whether this run may reuse a set
    # A set the cache holds under this commit's key is reused where a cached set is trusted: a pull
    # request into dev, a push to dev, the weekly run on dev, and a dispatch on a branch other than
    # main, not from-source. A pull request into main, a run on main and a tag build their own.
    # Every consumer compares reuse with == 'true', so an empty or broken output builds from source.
    # It runs when the plan judges or rebuilds: a tag judges nothing and still compiles.
    needs: plan
    if: needs.plan.outputs.judge == 'true' || needs.plan.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The set's key (release/set_key.py prints what it hashes)
        id: key
        run: uv run --no-project python -I release/set_key.py key >> "$GITHUB_OUTPUT"
      - name: Is a set cached under the key
        # This ref's cache, then the base branch's and the default branch's (dev's).
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Reuse only where a cached set is trusted
        id: decide
        env:
          FROM_SOURCE: ${{ inputs.from-source }}
          HIT: ${{ steps.lookup.outputs.cache-hit }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          trusted=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$GITHUB_BASE_REF" != main ]; then trusted=true; fi ;;
            push | schedule)
              if [ "$GITHUB_REF" = refs/heads/dev ]; then trusted=true; fi ;;
            workflow_dispatch)
              if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
                trusted=true
              fi ;;
          esac
          reuse=false
          if [ "$trusted" = true ] && [ "$FROM_SOURCE" != true ] && [ "$HIT" = true ]; then
            reuse=true
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "event $GITHUB_EVENT_NAME, $GITHUB_REF ($GITHUB_REF_TYPE), base '$GITHUB_BASE_REF', from-source '$FROM_SOURCE', cached '$HIT': reuse=$reuse"
          if [ "$trusted" = true ] && [ "$HIT" != true ]; then
            echo "no cache this run reads (this ref's or dev's) holds $KEY: the build job compiles it"
          fi

  build:
    name: build on arm64 Linux, or reuse a set
    # The published set is built on arm64 Linux, the host set-cache.yml compiles the cached set
    # on, on every run that does not reuse one: the release shape (a tag, a pull request into
    # main, a dispatch, the weekly run where no set is cached) and a pull request or a push to dev
    # whose key no cache holds, whose set save-set keeps. A run that reuses a cached set restores
    # it on x86_64 Linux. It starts beside quick, not after it: ci-status waits on both. On a tag
    # it first holds the tagged tree to the release pull request's acceptance, which needs no
    # compile, so a tag on the wrong commit fails in a minute.
    needs: [plan, inputs]
    if: needs.plan.outputs.judge == 'true' || needs.plan.outputs.rebuild == 'true'
    runs-on: ${{ needs.inputs.outputs.reuse == 'true' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      assets-id: ${{ steps.assets.outputs.artifact-id }}
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
      # python.wasm's SHA-256 for the gather, which never holds the assets.
      wasm-sha256: ${{ steps.wasm.outputs.sha256 }}
      # The set's own SHA256SUMS (not the release assets'), for the gather's G2 and G7.
      set-sums-sha256: ${{ steps.set-sums.outputs.sha256 }}
      # Built or reused, from what ran (the compile step's outcome), for the gather's G7.
      set-source: ${{ steps.compile.outcome == 'success' && 'built' || format('reused {0}', needs.inputs.outputs.key) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # a tag, and a release pull request, are checked against main's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The tagged tree is the judged tree plus its acceptance
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: uv run python tests/harness/gather.py --prove-set --tree-only
      - name: The version, and the tag it is released under, agree
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run python release/version.py check --tag "$GITHUB_REF_NAME"
            # A release is cut from main: the tagged commit must be in main's history.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          elif [ "$GITHUB_BASE_REF" = main ]; then
            # The release pull request holds now what its tag will: the version's section is
            # dated, its tag is not made yet, and main's tip is in the head's history, so the
            # owner's push is a fast-forward.
            version=$(uv run python release/version.py show)
            uv run python release/version.py check --tag "v$version"
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "the tag v$version exists already: bump the version before the release"
              exit 1
            fi
            git merge-base --is-ancestor origin/main HEAD
          else
            uv run python release/version.py check
          fi
      - name: Download the pinned inputs
        if: needs.inputs.outputs.reuse != 'true'
        run: scripts/00_download.sh
      - name: Build from the pins
        id: compile
        if: needs.inputs.outputs.reuse != 'true'
        run: scripts/build.sh
      - name: The set this commit's key names
        if: needs.inputs.outputs.reuse == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ needs.inputs.outputs.key }}
          fail-on-cache-miss: true
      - name: The reused set in build/artifacts
        if: needs.inputs.outputs.reuse == 'true'
        run: |
          mkdir -p build
          mv wasi-python-set build/artifacts
      - name: The set is this commit's
        # Every run, no if: each file against the set's own SHA256SUMS, no other file, MANIFEST's
        # pin and recipe lines against this checkout; and a reused set's key.
        env:
          REUSED_KEY: ${{ needs.inputs.outputs.reuse == 'true' && needs.inputs.outputs.key || '' }}
        run: |
          if [ -n "$REUSED_KEY" ]; then
            uv run --no-project python -I release/set_key.py verify build/artifacts --key "$REUSED_KEY"
          else
            uv run --no-project python -I release/set_key.py verify build/artifacts
          fi
      - name: The wheel
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv run --no-project python -I release/licences.py append build/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
          uv run --no-project python -I release/licences.py check dist/wasi_python-*.whl build/artifacts
      - name: The source trees are their tarballs plus the recorded patches
        # On a source run only: a reuse run has no tree here. Each rebuild job runs the same step
        # on its own tree, with no if:.
        if: steps.compile.outcome == 'success'
        # All forty trees must pass (seaborn's sdist the twenty-seventh, statsmodels' the
        # twenty-eighth, python-docx's and python-pptx's sdists the twenty-ninth and thirtieth,
        # pdfminer.six's and xarray's the next two, libjpeg-turbo's the thirty-third, zstd's the
        # thirty-fourth, then pixman, libpng, cairo, cffi, cairocffi and CairoSVG): a skipped check
        # (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
            -k test_source_tree_matches_its_tarball | tee zero-patch.txt
          grep -Eq "^40 passed, [0-9]+ deselected in" zero-patch.txt
      - name: The SHA-256 of python.wasm, handed to the gather
        id: wasm
        run: echo "sha256=$(shasum -a 256 build/artifacts/python.wasm | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: The SHA-256 of the set's own SHA256SUMS, handed to the gather
        id: set-sums
        run: echo "sha256=$(shasum -a 256 build/artifacts/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: Release assets
        # The set again, just before it is packed: the wheel's copy and the zero-patch step ran
        # since it was checked, and what is packed must be what was checked.
        run: |
          uv run --no-project python -I release/set_key.py verify build/artifacts
          uv run python release/version.py assets build/artifacts dist/wasi_python-*.whl release-assets
      - name: The SHA-256 of SHA256SUMS, handed to every job that reads the assets
        id: sums
        run: echo "sha256=$(shasum -a 256 release-assets/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
      - name: What this run checks, signs and publishes
        env:
          ASSETS_ID: ${{ steps.assets.outputs.artifact-id }}
          ASSETS_DIGEST: ${{ steps.assets.outputs.artifact-digest }}
          SUMS_SHA256: ${{ steps.sums.outputs.sha256 }}
        run: |
          echo "release-assets: artifact $ASSETS_ID, digest $ASSETS_DIGEST"
          echo "SHA256SUMS: sha256 $SUMS_SHA256"
          cat release-assets/SHA256SUMS
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore

  rebuild-linux-x86-64:
    name: rebuild from the pins (ubuntu-24.04), and the build shard
    # x86_64 Linux rebuilds the whole set from an empty downloads/ and build/, beside the build,
    # checks every source tree against its tarball and the recorded patches, then judges the build
    # shard on that clean tree: every component's tree, the compile records, the zlib tarball, and
    # the checks that need the build host's unpacked tools and sdists, which a reused set does not
    # have. It uploads that record and hands on its id and SHA-256 for the gather, whose G2 holds
    # the record's set to the build's bytes, and uploads its SHA256SUMS and wheel, which same-bytes
    # compares with the set's, as it does the macOS rebuild's. Only the release shape rebuilds, and
    # the build shard runs where the plan's build output says: every rebuild but a tag's, whose
    # tree the release pull request judged and whose run has no gather. Each rebuild host compiles
    # with its own pinned wasi-sdk clang, and every compile carries -ffp-contract=off, set in the
    # toolchain's own configuration files by step 10: that makes wasi-sdk's builds of clang for
    # each host emit the same bytes, so each vote rests on its own host's toolchain. The wheel is
    # built after the shard, whose record must be of a clean tree. A hung job frees the gate after
    # two hours.
    needs: plan
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      record-id: ${{ steps.record.outputs.artifact-id }}
      record-sha256: ${{ steps.record-sha.outputs.sha256 }}
      sums-id: ${{ steps.sums.outputs.artifact-id }}
      wheel-id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the build shard's rules read the checkout's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The runner's own tools (unpinned host inputs, recorded here)
        # The core count beside every time figure, read the same way on Linux and macOS.
        # binfmt_misc: a Linux runner that could run another architecture's program through its
        # own, unpinned qemu would hide a gap in the emulated compiler's closure (macOS has none).
        run: |
          uname -srm
          getconf _NPROCESSORS_ONLN
          echo "binfmt_misc: $(ls /proc/sys/fs/binfmt_misc/ 2> /dev/null | tr '\n' ' ')"
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
          # The runner's own python3, which step 10's shim keeps out of the build,
          # named so the log records what stood on PATH.
          python3 --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - name: The source trees are their tarballs plus the recorded patches
        # All forty trees must pass (seaborn's sdist the twenty-seventh, statsmodels' the
        # twenty-eighth, python-docx's and python-pptx's sdists the twenty-ninth and thirtieth,
        # pdfminer.six's and xarray's the next two, libjpeg-turbo's the thirty-third, zstd's the
        # thirty-fourth, then pixman, libpng, cairo, cffi, cairocffi and CairoSVG): a skipped check
        # (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
            -k test_source_tree_matches_its_tarball | tee zero-patch.txt
          grep -Eq "^40 passed, [0-9]+ deselected in" zero-patch.txt
      - name: The build shard
        # Only the checks that need the build tree: every component's tree, the compile records and
        # the zlib tarball, on this job's own build. The rest of the judge runs in the judge jobs.
        if: needs.plan.outputs.build == 'true'
        run: uv run pytest -p no:cacheprovider --shard=build --progress-latest "$RUNNER_TEMP/record/latest.json"
      - name: The record's SHA-256
        id: record-sha
        if: needs.plan.outputs.build == 'true'
        run: uv run python -c "import hashlib, sys; print('sha256=' + hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$RUNNER_TEMP/record/latest.json" >> "$GITHUB_OUTPUT"
      - id: record
        if: needs.plan.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-build-build
          path: ${{ runner.temp }}/record/latest.json
          if-no-files-found: error
      - id: sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-ubuntu-24.04
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv run --no-project python -I release/licences.py append build/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - id: wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-ubuntu-24.04
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-logs-ubuntu-24.04
          path: |
            build/logs/
            ${{ runner.temp }}/record/
          if-no-files-found: ignore

  rebuild-macos-arm64:
    name: rebuild from the pins (macos-15)
    # arm64 macOS rebuilds the whole set from an empty downloads/ and build/, beside the build,
    # checks every source tree against its tarball and the recorded patches, and uploads its
    # SHA256SUMS and wheel, which same-bytes compares with the set's: the vote's third host, on
    # another system than the build's arm64 Linux and another architecture than x86_64 Linux.
    # Only the release shape rebuilds. A hung job frees the gate after two hours.
    needs: plan
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      sums-id: ${{ steps.sums.outputs.artifact-id }}
      wheel-id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The runner's own tools (unpinned host inputs, recorded here)
        # The core count beside every time figure, read the same way on Linux and macOS.
        # binfmt_misc: a Linux runner that could run another architecture's program through its
        # own, unpinned qemu would hide a gap in the emulated compiler's closure (macOS has none).
        run: |
          uname -srm
          getconf _NPROCESSORS_ONLN
          echo "binfmt_misc: $(ls /proc/sys/fs/binfmt_misc/ 2> /dev/null | tr '\n' ' ')"
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
          # The runner's own python3, which step 10's shim keeps out of the build,
          # named so the log records what stood on PATH.
          python3 --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - name: The source trees are their tarballs plus the recorded patches
        # All forty trees must pass (seaborn's sdist the twenty-seventh, statsmodels' the
        # twenty-eighth, python-docx's and python-pptx's sdists the twenty-ninth and thirtieth,
        # pdfminer.six's and xarray's the next two, libjpeg-turbo's the thirty-third, zstd's the
        # thirty-fourth, then pixman, libpng, cairo, cffi, cairocffi and CairoSVG): a skipped check
        # (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
            -k test_source_tree_matches_its_tarball | tee zero-patch.txt
          grep -Eq "^40 passed, [0-9]+ deselected in" zero-patch.txt
      - id: sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-macos-15
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv run --no-project python -I release/licences.py append build/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - id: wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-macos-15
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-logs-macos-15
          path: build/logs/
          if-no-files-found: ignore

  same-bytes:
    name: the same bytes from every host
    # Each rebuild's SHA256SUMS lists the whole set (the three artifacts, MANIFEST and the
    # licences) and must equal the set's, byte for byte, from arm64 macOS and from x86_64 Linux,
    # each with its own pinned clang, so three hosts agree on the bytes the build made on arm64
    # Linux. The .tar.xz asset is made from the set deterministically but is outside this claim.
    # save-set, judged, attest, publish and ci-status need this job, so nothing is cached, signed
    # or published that both hosts did not rebuild; the gather does not, since the records it reads
    # are complete before it. Only the release shape rebuilds; it checks out this repository for
    # the local action alone.
    needs: [plan, build, rebuild-linux-x86-64, rebuild-macos-arm64]
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: The rebuild jobs handed on artifact ids
        env:
          ARM64_SUMS_ID: ${{ needs.rebuild-macos-arm64.outputs.sums-id }}
          ARM64_WHEEL_ID: ${{ needs.rebuild-macos-arm64.outputs.wheel-id }}
          X86_64_SUMS_ID: ${{ needs.rebuild-linux-x86-64.outputs.sums-id }}
          X86_64_WHEEL_ID: ${{ needs.rebuild-linux-x86-64.outputs.wheel-id }}
        run: |
          for id in "$ARM64_SUMS_ID" "$ARM64_WHEEL_ID" "$X86_64_SUMS_ID" "$X86_64_WHEEL_ID"; do
            case "$id" in
              "" | *[!0-9]*) echo "a rebuild job handed on no artifact id"; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-macos-arm64.outputs.sums-id }}
          path: rebuilds/macos-15
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-macos-arm64.outputs.wheel-id }}
          path: rebuilt-wheels/macos-15
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.sums-id }}
          path: rebuilds/ubuntu-24.04
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.wheel-id }}
          path: rebuilt-wheels/ubuntu-24.04
          digest-mismatch: error
      - name: Every rebuild's SHA256SUMS is the set's, byte for byte
        # On the weekly run the set is dev's cached set when the cache holds its key, so this cmp
        # is the one that would catch a stale set or a planted cache entry.
        env:
          SET_SOURCE: ${{ needs.build.outputs.set-source }}
        run: |
          mkdir set
          tar -xJf release-assets/*.tar.xz -C set
          sums=$(echo set/wasi-python-*/SHA256SUMS)
          echo "the set: $SET_SOURCE"
          for runner in macos-15 ubuntu-24.04; do
            cmp "$sums" "rebuilds/$runner/SHA256SUMS"
            echo "$runner: the same SHA256SUMS as the set"
          done
          cat "$sums"
          # The index binds the tarball's files only once each is checked against it: every listed
          # file holds the bytes listed, the tarball holds one folder and nothing else beside the
          # listed files (a nested SHA256SUMS or a symlink cannot hide), and every published file
          # and a licence are among the names, so a file dropped from both still fails.
          if [ "$(find set -mindepth 1 -maxdepth 1 | wc -l)" -ne 1 ]; then
            echo "the set's tarball holds more than its one folder"
            exit 1
          fi
          # Before entering the folder, so the folder itself cannot be a symlink to another place.
          if [ -n "$(find set -type l)" ]; then
            echo "the set's tarball holds a symlink"
            exit 1
          fi
          cd set/wasi-python-*
          sha256sum --strict -c SHA256SUMS
          listed=$(awk '{print $2}' SHA256SUMS | LC_ALL=C sort)
          present=$(find . -mindepth 1 ! -type d ! -path ./SHA256SUMS | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$listed" != "$present" ]; then
            echo "the set's tarball holds other files than its SHA256SUMS lists"
            exit 1
          fi
          for name in python.wasm python-snapshot.wasm python-stdlib.zip MANIFEST; do
            if ! printf '%s\n' "$listed" | grep -qxF "$name"; then
              echo "the set's SHA256SUMS does not list $name"
              exit 1
            fi
          done
          if ! printf '%s\n' "$listed" | grep -q '^LICENSES/'; then
            echo "the set's SHA256SUMS lists no file under LICENSES/"
            exit 1
          fi
          echo "every file in the set's tarball is the bytes its SHA256SUMS lists"
      - name: The wheel carries the set and is the wheel each host rebuilt
        # Three rules name what differs; the last comparison covers everything else in the wheel
        # (runner.py, METADATA), so a wheel built from any other source or set fails.
        run: |
          sums="$PWD/$(echo set/wasi-python-*/SHA256SUMS)"
          wheel="$(echo release-assets/wasi_python-*.whl)"
          mkdir wheel && unzip -q "$wheel" -d wheel
          ( cd wheel/wasi_python/artifacts && sha256sum --strict -c "$sums" )
          cmp "$sums" wheel/wasi_python/artifacts/SHA256SUMS
          listed=$(awk '{print $2}' "$sums"; echo SHA256SUMS)
          present=$(cd wheel/wasi_python/artifacts && find . -type f | sed 's#^\./##')
          if [ "$(echo "$listed" | sort)" != "$(echo "$present" | sort)" ]; then
            echo "the wheel's artifacts are not exactly the set's"
            exit 1
          fi
          for runner in macos-15 ubuntu-24.04; do
            rebuilt="rebuilt-wheels/$runner/$(basename "$wheel")"
            if ! cmp -s "$wheel" "$rebuilt"; then
              echo "$runner rebuilt a different wheel; entries only in one (name, mode, size, CRC, date):"
              python3 - "$wheel" "$rebuilt" <<'PY'
          import sys, zipfile
          a, b = ({(i.filename, oct(i.external_attr >> 16), i.file_size, i.CRC, i.date_time)
                   for i in zipfile.ZipFile(p).infolist()} for p in sys.argv[1:])
          for row in sorted(a ^ b):
              print("release" if row in a else "rebuilt", *row)
          print("(no entry differs: the zip's own records do)" if a == b else "")
          PY
              exit 1
            fi
            echo "$runner: the same wheel"
          done

  save-set:
    name: keep the set this run built and both hosts rebuilt
    # A run on a branch that built its set writes it to the cache under the key its own checkout
    # gives: a pull request's to its own scope, a push to dev's to dev's, which every pull request
    # reads. On the release shape only once same-bytes has matched it with both rebuilds.
    needs: [plan, build, same-bytes]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.set-source == 'built' && !startsWith(github.ref, 'refs/tags/') && (needs.plan.outputs.rebuild != 'true' || needs.same-bytes.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: The set, out of the release assets
        run: |
          mkdir unpacked
          tar -xJf release-assets/*.tar.xz -C unpacked
          top=$(echo unpacked/wasi-python-*)
          mv "$top" wasi-python-set
      - name: The set's key from this checkout
        id: key
        run: uv run --no-project python -I release/set_key.py key >> "$GITHUB_OUTPUT"
      - name: The set is this commit's
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: uv run --no-project python -I release/set_key.py verify wasi-python-set --key "$KEY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ steps.key.outputs.key }}

  judged:
    name: the bytes and the tree the release pull request judged
    # A tag's run judges nothing again, so before anything is signed this job holds what it would
    # publish to the release pull request's acceptance, the newest line of the progress history:
    # that line is a release pull request's (from CI, the release tier), whole and clean, made on
    # the tagged commit's parent; the tagged commit adds that acceptance and nothing else, since
    # the wheel carries the tree's own code, which no set hash covers; and the set's own
    # SHA256SUMS and python.wasm, hashed here from the build's files after same-bytes, are the
    # ones it accepted. When the tag uploads to PyPI, the wheel is within the file limit PyPI has
    # granted. Only a pushed tag gets here (the plan's publish).
    needs: [plan, build, same-bytes]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2 # the tagged commit and its parent, the commit the release judged
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: The wheel is within the file limit PyPI has granted, when it goes to PyPI
        # PyPI refuses a file past the project's limit, 100 MiB until PyPI raises it, and refuses
        # it only at the upload, after the signature and the GitHub release. So when this tag
        # uploads (the pypi job's own condition) the wheel is held here to the limit PyPI has
        # granted, the repository variable PYPI_FILE_LIMIT_GRANTED in bytes, or PyPI's default
        # while it is unset; nothing is signed or published past it. With no upload, any size
        # passes.
        env:
          TO_PYPI: ${{ vars.PYPI_PUBLISH == 'true' }}
          PYPI_FILE_LIMIT_GRANTED: ${{ vars.PYPI_FILE_LIMIT_GRANTED }}
        run: |
          if [ "$TO_PYPI" != "true" ]; then
            echo "this tag does not upload to PyPI: the GitHub release takes a wheel of any size"
            exit 0
          fi
          limit="${PYPI_FILE_LIMIT_GRANTED:-104857600}"
          case "$limit" in
            "" | *[!0-9]* | 0*)
              echo "PYPI_FILE_LIMIT_GRANTED is '$limit', not a whole number of bytes"
              exit 1
              ;;
          esac
          if [ "${#limit}" -gt 15 ]; then
            echo "PYPI_FILE_LIMIT_GRANTED is '$limit', too long to be a number of bytes"
            exit 1
          fi
          set -- release-assets/*.whl
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "the build's files do not hold exactly one wheel"
            exit 1
          fi
          bytes=$(($(wc -c < "$1")))
          if [ "$bytes" -gt "$limit" ]; then
            echo "$1 is $bytes bytes, past the $limit PyPI has granted: nothing is signed or published"
            echo "once PyPI grants more, set PYPI_FILE_LIMIT_GRANTED to it and re-run the failed jobs; this line prints the limit read"
            exit 1
          fi
          echo "$1 is $bytes bytes, within the $limit PyPI has granted"
      - name: These are the bytes the release pull request accepted, on the tree it judged
        run: |
          mkdir set
          tar -xJf release-assets/*.tar.xz -C set
          set -- set/wasi-python-*
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "the set's tarball does not hold exactly one folder"
            exit 1
          fi
          sums=$(sha256sum "$1/SHA256SUMS" | cut -c1-64)
          wasm=$(sha256sum "$1/python.wasm" | cut -c1-64)
          uv run python tests/harness/gather.py --prove-set "$sums" "$wasm"

  judge-macos:
    name: judge (macos-15, ${{ matrix.shard }})
    # One leg per shard the plan selected on this system (generated from tests/release_shards.toml).
    # Each leg runs its shard serially against accepted.json and uploads its record under its own
    # name, record-<system>-<shard>; an artifact's name is unique within a run, so the name binds
    # the record to its leg, and the gather finds each record by it.
    needs: [plan, build]
    if: needs.plan.outputs.macos != '[]'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.macos) }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The judge reads its repository's text as UTF-8 on every host, as Python 3.15 does by
      # default (PEP 686); Windows' locale codec is not UTF-8 (the branch dry run 39182550825).
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the rules in own-rest read the git history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: Unpack the artifact set; the wheel into dist/
        run: |
          uv run python -c "import sys, tarfile, glob; tarfile.open(glob.glob('release-assets/*.tar.xz')[0]).extractall(sys.argv[1], filter='data')" "$RUNNER_TEMP/set"
          echo "WASI_PYTHON_ARTIFACTS=$(uv run python -c "import glob, sys; print(glob.glob(sys.argv[1] + '/wasi-python-*')[0])" "$RUNNER_TEMP/set")" >> "$GITHUB_ENV"
          mkdir -p dist
          cp release-assets/wasi_python-*.whl dist/
      - name: What the shard needs (the upstream kit and source trees, verified)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run python tests/upstream/fetch.py --shard "$SHARD"
      - name: The shard
        # A leg the plan names in coverage (Linux, a run with the merge-grade set) runs its shard
        # under coverage.py, which measures src/wasi_python for the README's Codecov badge.
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE: ${{ contains(fromJSON(needs.plan.outputs.coverage), matrix.shard) && runner.os == 'Linux' }}
          COVERAGE_CORE: sysmon
        run: |
          if [ "$COVERAGE" = true ]; then
            uv run coverage run --data-file=build/coverage/.coverage --source=src/wasi_python -m pytest -p no:cacheprovider --shard="$SHARD" --progress-latest "$RUNNER_TEMP/record/latest.json"
          else
            uv run pytest -p no:cacheprovider --shard="$SHARD" --progress-latest "$RUNNER_TEMP/record/latest.json"
          fi
      - id: record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-macos-${{ matrix.shard }}
          path: ${{ runner.temp }}/record/latest.json
          if-no-files-found: error
      - name: The coverage report
        if: contains(fromJSON(needs.plan.outputs.coverage), matrix.shard) && runner.os == 'Linux'
        run: uv run coverage xml --data-file=build/coverage/.coverage -o build/coverage/coverage.xml
      - name: The coverage report to Codecov
        # The upload carries the repository's CODECOV_TOKEN and nothing else. A failed upload
        # (Codecov's outage) is logged by the action and not failed, so it never turns a run red.
        if: contains(fromJSON(needs.plan.outputs.coverage), matrix.shard) && runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1 # the uploader the action fetches, named rather than its latest
          fail_ci_if_error: false
      - name: Keep the shard's record when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-record-macos-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  judge-linux:
    name: judge (ubuntu-24.04, ${{ matrix.shard }})
    # One leg per shard the plan selected on this system (generated from tests/release_shards.toml).
    # Each leg runs its shard serially against accepted.json and uploads its record under its own
    # name, record-<system>-<shard>; an artifact's name is unique within a run, so the name binds
    # the record to its leg, and the gather finds each record by it.
    needs: [plan, build]
    if: needs.plan.outputs.linux != '[]'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.linux) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The judge reads its repository's text as UTF-8 on every host, as Python 3.15 does by
      # default (PEP 686); Windows' locale codec is not UTF-8 (the branch dry run 39182550825).
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the rules in own-rest read the git history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: Unpack the artifact set; the wheel into dist/
        run: |
          uv run python -c "import sys, tarfile, glob; tarfile.open(glob.glob('release-assets/*.tar.xz')[0]).extractall(sys.argv[1], filter='data')" "$RUNNER_TEMP/set"
          echo "WASI_PYTHON_ARTIFACTS=$(uv run python -c "import glob, sys; print(glob.glob(sys.argv[1] + '/wasi-python-*')[0])" "$RUNNER_TEMP/set")" >> "$GITHUB_ENV"
          mkdir -p dist
          cp release-assets/wasi_python-*.whl dist/
      - name: What the shard needs (the upstream kit and source trees, verified)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run python tests/upstream/fetch.py --shard "$SHARD"
      - name: The shard
        # A leg the plan names in coverage (Linux, a run with the merge-grade set) runs its shard
        # under coverage.py, which measures src/wasi_python for the README's Codecov badge.
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE: ${{ contains(fromJSON(needs.plan.outputs.coverage), matrix.shard) && runner.os == 'Linux' }}
          COVERAGE_CORE: sysmon
        run: |
          if [ "$COVERAGE" = true ]; then
            uv run coverage run --data-file=build/coverage/.coverage --source=src/wasi_python -m pytest -p no:cacheprovider --shard="$SHARD" --progress-latest "$RUNNER_TEMP/record/latest.json"
          else
            uv run pytest -p no:cacheprovider --shard="$SHARD" --progress-latest "$RUNNER_TEMP/record/latest.json"
          fi
      - id: record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/record/latest.json
          if-no-files-found: error
      - name: The coverage report
        if: contains(fromJSON(needs.plan.outputs.coverage), matrix.shard) && runner.os == 'Linux'
        run: uv run coverage xml --data-file=build/coverage/.coverage -o build/coverage/coverage.xml
      - name: The coverage report to Codecov
        # The upload carries the repository's CODECOV_TOKEN and nothing else. A failed upload
        # (Codecov's outage) is logged by the action and not failed, so it never turns a run red.
        if: contains(fromJSON(needs.plan.outputs.coverage), matrix.shard) && runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1 # the uploader the action fetches, named rather than its latest
          fail_ci_if_error: false
      - name: Keep the shard's record when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-record-linux-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

