  save-set:
    name: keep the set this run built and both hosts rebuilt
    # A branch run that built its set writes it to the cache under the key its
    # own checkout gives, once same-bytes has matched it with both rebuilds; a later dispatch on this
    # branch with the same key reuses it.
    needs: [build, same-bytes]
    if: needs.build.outputs.set-source == 'built' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file.
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: The set, out of the release assets
        run: |
          mkdir unpacked
          tar -xJf release-assets/*.tar.xz -C unpacked
          top=$(echo unpacked/wasi-python-*)
          mv "$top" wasi-python-set
      - name: The set's key from this checkout
        id: key
        run: uv run --no-project python -I release/set_key.py key >> "$GITHUB_OUTPUT"
      - name: The set is this commit's
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: uv run --no-project python -I release/set_key.py verify wasi-python-set --key "$KEY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ steps.key.outputs.key }}

