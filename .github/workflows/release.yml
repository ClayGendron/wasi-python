  verify:
    name: verify (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file.
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: The wheel, installed fresh, runs a program in one call
        # Installed by its plain name, no extra: `pip install wasi-python` must run programs, so
        # a wheel whose plain install could not never publishes.
        run: |
          wheel="$(ls release-assets/wasi_python-*.whl)"
          uv run --isolated --no-project --with "wasi-python @ ./$wheel" python -c "
          import tempfile, wasi_python
          done = wasi_python.run(['-c', 'import pandas; print(pandas.Series([1, 2, 3]).sum())'], root=tempfile.mkdtemp())
          print(done)
          assert (done.exit_code, done.stdout) == (0, b'6\n'), done
          "
          # The wheel's own command prints the one line its README promises.
          line=$(uv run --isolated --no-project --with "wasi-python @ ./$wheel" \
            wasi-python run -- -c "print(1)")
          echo "$line"
          want='{"exit_code": 0, "fuel_used": null, "stderr": "", "stdout": "1\n", "trapped": null, "truncated": []}'
          if [ "$line" != "$want" ]; then
            echo "the installed command printed another line"
            exit 1
          fi
          # The empty `run` extra, kept for 0.1.0a3's instructions. `uv run --with` installs an
          # unknown extra silently, so an import would prove nothing: assert the metadata.
          uv run --isolated --no-project --with "wasi-python[run] @ ./$wheel" python -c "
          import importlib.metadata, re
          meta = importlib.metadata.metadata('wasi-python')
          extras = meta.get_all('Provides-Extra') or []
          reqs = meta.get_all('Requires-Dist') or []
          print('Provides-Extra:', extras, 'Requires-Dist:', reqs)
          assert extras == ['run'], extras
          assert not [r for r in reqs if re.search(r'extra\s*==', r)], reqs
          "
        env:
          WASI_PYTHON_ARTIFACTS: ""

  attest:
    name: attest the release assets
    # Build provenance for every asset, signed through Sigstore's public-good instance and then
    # verified strictly, before anything is published, and only once arm64 Linux and
    # x86_64 Linux rebuilt the same bytes (same-bytes). Only a pushed tag gets here: a signature is
    # permanent in the public transparency log, so dry runs never sign.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes, gather]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file.
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Verify each asset as a user will
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

  publish:
    name: publish the GitHub release
    # Only a pushed tag publishes; a manual run, even started on a tag, never does.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes, attest, gather]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file.
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --no-project python release/version.py notes "$version" > notes.md
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "wasi-python $version" --notes-file notes.md --verify-tag $prerelease

  pypi:
    name: publish the wheel on PyPI
    # Off until the owner registers this workflow as a trusted publisher on PyPI and sets the
    # repository variable PYPI_PUBLISH to true.
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file.
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: Only the wheel goes to PyPI
        run: mkdir dist && mv release-assets/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
