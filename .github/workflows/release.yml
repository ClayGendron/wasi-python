  gather:
    name: gather the shards' records
    # One verdict from every shard's record, each downloaded by the id its job handed on and
    # checked against the SHA-256 it handed on; tied to this commit, its judge, the build's
    # python.wasm, the lane's acceptance and three systems. It never holds
    # the assets: python.wasm's hash comes from the build job. It writes no history. It waits for
    # same-bytes, so no release record exists without the proof that the set judged is the set the
    # pins make; the build shard's record comes from build-shard, on its own fresh build.
    # On a normal run judge-release is skipped; the gather runs beside it, and after any failed
    # or cancelled need it does not run at all.
    needs: [inputs, build, build-shard, same-bytes, judge-macos, judge-linux, judge-windows, judge-release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Every job handed on its record's id, and the build python.wasm's SHA-256
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        # The set's own SHA256SUMS hash too.
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
          BUILD_RECORD_ID: ${{ needs.build-shard.outputs.record-id }}
          MACOS_OWN_EMBEDDING_ID: ${{ needs.judge-macos.outputs.own-embedding-id }}
          MACOS_OWN_EMBEDDING_A_ID: ${{ needs.judge-macos.outputs.own-embedding-a-id }}
          MACOS_OWN_HOSTILE_ID: ${{ needs.judge-macos.outputs.own-hostile-id }}
          MACOS_OWN_GUEST_ID: ${{ needs.judge-macos.outputs.own-guest-id }}
          MACOS_OWN_RUNNER_ID: ${{ needs.judge-macos.outputs.own-runner-id }}
          MACOS_OWN_REST_ID: ${{ needs.judge-macos.outputs.own-rest-id }}
          MACOS_UPSTREAM_MACOS_ID: ${{ needs.judge-macos.outputs.upstream-macos-id }}
          LINUX_OWN_EMBEDDING_ID: ${{ needs.judge-linux.outputs.own-embedding-id }}
          LINUX_OWN_EMBEDDING_A_ID: ${{ needs.judge-linux.outputs.own-embedding-a-id }}
          LINUX_OWN_HOSTILE_ID: ${{ needs.judge-linux.outputs.own-hostile-id }}
          LINUX_OWN_GUEST_ID: ${{ needs.judge-linux.outputs.own-guest-id }}
          LINUX_OWN_RUNNER_ID: ${{ needs.judge-linux.outputs.own-runner-id }}
          LINUX_OWN_REST_ID: ${{ needs.judge-linux.outputs.own-rest-id }}
          LINUX_UPSTREAM_GROUPBY_ID: ${{ needs.judge-linux.outputs.upstream-groupby-id }}
          LINUX_UPSTREAM_FRAME_ID: ${{ needs.judge-linux.outputs.upstream-frame-id }}
          LINUX_UPSTREAM_NUMPY_A_ID: ${{ needs.judge-linux.outputs.upstream-numpy-a-id }}
          LINUX_UPSTREAM_NUMPY_B_ID: ${{ needs.judge-linux.outputs.upstream-numpy-b-id }}
          LINUX_UPSTREAM_PANDAS_SMALL_ID: ${{ needs.judge-linux.outputs.upstream-pandas-small-id }}
          LINUX_UPSTREAM_PLOT_A_ID: ${{ needs.judge-linux.outputs.upstream-plot-a-id }}
          LINUX_UPSTREAM_PLOT_B_ID: ${{ needs.judge-linux.outputs.upstream-plot-b-id }}
          LINUX_UPSTREAM_PLOT_C_ID: ${{ needs.judge-linux.outputs.upstream-plot-c-id }}
          LINUX_UPSTREAM_PLOT_D_ID: ${{ needs.judge-linux.outputs.upstream-plot-d-id }}
          LINUX_UPSTREAM_PLOT_E_ID: ${{ needs.judge-linux.outputs.upstream-plot-e-id }}
          LINUX_UPSTREAM_PLOT_F_ID: ${{ needs.judge-linux.outputs.upstream-plot-f-id }}
          LINUX_UPSTREAM_PLOT_G_ID: ${{ needs.judge-linux.outputs.upstream-plot-g-id }}
          LINUX_UPSTREAM_PLOT_H_ID: ${{ needs.judge-linux.outputs.upstream-plot-h-id }}
          LINUX_UPSTREAM_PLOT_I_ID: ${{ needs.judge-linux.outputs.upstream-plot-i-id }}
          LINUX_UPSTREAM_SCI_SMOKE_A_ID: ${{ needs.judge-linux.outputs.upstream-sci-smoke-a-id }}
          LINUX_UPSTREAM_SCI_SMOKE_B_ID: ${{ needs.judge-linux.outputs.upstream-sci-smoke-b-id }}
          LINUX_UPSTREAM_PURE_SMOKE_A_ID: ${{ needs.judge-linux.outputs.upstream-pure-smoke-a-id }}
          LINUX_UPSTREAM_PURE_SMOKE_B_ID: ${{ needs.judge-linux.outputs.upstream-pure-smoke-b-id }}
          WINDOWS_OWN_EMBEDDING_ID: ${{ needs.judge-windows.outputs.own-embedding-id }}
          WINDOWS_OWN_EMBEDDING_A_ID: ${{ needs.judge-windows.outputs.own-embedding-a-id }}
          WINDOWS_OWN_HOSTILE_ID: ${{ needs.judge-windows.outputs.own-hostile-id }}
          WINDOWS_OWN_GUEST_ID: ${{ needs.judge-windows.outputs.own-guest-id }}
          WINDOWS_OWN_RUNNER_ID: ${{ needs.judge-windows.outputs.own-runner-id }}
          WINDOWS_UPSTREAM_WINDOWS_ID: ${{ needs.judge-windows.outputs.upstream-windows-id }}
        run: |
          case "$WASM_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of python.wasm"; exit 1 ;;
          esac
          if [ "${#WASM_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of python.wasm"
            exit 1
          fi
          case "$SET_SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of the set's SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SET_SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of the set's SHA256SUMS"
            exit 1
          fi
          for id in "$BUILD_RECORD_ID" "$MACOS_OWN_EMBEDDING_ID" "$MACOS_OWN_EMBEDDING_A_ID" "$MACOS_OWN_HOSTILE_ID" "$MACOS_OWN_GUEST_ID" "$MACOS_OWN_RUNNER_ID" "$MACOS_OWN_REST_ID" "$MACOS_UPSTREAM_MACOS_ID" "$LINUX_OWN_EMBEDDING_ID" "$LINUX_OWN_EMBEDDING_A_ID" "$LINUX_OWN_HOSTILE_ID" "$LINUX_OWN_GUEST_ID" "$LINUX_OWN_RUNNER_ID" "$LINUX_OWN_REST_ID" "$LINUX_UPSTREAM_GROUPBY_ID" "$LINUX_UPSTREAM_FRAME_ID" "$LINUX_UPSTREAM_NUMPY_A_ID" "$LINUX_UPSTREAM_NUMPY_B_ID" "$LINUX_UPSTREAM_PANDAS_SMALL_ID" "$LINUX_UPSTREAM_PLOT_A_ID" "$LINUX_UPSTREAM_PLOT_B_ID" "$LINUX_UPSTREAM_PLOT_C_ID" "$LINUX_UPSTREAM_PLOT_D_ID" "$LINUX_UPSTREAM_PLOT_E_ID" "$LINUX_UPSTREAM_PLOT_F_ID" "$LINUX_UPSTREAM_PLOT_G_ID" "$LINUX_UPSTREAM_PLOT_H_ID" "$LINUX_UPSTREAM_PLOT_I_ID" "$LINUX_UPSTREAM_SCI_SMOKE_A_ID" "$LINUX_UPSTREAM_SCI_SMOKE_B_ID" "$LINUX_UPSTREAM_PURE_SMOKE_A_ID" "$LINUX_UPSTREAM_PURE_SMOKE_B_ID" "$WINDOWS_OWN_EMBEDDING_ID" "$WINDOWS_OWN_EMBEDDING_A_ID" "$WINDOWS_OWN_HOSTILE_ID" "$WINDOWS_OWN_GUEST_ID" "$WINDOWS_OWN_RUNNER_ID" "$WINDOWS_UPSTREAM_WINDOWS_ID"; do
            case "$id" in
              "" | *[!0-9]*) echo "a job handed on no record id"; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-shard.outputs.record-id }}
          path: records/build-shard
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.judge-macos.outputs.own-embedding-id }},${{ needs.judge-macos.outputs.own-embedding-a-id }},${{ needs.judge-macos.outputs.own-hostile-id }},${{ needs.judge-macos.outputs.own-guest-id }},${{ needs.judge-macos.outputs.own-runner-id }},${{ needs.judge-macos.outputs.own-rest-id }},${{ needs.judge-macos.outputs.upstream-macos-id }}
          path: records/judge-macos
          digest-mismatch: error
