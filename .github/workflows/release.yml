      upstream-pure-r-100-sha256: ${{ steps.out.outputs.upstream-pure-r-100-sha256 }}
      upstream-pure-r-101-id: ${{ steps.out.outputs.upstream-pure-r-101-id }}
      upstream-pure-r-101-sha256: ${{ steps.out.outputs.upstream-pure-r-101-sha256 }}
