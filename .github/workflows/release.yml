          RECORD_LINUX_UPSTREAM_PANDAS_SMALL: ${{ needs.judge-linux.outputs.upstream-pandas-small-sha256 }}
          RECORD_LINUX_UPSTREAM_PLOT_A: ${{ needs.judge-linux.outputs.upstream-plot-a-sha256 }}
          RECORD_LINUX_UPSTREAM_PLOT_B: ${{ needs.judge-linux.outputs.upstream-plot-b-sha256 }}
