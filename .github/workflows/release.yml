          enable-cache: false
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file.
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: Unpack the artifact set; the wheel into dist/
        run: |
          uv run python -c "import sys, tarfile, glob; tarfile.open(glob.glob('release-assets/*.tar.xz')[0]).extractall(sys.argv[1], filter='data')" "$RUNNER_TEMP/set"
          echo "WASI_PYTHON_ARTIFACTS=$(uv run python -c "import glob, sys; print(glob.glob(sys.argv[1] + '/wasi-python-*')[0])" "$RUNNER_TEMP/set")" >> "$GITHUB_ENV"
          mkdir -p dist
          cp release-assets/wasi_python-*.whl dist/
      - name: What the shard needs (the upstream kit and source trees, verified)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run python tests/upstream/fetch.py --shard "$SHARD"
      - name: The shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run pytest -p no:cacheprovider --shard="$SHARD" --progress-latest "$RUNNER_TEMP/record/latest.json"
      - name: The record's SHA-256
        id: sha
        run: |
          uv run python -c "import hashlib, sys; print('sha256=' + hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$RUNNER_TEMP/record/latest.json" >> "$GITHUB_OUTPUT"
      - id: record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/record/latest.json
          if-no-files-found: error
      - name: The record's id and SHA-256, under the shard's own names
        id: out
        env:
          SHARD: ${{ matrix.shard }}
          RECORD_ID: ${{ steps.record.outputs.artifact-id }}
          RECORD_SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          echo "$SHARD-id=$RECORD_ID" >> "$GITHUB_OUTPUT"
          echo "$SHARD-sha256=$RECORD_SHA256" >> "$GITHUB_OUTPUT"
      - name: Keep the shard's record when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-linux-${{ matrix.shard }}-failed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  judge-windows:
    name: judge (windows-2025, ${{ matrix.shard }})
    # One leg per shard of this system's plan (tests/release_shards.toml).
    # Each leg runs its shard serially against accepted.json, hashes its record and hands on the
    # record's id and SHA-256 under the shard's own names. The legs of one system share every
    # host-side input, so the shared output namespace gives nothing away; the systems are three jobs.
    needs: build
    strategy:
      fail-fast: false
      # One run stays within the plan's 40 jobs at once.
      max-parallel: 18
      matrix:
        shard: [own-embedding, own-embedding-a, own-hostile, own-guest, own-runner, upstream-windows]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      own-embedding-id: ${{ steps.out.outputs.own-embedding-id }}
      own-embedding-sha256: ${{ steps.out.outputs.own-embedding-sha256 }}
      own-embedding-a-id: ${{ steps.out.outputs.own-embedding-a-id }}
      own-embedding-a-sha256: ${{ steps.out.outputs.own-embedding-a-sha256 }}
      own-hostile-id: ${{ steps.out.outputs.own-hostile-id }}
      own-hostile-sha256: ${{ steps.out.outputs.own-hostile-sha256 }}
      own-guest-id: ${{ steps.out.outputs.own-guest-id }}
      own-guest-sha256: ${{ steps.out.outputs.own-guest-sha256 }}
      own-runner-id: ${{ steps.out.outputs.own-runner-id }}
      own-runner-sha256: ${{ steps.out.outputs.own-runner-sha256 }}
      upstream-windows-id: ${{ steps.out.outputs.upstream-windows-id }}
      upstream-windows-sha256: ${{ steps.out.outputs.upstream-windows-sha256 }}
    env:
      # The judge reads its repository's text as UTF-8 on every host, as Python 3.15 does by
      # default (PEP 686); Windows' locale codec is not UTF-8 (the branch dry run 39182550825).
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the rules in own-rest read the git history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file.
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: Unpack the artifact set; the wheel into dist/
        run: |
          uv run python -c "import sys, tarfile, glob; tarfile.open(glob.glob('release-assets/*.tar.xz')[0]).extractall(sys.argv[1], filter='data')" "$RUNNER_TEMP/set"
          echo "WASI_PYTHON_ARTIFACTS=$(uv run python -c "import glob, sys; print(glob.glob(sys.argv[1] + '/wasi-python-*')[0])" "$RUNNER_TEMP/set")" >> "$GITHUB_ENV"
          mkdir -p dist
          cp release-assets/wasi_python-*.whl dist/
      - name: What the shard needs (the upstream kit and source trees, verified)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run python tests/upstream/fetch.py --shard "$SHARD"
      - name: The shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run pytest -p no:cacheprovider --shard="$SHARD" --progress-latest "$RUNNER_TEMP/record/latest.json"
      - name: The record's SHA-256
        id: sha
        run: |
          uv run python -c "import hashlib, sys; print('sha256=' + hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$RUNNER_TEMP/record/latest.json" >> "$GITHUB_OUTPUT"
      - id: record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/record/latest.json
          if-no-files-found: error
      - name: The record's id and SHA-256, under the shard's own names
        id: out
        env:
          SHARD: ${{ matrix.shard }}
          RECORD_ID: ${{ steps.record.outputs.artifact-id }}
          RECORD_SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          echo "$SHARD-id=$RECORD_ID" >> "$GITHUB_OUTPUT"
          echo "$SHARD-sha256=$RECORD_SHA256" >> "$GITHUB_OUTPUT"
      - name: Keep the shard's record when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-windows-${{ matrix.shard }}-failed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  gather:
    name: gather the shards' records
    # One verdict from every shard's record, each downloaded by the id its job handed on and
    # checked against the SHA-256 it handed on; tied to this commit, its judge, the build's
    # python.wasm, the lane's acceptance and three systems. It never holds
    # the assets: python.wasm's hash comes from the build job. It writes no history. It waits for
    # same-bytes, so no release record exists without the proof that the set judged is the set the
    # pins make; the build shard's record comes from build-shard, on its own fresh build.
    # On a normal run judge-release is skipped; the gather runs beside it, and after any failed
    # or cancelled need it does not run at all.
    needs: [inputs, build, build-shard, same-bytes, judge-macos, judge-linux, judge-windows, judge-release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Every job handed on its record's id, and the build python.wasm's SHA-256
        # An empty artifact-ids makes download-artifact fetch every artifact of the run.
        # The set's own SHA256SUMS hash too.
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
          BUILD_RECORD_ID: ${{ needs.build-shard.outputs.record-id }}
          MACOS_OWN_EMBEDDING_ID: ${{ needs.judge-macos.outputs.own-embedding-id }}
          MACOS_OWN_EMBEDDING_A_ID: ${{ needs.judge-macos.outputs.own-embedding-a-id }}
          MACOS_OWN_HOSTILE_ID: ${{ needs.judge-macos.outputs.own-hostile-id }}
          MACOS_OWN_GUEST_ID: ${{ needs.judge-macos.outputs.own-guest-id }}
          MACOS_OWN_RUNNER_ID: ${{ needs.judge-macos.outputs.own-runner-id }}
          MACOS_OWN_REST_ID: ${{ needs.judge-macos.outputs.own-rest-id }}
          MACOS_UPSTREAM_MACOS_ID: ${{ needs.judge-macos.outputs.upstream-macos-id }}
          LINUX_OWN_EMBEDDING_ID: ${{ needs.judge-linux.outputs.own-embedding-id }}
          LINUX_OWN_EMBEDDING_A_ID: ${{ needs.judge-linux.outputs.own-embedding-a-id }}
          LINUX_OWN_HOSTILE_ID: ${{ needs.judge-linux.outputs.own-hostile-id }}
          LINUX_OWN_GUEST_ID: ${{ needs.judge-linux.outputs.own-guest-id }}
          LINUX_OWN_RUNNER_ID: ${{ needs.judge-linux.outputs.own-runner-id }}
          LINUX_OWN_REST_ID: ${{ needs.judge-linux.outputs.own-rest-id }}
          LINUX_UPSTREAM_GROUPBY_ID: ${{ needs.judge-linux.outputs.upstream-groupby-id }}
          LINUX_UPSTREAM_FRAME_ID: ${{ needs.judge-linux.outputs.upstream-frame-id }}
          LINUX_UPSTREAM_NUMPY_A_ID: ${{ needs.judge-linux.outputs.upstream-numpy-a-id }}
          LINUX_UPSTREAM_NUMPY_B_ID: ${{ needs.judge-linux.outputs.upstream-numpy-b-id }}
          LINUX_UPSTREAM_PANDAS_SMALL_ID: ${{ needs.judge-linux.outputs.upstream-pandas-small-id }}
          LINUX_UPSTREAM_PLOT_A_ID: ${{ needs.judge-linux.outputs.upstream-plot-a-id }}
          LINUX_UPSTREAM_PLOT_B_ID: ${{ needs.judge-linux.outputs.upstream-plot-b-id }}
          LINUX_UPSTREAM_PLOT_C_ID: ${{ needs.judge-linux.outputs.upstream-plot-c-id }}
          LINUX_UPSTREAM_PLOT_D_ID: ${{ needs.judge-linux.outputs.upstream-plot-d-id }}
          LINUX_UPSTREAM_PLOT_E_ID: ${{ needs.judge-linux.outputs.upstream-plot-e-id }}
          LINUX_UPSTREAM_PLOT_F_ID: ${{ needs.judge-linux.outputs.upstream-plot-f-id }}
          LINUX_UPSTREAM_PLOT_G_ID: ${{ needs.judge-linux.outputs.upstream-plot-g-id }}
          LINUX_UPSTREAM_PLOT_H_ID: ${{ needs.judge-linux.outputs.upstream-plot-h-id }}
          LINUX_UPSTREAM_PLOT_I_ID: ${{ needs.judge-linux.outputs.upstream-plot-i-id }}
          WINDOWS_OWN_EMBEDDING_ID: ${{ needs.judge-windows.outputs.own-embedding-id }}
          WINDOWS_OWN_EMBEDDING_A_ID: ${{ needs.judge-windows.outputs.own-embedding-a-id }}
          WINDOWS_OWN_HOSTILE_ID: ${{ needs.judge-windows.outputs.own-hostile-id }}
          WINDOWS_OWN_GUEST_ID: ${{ needs.judge-windows.outputs.own-guest-id }}
          WINDOWS_OWN_RUNNER_ID: ${{ needs.judge-windows.outputs.own-runner-id }}
          WINDOWS_UPSTREAM_WINDOWS_ID: ${{ needs.judge-windows.outputs.upstream-windows-id }}
        run: |
          case "$WASM_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of python.wasm"; exit 1 ;;
          esac
          if [ "${#WASM_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of python.wasm"
            exit 1
          fi
          case "$SET_SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of the set's SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SET_SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of the set's SHA256SUMS"
            exit 1
          fi
          for id in "$BUILD_RECORD_ID" "$MACOS_OWN_EMBEDDING_ID" "$MACOS_OWN_EMBEDDING_A_ID" "$MACOS_OWN_HOSTILE_ID" "$MACOS_OWN_GUEST_ID" "$MACOS_OWN_RUNNER_ID" "$MACOS_OWN_REST_ID" "$MACOS_UPSTREAM_MACOS_ID" "$LINUX_OWN_EMBEDDING_ID" "$LINUX_OWN_EMBEDDING_A_ID" "$LINUX_OWN_HOSTILE_ID" "$LINUX_OWN_GUEST_ID" "$LINUX_OWN_RUNNER_ID" "$LINUX_OWN_REST_ID" "$LINUX_UPSTREAM_GROUPBY_ID" "$LINUX_UPSTREAM_FRAME_ID" "$LINUX_UPSTREAM_NUMPY_A_ID" "$LINUX_UPSTREAM_NUMPY_B_ID" "$LINUX_UPSTREAM_PANDAS_SMALL_ID" "$LINUX_UPSTREAM_PLOT_A_ID" "$LINUX_UPSTREAM_PLOT_B_ID" "$LINUX_UPSTREAM_PLOT_C_ID" "$LINUX_UPSTREAM_PLOT_D_ID" "$LINUX_UPSTREAM_PLOT_E_ID" "$LINUX_UPSTREAM_PLOT_F_ID" "$LINUX_UPSTREAM_PLOT_G_ID" "$LINUX_UPSTREAM_PLOT_H_ID" "$LINUX_UPSTREAM_PLOT_I_ID" "$WINDOWS_OWN_EMBEDDING_ID" "$WINDOWS_OWN_EMBEDDING_A_ID" "$WINDOWS_OWN_HOSTILE_ID" "$WINDOWS_OWN_GUEST_ID" "$WINDOWS_OWN_RUNNER_ID" "$WINDOWS_UPSTREAM_WINDOWS_ID"; do
            case "$id" in
              "" | *[!0-9]*) echo "a job handed on no record id"; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-shard.outputs.record-id }}
          path: records/build-shard
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.judge-macos.outputs.own-embedding-id }},${{ needs.judge-macos.outputs.own-embedding-a-id }},${{ needs.judge-macos.outputs.own-hostile-id }},${{ needs.judge-macos.outputs.own-guest-id }},${{ needs.judge-macos.outputs.own-runner-id }},${{ needs.judge-macos.outputs.own-rest-id }},${{ needs.judge-macos.outputs.upstream-macos-id }}
          path: records/judge-macos
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.judge-linux.outputs.own-embedding-id }},${{ needs.judge-linux.outputs.own-embedding-a-id }},${{ needs.judge-linux.outputs.own-hostile-id }},${{ needs.judge-linux.outputs.own-guest-id }},${{ needs.judge-linux.outputs.own-runner-id }},${{ needs.judge-linux.outputs.own-rest-id }},${{ needs.judge-linux.outputs.upstream-groupby-id }},${{ needs.judge-linux.outputs.upstream-frame-id }},${{ needs.judge-linux.outputs.upstream-numpy-a-id }},${{ needs.judge-linux.outputs.upstream-numpy-b-id }},${{ needs.judge-linux.outputs.upstream-pandas-small-id }},${{ needs.judge-linux.outputs.upstream-plot-a-id }},${{ needs.judge-linux.outputs.upstream-plot-b-id }},${{ needs.judge-linux.outputs.upstream-plot-c-id }},${{ needs.judge-linux.outputs.upstream-plot-d-id }},${{ needs.judge-linux.outputs.upstream-plot-e-id }},${{ needs.judge-linux.outputs.upstream-plot-f-id }},${{ needs.judge-linux.outputs.upstream-plot-g-id }},${{ needs.judge-linux.outputs.upstream-plot-h-id }},${{ needs.judge-linux.outputs.upstream-plot-i-id }}
          path: records/judge-linux
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.judge-windows.outputs.own-embedding-id }},${{ needs.judge-windows.outputs.own-embedding-a-id }},${{ needs.judge-windows.outputs.own-hostile-id }},${{ needs.judge-windows.outputs.own-guest-id }},${{ needs.judge-windows.outputs.own-runner-id }},${{ needs.judge-windows.outputs.upstream-windows-id }}
          path: records/judge-windows
          digest-mismatch: error
      - name: The release shards handed on their records' ids
        if: needs.inputs.outputs.tier == 'release'
        env:
          RELEASE_UPSTREAM_RELEASE_A_ID: ${{ needs.judge-release.outputs.upstream-release-a-id }}
          RELEASE_UPSTREAM_RELEASE_B_ID: ${{ needs.judge-release.outputs.upstream-release-b-id }}
          RELEASE_UPSTREAM_RELEASE_C_ID: ${{ needs.judge-release.outputs.upstream-release-c-id }}
          RELEASE_UPSTREAM_RELEASE_D_ID: ${{ needs.judge-release.outputs.upstream-release-d-id }}
          RELEASE_UPSTREAM_RELEASE_E_ID: ${{ needs.judge-release.outputs.upstream-release-e-id }}
          RELEASE_UPSTREAM_RELEASE_F_ID: ${{ needs.judge-release.outputs.upstream-release-f-id }}
          RELEASE_UPSTREAM_RELEASE_G_ID: ${{ needs.judge-release.outputs.upstream-release-g-id }}
          RELEASE_UPSTREAM_RELEASE_H_ID: ${{ needs.judge-release.outputs.upstream-release-h-id }}
          RELEASE_UPSTREAM_RELEASE_I_ID: ${{ needs.judge-release.outputs.upstream-release-i-id }}
          RELEASE_UPSTREAM_RELEASE_J_ID: ${{ needs.judge-release.outputs.upstream-release-j-id }}
          RELEASE_UPSTREAM_RELEASE_K_ID: ${{ needs.judge-release.outputs.upstream-release-k-id }}
          RELEASE_UPSTREAM_RELEASE_L_ID: ${{ needs.judge-release.outputs.upstream-release-l-id }}
        run: |
          for id in "$RELEASE_UPSTREAM_RELEASE_A_ID" "$RELEASE_UPSTREAM_RELEASE_B_ID" "$RELEASE_UPSTREAM_RELEASE_C_ID" "$RELEASE_UPSTREAM_RELEASE_D_ID" "$RELEASE_UPSTREAM_RELEASE_E_ID" "$RELEASE_UPSTREAM_RELEASE_F_ID" "$RELEASE_UPSTREAM_RELEASE_G_ID" "$RELEASE_UPSTREAM_RELEASE_H_ID" "$RELEASE_UPSTREAM_RELEASE_I_ID" "$RELEASE_UPSTREAM_RELEASE_J_ID" "$RELEASE_UPSTREAM_RELEASE_K_ID" "$RELEASE_UPSTREAM_RELEASE_L_ID"; do
            case "$id" in
              "" | *[!0-9]*) echo "a job handed on no record id"; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.inputs.outputs.tier == 'release'
        with:
          artifact-ids: ${{ needs.judge-release.outputs.upstream-release-a-id }},${{ needs.judge-release.outputs.upstream-release-b-id }},${{ needs.judge-release.outputs.upstream-release-c-id }},${{ needs.judge-release.outputs.upstream-release-d-id }},${{ needs.judge-release.outputs.upstream-release-e-id }},${{ needs.judge-release.outputs.upstream-release-f-id }},${{ needs.judge-release.outputs.upstream-release-g-id }},${{ needs.judge-release.outputs.upstream-release-h-id }},${{ needs.judge-release.outputs.upstream-release-i-id }},${{ needs.judge-release.outputs.upstream-release-j-id }},${{ needs.judge-release.outputs.upstream-release-k-id }},${{ needs.judge-release.outputs.upstream-release-l-id }}
          path: records/judge-release
          digest-mismatch: error
      - name: The gather
        # It reads GITHUB_EVENT_NAME and GITHUB_REF_TYPE as the runner sets them: on a pushed tag the
        # judge must also be the accepted one, and the set built in this run (G7).
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
          SET_SOURCE: ${{ needs.build.outputs.set-source }}
          RECORD_BUILD_BUILD: ${{ needs.build-shard.outputs.record-sha256 }}
          RECORD_MACOS_OWN_EMBEDDING: ${{ needs.judge-macos.outputs.own-embedding-sha256 }}
          RECORD_MACOS_OWN_EMBEDDING_A: ${{ needs.judge-macos.outputs.own-embedding-a-sha256 }}
          RECORD_MACOS_OWN_HOSTILE: ${{ needs.judge-macos.outputs.own-hostile-sha256 }}
          RECORD_MACOS_OWN_GUEST: ${{ needs.judge-macos.outputs.own-guest-sha256 }}
          RECORD_MACOS_OWN_RUNNER: ${{ needs.judge-macos.outputs.own-runner-sha256 }}
          RECORD_MACOS_OWN_REST: ${{ needs.judge-macos.outputs.own-rest-sha256 }}
          RECORD_MACOS_UPSTREAM_MACOS: ${{ needs.judge-macos.outputs.upstream-macos-sha256 }}
          RECORD_LINUX_OWN_EMBEDDING: ${{ needs.judge-linux.outputs.own-embedding-sha256 }}
          RECORD_LINUX_OWN_EMBEDDING_A: ${{ needs.judge-linux.outputs.own-embedding-a-sha256 }}
