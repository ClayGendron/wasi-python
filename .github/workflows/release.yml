      own-embedding-sha256: ${{ steps.out.outputs.own-embedding-sha256 }}
      own-guest-id: ${{ steps.out.outputs.own-guest-id }}
      own-guest-sha256: ${{ steps.out.outputs.own-guest-sha256 }}
      own-runner-id: ${{ steps.out.outputs.own-runner-id }}
      own-runner-sha256: ${{ steps.out.outputs.own-runner-sha256 }}
      own-rest-id: ${{ steps.out.outputs.own-rest-id }}
      own-rest-sha256: ${{ steps.out.outputs.own-rest-sha256 }}
      upstream-groupby-id: ${{ steps.out.outputs.upstream-groupby-id }}
      upstream-groupby-sha256: ${{ steps.out.outputs.upstream-groupby-sha256 }}
      upstream-frame-id: ${{ steps.out.outputs.upstream-frame-id }}
      upstream-frame-sha256: ${{ steps.out.outputs.upstream-frame-sha256 }}
      upstream-numpy-a-id: ${{ steps.out.outputs.upstream-numpy-a-id }}
      upstream-numpy-a-sha256: ${{ steps.out.outputs.upstream-numpy-a-sha256 }}
      upstream-numpy-b-id: ${{ steps.out.outputs.upstream-numpy-b-id }}
      upstream-numpy-b-sha256: ${{ steps.out.outputs.upstream-numpy-b-sha256 }}
