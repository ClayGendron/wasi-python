          RECORD_LINUX_UPSTREAM_PLOT_E: ${{ needs.judge-linux.outputs.upstream-plot-e-sha256 }}
          RECORD_LINUX_UPSTREAM_PLOT_F: ${{ needs.judge-linux.outputs.upstream-plot-f-sha256 }}
