  coverage:
    name: the runner's coverage (ubuntu-24.04)
    # The fast tier, serially under coverage.py, against the set the build job made: the share of
    # src/wasi_python's statements it ran. The Cobertura report goes to Codecov, which serves the
    # README's badge; the upload carries the repository's CODECOV_TOKEN secret and nothing else.
    # Only with the merge-grade set (a merge into dev, ci:full, the release shape). A failed
    # measurement is red; a failed upload (Codecov's outage) is logged by the action and not
    # failed, so it never turns a run red or holds up a release.
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the rules read the git history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: Unpack the artifact set; the wheel into dist/
        run: |
          uv run python -c "import sys, tarfile, glob; tarfile.open(glob.glob('release-assets/*.tar.xz')[0]).extractall(sys.argv[1], filter='data')" "$RUNNER_TEMP/set"
          echo "WASI_PYTHON_ARTIFACTS=$(uv run python -c "import glob, sys; print(glob.glob(sys.argv[1] + '/wasi-python-*')[0])" "$RUNNER_TEMP/set")" >> "$GITHUB_ENV"
          mkdir -p dist
          cp release-assets/wasi_python-*.whl dist/
      - name: The fast tier under coverage.py
        run: uv run python tests/harness/coverage.py --measure
      - name: The reports and the run's log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_attempt }}
          path: |
            build/coverage/pytest.log
            build/coverage/coverage.json
            build/coverage/coverage.xml
          if-no-files-found: ignore
      - name: The report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.1 # the uploader the action fetches, named rather than its latest
          fail_ci_if_error: false

  gather:
    name: gather the shards' records
    # One verdict from every record the plan selected, each found by its leg's artifact name (the
    # build shard's by the id build-shard handed on); tied to this commit, its judge, the build's
    # python.wasm, the newest acceptance and the systems that ran. It never holds the assets:
    # python.wasm's hash comes from the build job. It writes no history. On the release shape it
    # waits for same-bytes, so no release record exists without the proof that the set judged is
    # the set the pins make. A judge job the plan skipped is skipped here too; after any failed or
    # cancelled need the gather does not run at all. On a pull request it reads the plan's selected
    # pairs (PLAN) and is narrowed to them; on every other event it is whole.
    needs: [plan, build, build-shard, same-bytes, judge-macos, judge-linux, judge-windows, judge-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.judge == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build job handed on python.wasm's SHA-256 and its set's
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
        run: |
          case "$WASM_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of python.wasm"; exit 1 ;;
          esac
          if [ "${#WASM_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of python.wasm"
            exit 1
          fi
          case "$SET_SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of the set's SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SET_SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of the set's SHA256SUMS"
            exit 1
          fi
      - name: The build shard handed on its record's id
        if: needs.plan.outputs.build == 'true'
        env:
          BUILD_RECORD_ID: ${{ needs.build-shard.outputs.record-id }}
        run: |
          case "$BUILD_RECORD_ID" in
            "" | *[!0-9]*) echo "build-shard handed on no record id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.build == 'true'
        with:
          artifact-ids: ${{ needs.build-shard.outputs.record-id }}
          path: records/build-shard
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.macos != '[]'
        with:
          pattern: record-macos-*
          path: records/judge-macos
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.linux != '[]'
        with:
          pattern: record-linux-*
          path: records/judge-linux
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.windows != '[]'
        with:
          pattern: record-windows-*
          path: records/judge-windows
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.release != '[]'
        with:
          pattern: record-release-*
          path: records/judge-release
          digest-mismatch: error
      - name: The gather
        # It reads GITHUB_EVENT_NAME, GITHUB_REF_TYPE, GITHUB_REF and GITHUB_BASE_REF as the runner
        # sets them: on a pushed tag the judge must also be the accepted one, and the set built in
        # this run (G7). PLAN only on a pull request, which is judged on what its plan selected.
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
          SET_SOURCE: ${{ needs.build.outputs.set-source }}
          RECORD_BUILD_BUILD: ${{ needs.build-shard.outputs.record-sha256 }}
          TIER: ${{ needs.plan.outputs.tier }}
          PLAN: ${{ github.event_name == 'pull_request' && needs.plan.outputs.selected || '' }}
        run: |
          uv run python tests/harness/gather.py --records records --out release-record
      - name: Keep the release's record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record-${{ github.run_attempt }}
          path: release-record/
          if-no-files-found: ignore
      # The accept jobs follow the gather on a push to dev: one writes the acceptance from the
      # gather's record with no secret, the other pushes it. They arrive with the news files.

  verify:
    name: verify (${{ matrix.os }})
    # The wheel installed fresh, as a user installs it: on Linux on a pull request, on the three
    # systems with the merge-grade set and the release shape.
    needs: [plan, build]
    if: needs.plan.outputs.verify != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.verify) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: The wheel, installed fresh, runs a program in one call
        # Installed by its plain name, no extra: `pip install wasi-python` must run programs, so
        # a wheel whose plain install could not never publishes.
        run: |
          wheel="$(ls release-assets/wasi_python-*.whl)"
          uv run --isolated --no-project --with "wasi-python @ ./$wheel" python -c "
          import tempfile, wasi_python
          done = wasi_python.run(['-c', 'import pandas; print(pandas.Series([1, 2, 3]).sum())'], root=tempfile.mkdtemp())
          print(done)
          assert (done.exit_code, done.stdout) == (0, b'6\n'), done
          "
          # The wheel's own command prints the one line its README promises.
          line=$(uv run --isolated --no-project --with "wasi-python @ ./$wheel" \
            wasi-python run -- -c "print(1)")
          echo "$line"
          want='{"exit_code": 0, "fuel_used": null, "stderr": "", "stdout": "1\n", "trapped": null, "truncated": []}'
          if [ "$line" != "$want" ]; then
            echo "the installed command printed another line"
            exit 1
          fi
          # The empty `run` extra, kept for 0.1.0a3's instructions. `uv run --with` installs an
          # unknown extra silently, so an import would prove nothing: assert the metadata.
          uv run --isolated --no-project --with "wasi-python[run] @ ./$wheel" python -c "
          import importlib.metadata, re
          meta = importlib.metadata.metadata('wasi-python')
          extras = meta.get_all('Provides-Extra') or []
          reqs = meta.get_all('Requires-Dist') or []
          print('Provides-Extra:', extras, 'Requires-Dist:', reqs)
          assert extras == ['run'], extras
          assert not [r for r in reqs if re.search(r'extra\s*==', r)], reqs
          "
        env:
          WASI_PYTHON_ARTIFACTS: ""

  attest:
    name: attest the release assets
    # Build provenance for every asset, signed through Sigstore's public-good instance and then
    # verified strictly, before anything is published, and only once arm64 Linux and
    # x86_64 Linux rebuilt the same bytes (same-bytes). Only a pushed tag gets here: a signature is
    # permanent in the public transparency log, so dry runs never sign. It checks out this
    # repository for the local action alone.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes, gather]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Verify each asset as a user will
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

  publish:
    name: publish the GitHub release
    # Only a pushed tag publishes; a manual run, even started on a tag, never does.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes, attest, gather]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --no-project python release/version.py notes "$version" --repository "$GITHUB_REPOSITORY" > notes.md
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "wasi-python $version" --notes-file notes.md --verify-tag $prerelease

  pypi:
    name: publish the wheel on PyPI
    # Off until the owner registers this workflow as a trusted publisher on PyPI and sets the
    # repository variable PYPI_PUBLISH to true. It checks out this repository for the local
    # action alone.
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: Only the wheel goes to PyPI
        run: mkdir dist && mv release-assets/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  ci-status:
    name: ci-status
    # The one required check. It runs whatever happened before it, so it is always reported, and
    # passes when every other job succeeded or was skipped by the plan, and the decision job
    # refused nothing (a pull request may not write accepted state). A failed or cancelled job is
    # red here.
    needs: [plan, quick, inputs, build, build-shard, rebuild-linux-x86-64, same-bytes, save-set, judge-macos, judge-linux, judge-windows, judge-release, coverage, gather, verify, attest, publish, pypi]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped, and the plan refused nothing
        env:
          NEEDS: ${{ toJSON(needs) }}
          REFUSALS: ${{ needs.plan.outputs.refusals }}
        run: |
          set -o pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "a job this check needs neither succeeded nor was skipped:" $bad
            exit 1
          fi
          if [ "$REFUSALS" != "[]" ]; then
            echo "the plan refused this run: $REFUSALS"
            exit 1
          fi
