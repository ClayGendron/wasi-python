  gather:
    name: gather the shards' records
    # One verdict from every shard's record, each downloaded by the id its job handed on and
    # checked against the SHA-256 it handed on; tied to this commit, its judge, the build's
    # python.wasm, the lane's acceptance and three systems (spec 063, Decision 9). It never holds
    # the assets: python.wasm's hash comes from the build job. It writes no history.
    needs: [build, judge-macos, judge-linux, judge-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Every job handed on its record's id, and the build python.wasm's SHA-256
        # An empty artifact-ids makes download-artifact fetch every artifact of the run (spec 057).
        # The set's own SHA256SUMS hash too (spec 085).
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
          BUILD_RECORD_ID: ${{ needs.build.outputs.record-id }}
          MACOS_OWN_EMBEDDING_ID: ${{ needs.judge-macos.outputs.own-embedding-id }}
          MACOS_OWN_GUEST_ID: ${{ needs.judge-macos.outputs.own-guest-id }}
          MACOS_OWN_RUNNER_ID: ${{ needs.judge-macos.outputs.own-runner-id }}
          MACOS_OWN_REST_ID: ${{ needs.judge-macos.outputs.own-rest-id }}
          MACOS_UPSTREAM_MACOS_ID: ${{ needs.judge-macos.outputs.upstream-macos-id }}
          LINUX_OWN_EMBEDDING_ID: ${{ needs.judge-linux.outputs.own-embedding-id }}
          LINUX_OWN_GUEST_ID: ${{ needs.judge-linux.outputs.own-guest-id }}
          LINUX_OWN_RUNNER_ID: ${{ needs.judge-linux.outputs.own-runner-id }}
          LINUX_OWN_REST_ID: ${{ needs.judge-linux.outputs.own-rest-id }}
          LINUX_UPSTREAM_GROUPBY_ID: ${{ needs.judge-linux.outputs.upstream-groupby-id }}
          LINUX_UPSTREAM_FRAME_ID: ${{ needs.judge-linux.outputs.upstream-frame-id }}
          LINUX_UPSTREAM_NUMPY_A_ID: ${{ needs.judge-linux.outputs.upstream-numpy-a-id }}
          LINUX_UPSTREAM_NUMPY_B_ID: ${{ needs.judge-linux.outputs.upstream-numpy-b-id }}
          LINUX_UPSTREAM_PANDAS_SMALL_ID: ${{ needs.judge-linux.outputs.upstream-pandas-small-id }}
          WINDOWS_OWN_EMBEDDING_ID: ${{ needs.judge-windows.outputs.own-embedding-id }}
          WINDOWS_OWN_GUEST_ID: ${{ needs.judge-windows.outputs.own-guest-id }}
          WINDOWS_OWN_RUNNER_ID: ${{ needs.judge-windows.outputs.own-runner-id }}
          WINDOWS_UPSTREAM_WINDOWS_ID: ${{ needs.judge-windows.outputs.upstream-windows-id }}
        run: |
          case "$WASM_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of python.wasm"; exit 1 ;;
          esac
          if [ "${#WASM_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of python.wasm"
            exit 1
          fi
          case "$SET_SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of the set's SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SET_SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of the set's SHA256SUMS"
            exit 1
          fi
          for id in "$BUILD_RECORD_ID" "$MACOS_OWN_EMBEDDING_ID" "$MACOS_OWN_GUEST_ID" "$MACOS_OWN_RUNNER_ID" "$MACOS_OWN_REST_ID" "$MACOS_UPSTREAM_MACOS_ID" "$LINUX_OWN_EMBEDDING_ID" "$LINUX_OWN_GUEST_ID" "$LINUX_OWN_RUNNER_ID" "$LINUX_OWN_REST_ID" "$LINUX_UPSTREAM_GROUPBY_ID" "$LINUX_UPSTREAM_FRAME_ID" "$LINUX_UPSTREAM_NUMPY_A_ID" "$LINUX_UPSTREAM_NUMPY_B_ID" "$LINUX_UPSTREAM_PANDAS_SMALL_ID" "$WINDOWS_OWN_EMBEDDING_ID" "$WINDOWS_OWN_GUEST_ID" "$WINDOWS_OWN_RUNNER_ID" "$WINDOWS_UPSTREAM_WINDOWS_ID"; do
            case "$id" in
              "" | *[!0-9]*) echo "a job handed on no record id"; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.record-id }}
          path: records/build
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.judge-macos.outputs.own-embedding-id }},${{ needs.judge-macos.outputs.own-guest-id }},${{ needs.judge-macos.outputs.own-runner-id }},${{ needs.judge-macos.outputs.own-rest-id }},${{ needs.judge-macos.outputs.upstream-macos-id }}
          path: records/judge-macos
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.judge-linux.outputs.own-embedding-id }},${{ needs.judge-linux.outputs.own-guest-id }},${{ needs.judge-linux.outputs.own-runner-id }},${{ needs.judge-linux.outputs.own-rest-id }},${{ needs.judge-linux.outputs.upstream-groupby-id }},${{ needs.judge-linux.outputs.upstream-frame-id }},${{ needs.judge-linux.outputs.upstream-numpy-a-id }},${{ needs.judge-linux.outputs.upstream-numpy-b-id }},${{ needs.judge-linux.outputs.upstream-pandas-small-id }}
          path: records/judge-linux
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.judge-windows.outputs.own-embedding-id }},${{ needs.judge-windows.outputs.own-guest-id }},${{ needs.judge-windows.outputs.own-runner-id }},${{ needs.judge-windows.outputs.upstream-windows-id }}
          path: records/judge-windows
          digest-mismatch: error
      - name: The gather
        # It reads GITHUB_EVENT_NAME and GITHUB_REF_TYPE as the runner sets them: on a pushed tag the
        # judge must also be the accepted one (G7).
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
          RECORD_BUILD_BUILD: ${{ needs.build.outputs.record-sha256 }}
          RECORD_MACOS_OWN_EMBEDDING: ${{ needs.judge-macos.outputs.own-embedding-sha256 }}
          RECORD_MACOS_OWN_GUEST: ${{ needs.judge-macos.outputs.own-guest-sha256 }}
          RECORD_MACOS_OWN_RUNNER: ${{ needs.judge-macos.outputs.own-runner-sha256 }}
          RECORD_MACOS_OWN_REST: ${{ needs.judge-macos.outputs.own-rest-sha256 }}
          RECORD_MACOS_UPSTREAM_MACOS: ${{ needs.judge-macos.outputs.upstream-macos-sha256 }}
          RECORD_LINUX_OWN_EMBEDDING: ${{ needs.judge-linux.outputs.own-embedding-sha256 }}
          RECORD_LINUX_OWN_GUEST: ${{ needs.judge-linux.outputs.own-guest-sha256 }}
          RECORD_LINUX_OWN_RUNNER: ${{ needs.judge-linux.outputs.own-runner-sha256 }}
          RECORD_LINUX_OWN_REST: ${{ needs.judge-linux.outputs.own-rest-sha256 }}
          RECORD_LINUX_UPSTREAM_GROUPBY: ${{ needs.judge-linux.outputs.upstream-groupby-sha256 }}
          RECORD_LINUX_UPSTREAM_FRAME: ${{ needs.judge-linux.outputs.upstream-frame-sha256 }}
          RECORD_LINUX_UPSTREAM_NUMPY_A: ${{ needs.judge-linux.outputs.upstream-numpy-a-sha256 }}
          RECORD_LINUX_UPSTREAM_NUMPY_B: ${{ needs.judge-linux.outputs.upstream-numpy-b-sha256 }}
          RECORD_LINUX_UPSTREAM_PANDAS_SMALL: ${{ needs.judge-linux.outputs.upstream-pandas-small-sha256 }}
          RECORD_WINDOWS_OWN_EMBEDDING: ${{ needs.judge-windows.outputs.own-embedding-sha256 }}
          RECORD_WINDOWS_OWN_GUEST: ${{ needs.judge-windows.outputs.own-guest-sha256 }}
          RECORD_WINDOWS_OWN_RUNNER: ${{ needs.judge-windows.outputs.own-runner-sha256 }}
          RECORD_WINDOWS_UPSTREAM_WINDOWS: ${{ needs.judge-windows.outputs.upstream-windows-sha256 }}
        run: |
          uv run python tests/harness/gather.py --records records --out release-record
      - name: Keep the release's record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record-${{ github.run_attempt }}
          path: release-record/
          if-no-files-found: ignore

  verify:
    name: verify (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
