  gather:
    name: gather the shards' records
    # One verdict from every record the plan selected, each found by its leg's artifact name (the
    # build shard's by the id the x86_64 rebuild handed on, where the run rebuilds); tied to this
    # commit, its judge, the build's python.wasm, the newest acceptance and the systems that ran.
    # It never holds the assets: python.wasm's hash comes from the build job. It writes no history.
    # It does not wait for same-bytes, which gates what is cached, signed and published, and the
    # release pull request's ci-status and acceptance, not the reading of records already complete.
    # A judge job or the rebuild the plan skipped is skipped here too; after any failed or
    # cancelled need the gather does not run at all. On a pull request into dev it reads the plan's
    # selected pairs (PLAN) and is narrowed to them; on every other event, the release pull request
    # into main among them, it is whole but for the build shard where the run did not rebuild
    # (BUILD).
    needs: [plan, build, rebuild-linux-x86-64, judge-macos, judge-linux, judge-windows, judge-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.judge == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      # The merged record's id, which accept-record downloads by.
      record-id: ${{ steps.keep.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build job handed on python.wasm's SHA-256 and its set's
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
        run: |
          case "$WASM_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of python.wasm"; exit 1 ;;
          esac
          if [ "${#WASM_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of python.wasm"
            exit 1
          fi
          case "$SET_SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of the set's SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SET_SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of the set's SHA256SUMS"
            exit 1
          fi
      - name: The build shard handed on its record's id
        if: needs.plan.outputs.build == 'true'
        env:
          BUILD_RECORD_ID: ${{ needs.rebuild-linux-x86-64.outputs.record-id }}
        run: |
          case "$BUILD_RECORD_ID" in
            "" | *[!0-9]*) echo "the x86_64 rebuild handed on no record id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.build == 'true'
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.record-id }}
          path: records/rebuild-linux-x86-64
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.macos != '[]'
        with:
          pattern: record-macos-*
          path: records/judge-macos
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.linux != '[]'
        with:
          pattern: record-linux-*
          path: records/judge-linux
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.windows != '[]'
        with:
          pattern: record-windows-*
          path: records/judge-windows
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.release != '[]'
        with:
          pattern: record-release-*
          path: records/judge-release
          digest-mismatch: error
      - name: The gather
        # It reads GITHUB_EVENT_NAME, GITHUB_REF_TYPE, GITHUB_REF and GITHUB_BASE_REF as the runner
        # sets them (G7's form; a pushed tag's run has no gather, its judged job holds the tag to
        # the accepted bytes instead). PLAN only on a pull request into dev, which is judged on
        # what its plan selected; the release pull request into main is judged whole. BUILD says
        # whether the build shard ran, which only a run that rebuilds does.
        env:
          WASM_SHA256: ${{ needs.build.outputs.wasm-sha256 }}
          SET_SUMS_SHA256: ${{ needs.build.outputs.set-sums-sha256 }}
          SET_SOURCE: ${{ needs.build.outputs.set-source }}
          RECORD_BUILD_BUILD: ${{ needs.rebuild-linux-x86-64.outputs.record-sha256 }}
          BUILD: ${{ needs.plan.outputs.build }}
          TIER: ${{ needs.plan.outputs.tier }}
          PLAN: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && needs.plan.outputs.selected || '' }}
        run: |
          uv run python tests/harness/gather.py --records records --out release-record
      - name: Keep the release's record
        id: keep
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record-${{ github.run_attempt }}
          path: release-record/
          if-no-files-found: ignore

  accept-record:
    name: accept the merge's record
    # After a merge into dev, once every job the run judges with is green: the gather's merged
    # record is accepted, in a fresh checkout of the commit judged, with every reason from the news
    # files merged since the last acceptance. It runs the judge's code, so it holds no secret and
    # names no environment; it hands the two progress files and the commit's message on as one
    # artifact, which accept-push commits. After the release pull request it accepts that run's
    # record of both tiers the same way, its reasons the news files' and the release ledger's,
    # and accept-release.yml, which the run's completion starts on dev's own context, commits it.
    # A red or a cancelled run never gets here, so the accepted state never records a red one.
    needs: [plan, quick, inputs, build, rebuild-linux-x86-64, rebuild-macos-arm64, same-bytes, save-set, judge-macos, judge-linux, judge-windows, judge-release, gather, verify]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.accept == 'true' && needs.gather.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      acceptance-id: ${{ steps.acceptance.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the news files changed since the last acceptance
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The gather handed on its record's id
        env:
          RECORD_ID: ${{ needs.gather.outputs.record-id }}
        run: |
          case "$RECORD_ID" in
            "" | *[!0-9]*) echo "the gather handed on no record id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.gather.outputs.record-id }}
          path: build/ci
          digest-mismatch: error
      - name: The acceptance, from the record and the news files
        run: uv run pytest -p no:cacheprovider --accept-from=build/ci/record.json --claims=context/changes/
      - name: Hand the acceptance on
        id: acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ github.run_attempt }}
          path: |
            context/progress/accepted.json
            context/progress/history*.jsonl
            build/progress/acceptance-message.txt
          if-no-files-found: error

  accept-push:
    name: push the acceptance onto dev
    # The one job in the accept environment, whose deployment branch policy is dev alone, so no
    # pull request's run reaches its secret: the deploy key, dev's one bypass actor. It runs no
    # code of the repository, only git: it puts the two progress files into a checkout of the
    # commit judged, holds the change to them alone, and commits them alone with the message
    # accept-record wrote; the push's own run is the plan alone, which is quiet on a push of the
    # accepted state, so nothing judges it. It pushes only while
    # dev is the commit judged; when a newer merge landed it pushes nothing and succeeds, and that
    # merge's run accepts everything since the last acceptance.
    needs: [plan, accept-record]
    if: ${{ !cancelled() && needs.plan.outputs.accept == 'true' && github.event_name == 'push' && needs.accept-record.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: accept
    permissions:
      contents: read
    steps:
      - name: accept-record handed on the acceptance's id
        env:
          ACCEPTANCE_ID: ${{ needs.accept-record.outputs.acceptance-id }}
        run: |
          case "$ACCEPTANCE_ID" in
            "" | *[!0-9]*) echo "accept-record handed on no acceptance id"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          ssh-key: ${{ secrets.ACCEPT_DEPLOY_KEY }}
          persist-credentials: true # the push below is made with the key
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.accept-record.outputs.acceptance-id }}
          path: ${{ runner.temp }}/acceptance
          digest-mismatch: error
      - name: Commit the acceptance alone, and push it while dev is the commit judged
        env:
          ACCEPTANCE: ${{ runner.temp }}/acceptance
        run: |
          set -eu
          cp "$ACCEPTANCE/context/progress/accepted.json" context/progress/
          for f in "$ACCEPTANCE"/context/progress/history*.jsonl; do cp "$f" context/progress/; done
          set -- $(git status --porcelain --untracked-files=all | cut -c4- | sort)
          if [ "$#" -ne 2 ] || [ "$1" != context/progress/accepted.json ] \
            || ! printf '%s\n' "$2" | grep -Eq '^context/progress/history(-[0-9]{5,})?\.jsonl$'; then
            echo "the acceptance must change accepted.json and one history volume alone, not: $*"
            exit 1
          fi
          tip=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "dev is at ${tip:-nothing}, not $GITHUB_SHA, the commit judged: nothing is pushed; the newer merge's run accepts both"
            exit 0
          fi
          git add -- context/progress/accepted.json ':(glob)context/progress/history*.jsonl'
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F "$ACCEPTANCE/build/progress/acceptance-message.txt" \
            -- context/progress/accepted.json ':(glob)context/progress/history*.jsonl'
          if git push origin HEAD:refs/heads/dev; then
            echo "pushed $(git rev-parse HEAD) onto dev, on $GITHUB_SHA"
            exit 0
          fi
          tip=$(git ls-remote origin refs/heads/dev | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "dev moved to $tip while this pushed: nothing is pushed; the newer merge's run accepts both"
            exit 0
          fi
          exit 1

  red-run-issue:
    name: the issue when a run on dev is red
    # A run after a merge into dev, or the weekly run, never accepts a red result. When a job it
    # judges with failed or was cancelled, this opens one issue titled by the red legs, or comments
    # on the one open of its kind: dev is broken on those lines, and the merged change's author
    # fixes it forward the same day or reverts it, while other pull requests keep merging. A green
    # run after a merge closes the open one. A merge's run whose plan itself failed is red too, with
    # no outputs to read. No other run touches an issue.
    needs: [plan, quick, inputs, build, rebuild-linux-x86-64, rebuild-macos-arm64, same-bytes, save-set, judge-macos, judge-linux, judge-windows, judge-release, gather, verify]
    if: ${{ always() && ((needs.plan.outputs.weekly == 'true' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))) || (needs.plan.outputs.accept == 'true' && github.event_name == 'push') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.plan.result == 'failure')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      # The run's own jobs, to name the red legs in the title.
      actions: read
    steps:
      - name: Open the issue, or comment on the open one
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          WEEKLY: ${{ needs.plan.outputs.weekly }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$WEEKLY" = true ]; then
            prefix="The weekly run on dev is red"
            next="Nothing was accepted; read its jobs."
          else
            prefix="dev is red after a merge"
            next="Nothing was accepted. The merged change's author fixes it forward today or reverts it; other pull requests keep merging, and the next run after a merge judges everything since the last acceptance."
          fi
          red=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name' \
            | paste -sd ',' - | sed 's/,/, /g') || red=""
          if [ -z "$red" ]; then
            red=$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          fi
          title=$(printf '%s: %s' "$prefix" "$red" | cut -c1-200)
          body="The run $RUN_URL on $GITHUB_SHA is red: $red. $next"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title | startswith(\"$prefix\"))) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Close the open issue, once a run after a merge is green
        if: ${{ github.event_name == 'push' && needs.gather.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prefix="dev is red after a merge"
          numbers=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title | startswith(\"$prefix\")) | .number") || numbers=""
          for number in $numbers; do
            gh issue close "$number" --comment "The run $RUN_URL after a merge, on $GITHUB_SHA, is green." \
              || echo "could not close issue $number; close it by hand"
          done

  verify:
    name: verify (${{ matrix.os }})
    # The wheel installed fresh, as a user installs it: on Linux on a pull request, on the three
    # systems with the merge-grade set and the release shape.
    needs: [plan, build]
    if: needs.plan.outputs.verify != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.verify) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: The wheel, installed fresh, runs a program in one call
        # Installed by its plain name, no extra: `pip install wasi-python` must run programs, so
        # a wheel whose plain install could not never publishes.
        run: |
          wheel="$(ls release-assets/wasi_python-*.whl)"
          uv run --isolated --no-project --with "wasi-python @ ./$wheel" python -c "
          import tempfile, wasi_python
          done = wasi_python.run(['-c', 'import pandas; print(pandas.Series([1, 2, 3]).sum())'], root=tempfile.mkdtemp())
          print(done)
          assert (done.exit_code, done.stdout) == (0, b'6\n'), done
          "
          # The wheel's own command prints the one line its README promises.
          line=$(uv run --isolated --no-project --with "wasi-python @ ./$wheel" \
            wasi-python run -- -c "print(1)")
          echo "$line"
          want='{"exit_code": 0, "fuel_used": null, "stderr": "", "stdout": "1\n", "trapped": null, "truncated": []}'
          if [ "$line" != "$want" ]; then
            echo "the installed command printed another line"
            exit 1
          fi
          # The empty `run` extra, kept for 0.1.0a3's instructions. `uv run --with` installs an
          # unknown extra silently, so an import would prove nothing: assert the metadata.
          uv run --isolated --no-project --with "wasi-python[run] @ ./$wheel" python -c "
          import importlib.metadata, re
          meta = importlib.metadata.metadata('wasi-python')
          extras = meta.get_all('Provides-Extra') or []
          reqs = meta.get_all('Requires-Dist') or []
          print('Provides-Extra:', extras, 'Requires-Dist:', reqs)
          assert extras == ['run'], extras
          assert not [r for r in reqs if re.search(r'extra\s*==', r)], reqs
          "
        env:
          WASI_PYTHON_ARTIFACTS: ""

  attest:
    name: attest the release assets
    # Build provenance for every asset, signed through Sigstore's public-good instance and then
    # verified strictly, before anything is published, and only once arm64 macOS and
    # x86_64 Linux rebuilt the same bytes (same-bytes) and judged held them to the release pull
    # request's acceptance. Only a pushed tag gets here: a signature is permanent in the public
    # transparency log, so dry runs never sign. It checks out this repository for the local
    # action alone.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes, judged]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Verify each asset as a user will
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

  publish:
    name: publish the GitHub release
    # Only a pushed tag publishes; a manual run, even started on a tag, never does.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes, attest, judged]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      # The token that writes the release is in this job's last step alone, so uv, Python and the
      # notes script never have it in their environment.
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --no-project python release/version.py notes "$version" --repository "$GITHUB_REPOSITORY" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "wasi-python $version" --notes-file notes.md --verify-tag $prerelease

  pypi:
    name: publish the wheel on PyPI
    # Off until the owner registers this workflow as a trusted publisher on PyPI and sets the
    # repository variable PYPI_PUBLISH to true; judged has already held the wheel to the limit
    # PyPI has granted (PYPI_FILE_LIMIT_GRANTED, or 100 MiB). It checks out this repository for the local
    # action alone, and uploads with the workflow's pinned uv through trusted publishing alone:
    # the job's OIDC token, exchanged for a PyPI token bound to this repository, release.yml and
    # the pypi environment. It sets no env, so no variable steers uv past --no-config.
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: Only the wheel goes to PyPI
        run: mkdir dist && mv release-assets/*.whl dist/
      - name: Upload the wheel through trusted publishing
        run: uv publish --no-config --trusted-publishing always dist/*.whl

  ci-status:
    name: ci-status
    # The one required check. It runs whatever happened before it, so it is always reported, and
    # passes when every other job succeeded or was skipped by the plan, and the decision job
    # refused nothing: a pull request may not write accepted state, and one into dev that is not
    # documentation only carries its news file and a review file that holds. A failed or cancelled
    # job is red here, and so is a run whose plan said it publishes (a pushed tag) when publish did
    # not run, so a tag that published nothing is never green. It does not need the review job,
    # whose verdict is the review file's and not the code's; it reads the same refusals, so no pull
    # request merges unreviewed until the repository's ruleset requires the review job too.
    needs: [plan, quick, inputs, build, rebuild-linux-x86-64, rebuild-macos-arm64, same-bytes, judged, save-set, judge-macos, judge-linux, judge-windows, judge-release, gather, accept-record, accept-push, verify, red-run-issue, attest, publish, pypi]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped, and the plan refused nothing
        env:
          NEEDS: ${{ toJSON(needs) }}
          REFUSALS: ${{ needs.plan.outputs.refusals }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for job, need in sorted(needs.items()):
              print(f"{job}: {need.get('result')}")
          bad = sorted(j for j, n in needs.items() if n.get("result") not in ("success", "skipped"))
          if bad:
              sys.exit("a job this check needs neither succeeded nor was skipped: " + " ".join(bad))
          if os.environ.get("REFUSALS") != "[]":
              sys.exit("the plan refused this run: " + os.environ.get("REFUSALS", "(no plan)"))
          if os.environ.get("PUBLISH") == "true" and needs.get("publish", {}).get("result") != "success":
              sys.exit("the plan said this run publishes, and publish did not run")
          PY
