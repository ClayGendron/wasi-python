      upstream-pure-r-104-sha256: ${{ steps.out.outputs.upstream-pure-r-104-sha256 }}
      upstream-pure-r-105-id: ${{ steps.out.outputs.upstream-pure-r-105-id }}
      upstream-pure-r-105-sha256: ${{ steps.out.outputs.upstream-pure-r-105-sha256 }}
      upstream-pure-r-106-id: ${{ steps.out.outputs.upstream-pure-r-106-id }}
      upstream-pure-r-106-sha256: ${{ steps.out.outputs.upstream-pure-r-106-sha256 }}
