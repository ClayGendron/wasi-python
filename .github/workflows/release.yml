# The release workflow, and every change's check.
#
# One decision job (plan, release/ci_plan.py) reads what a run changes and picks the jobs it
# needs; every later job gates on its outputs with if:, never with a workflow-level paths: filter,
# so a skipped job reports success and the one required check, ci-status, is always reported.
# A pull request into dev runs quick (ruff, mypy, the pure-Python unit tests and the rules), then
# the judge's shards its paths need on Linux and Windows (macOS too when the runner, the set or the
# harness changed; the upstream groups on Linux when the set, the suites or the harness changed)
# from the cached set, and the gather narrowed to what ran. A merge into dev (a push) runs the
# merge-grade set: every normal-tier shard on its three systems, the build shard and verify on
# three. A pushed tag v<version> builds the artifact set from its pins on arm64 macOS, judges both
# tiers, rebuilds it on arm64 Linux and x86_64 Linux and requires the same bytes, attests and
# publishes. A pull request into main, a dispatch and the weekly schedule run the same release
# shape, never signing or publishing. Third-party actions are pinned by commit, their release
# named beside each. Every job that reads the build's files does so through the local action
# verify-artifact (the id guarded, the download by it, the check against the SHA-256 of
# SHA256SUMS the build job handed on) before it uses them. Values reach scripts through env:,
# never as expressions. A pull request's jobs check out its head commit, never the merge ref: the
# up-to-date rule makes the head the tree the squash puts on dev.
name: release

on:
  pull_request:
    branches: [dev, main]
    # labeled: adding ci:full re-runs the check with the merge-grade set.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1" # weekly, on the default branch dev: the release tier and the rebuilds
  workflow_dispatch:
    inputs:
      from-source:
        description: build the set from the pins even when a set for this commit is cached
        type: boolean
        default: false
      release-tier:
        description: judge the release tier too (a tag and a run on main always do)
        type: boolean
        default: false

permissions: {}

# A pull request's newer push cancels its older run; a tag's run, a push to dev and the weekly
# run are never cancelled, each queues behind the one before of its own event.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('release-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_DATE_EPOCH: "1767225600"
  UV_VERSION: "0.9.22"
  # The judge's own environment exactly as uv.lock pins it, on the Python it is developed with.
  UV_LOCKED: "1"
  UV_PYTHON: "3.14.2"
  # Every build of this package, the editable one uv run makes included, uses the pinned backend.
  UV_BUILD_CONSTRAINT: release/build-constraints.txt

jobs:
  plan:
    name: plan
    # Which jobs this run needs, from its event and the paths it changes, and each judge job's
    # shards, generated from tests/release_shards.toml: no shard is named in this file.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      set: ${{ steps.plan.outputs.set }}
      runner: ${{ steps.plan.outputs.runner }}
      harness: ${{ steps.plan.outputs.harness }}
      upstream: ${{ steps.plan.outputs.upstream }}
      workflow: ${{ steps.plan.outputs.workflow }}
      progress: ${{ steps.plan.outputs.progress }}
      news: ${{ steps.plan.outputs.news }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      full: ${{ steps.plan.outputs.full }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
      judge: ${{ steps.plan.outputs.judge }}
      tier: ${{ steps.plan.outputs.tier }}
      build: ${{ steps.plan.outputs.build }}
      verify: ${{ steps.plan.outputs.verify }}
      selected: ${{ steps.plan.outputs.selected }}
      refusals: ${{ steps.plan.outputs.refusals }}
      macos: ${{ steps.plan.outputs.macos }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the merge base, the earlier tip and the pull request's commit messages
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The plan
        id: plan
        env:
          PLAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAN_BASE: ${{ github.event.pull_request.base.sha }}
          PLAN_BEFORE: ${{ github.event.before }}
          PLAN_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PLAN_RELEASE_TIER: ${{ inputs.release-tier }}
        run: uv run --no-project python -I release/ci_plan.py

  quick:
    name: quick (ruff, mypy, the unit tests, lint)
    # Everything that needs no artifact set, on every run: the gate the judge's stage waits on.
    # lint is the rules checks, the writing conventions among them.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the rules read the git history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: ruff
        run: |
          uv run ruff check src tests release
          uv run ruff format --check src tests release
      - name: mypy
        run: uv run mypy
      - name: The unit tests that need no artifact set
        run: uv run pytest -p no:cacheprovider -q -m "not slow" -n 4 tests/unit
      - name: lint
        # No artifact set here: a rule that reads it is blocked, and own-rest runs it with one.
        run: uv run pytest -p no:cacheprovider -q tests/checks/test_rules.py --partial "quick has no artifact set"

  inputs:
    name: the set's key, and whether this run may reuse a set
    # A set the cache holds under this commit's key is reused where a cached set is trusted: a pull
    # request into dev, a push to dev, the weekly run on dev, and a dispatch on a branch other than
    # main, not from-source. A pull request into main, a run on main and a tag build their own.
    # Every consumer compares reuse with == 'true', so an empty or broken output builds from source.
    needs: plan
    if: needs.plan.outputs.judge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The set's key (release/set_key.py prints what it hashes)
        id: key
        run: uv run --no-project python -I release/set_key.py key >> "$GITHUB_OUTPUT"
      - name: Is a set cached under the key
        # This ref's cache, then the base branch's and the default branch's (dev's).
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Reuse only where a cached set is trusted
        id: decide
        env:
          FROM_SOURCE: ${{ inputs.from-source }}
          HIT: ${{ steps.lookup.outputs.cache-hit }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          trusted=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$GITHUB_BASE_REF" != main ]; then trusted=true; fi ;;
            push | schedule)
              if [ "$GITHUB_REF" = refs/heads/dev ]; then trusted=true; fi ;;
            workflow_dispatch)
              if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
                trusted=true
              fi ;;
          esac
          reuse=false
          if [ "$trusted" = true ] && [ "$FROM_SOURCE" != true ] && [ "$HIT" = true ]; then
            reuse=true
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "event $GITHUB_EVENT_NAME, $GITHUB_REF ($GITHUB_REF_TYPE), base '$GITHUB_BASE_REF', from-source '$FROM_SOURCE', cached '$HIT': reuse=$reuse"
          if [ "$trusted" = true ] && [ "$HIT" != true ]; then
            echo "no cache this run reads (this ref's or dev's) holds $KEY: the build job compiles it"
          fi

  build:
    name: build on arm64 macOS, or reuse a set
    # The published set is built on arm64 macOS, on every run of the release shape (a tag, a
    # pull request into main, a dispatch, the weekly run) that does not reuse one. A run that
    # reuses a cached set restores it on Linux; a pull request or a push to dev whose key no cache
    # holds compiles it once on arm64 Linux, and save-set keeps it. The judge waits on quick.
    needs: [plan, inputs, quick]
    if: needs.plan.outputs.judge == 'true'
    runs-on: ${{ needs.inputs.outputs.reuse == 'true' && 'ubuntu-24.04' || needs.plan.outputs.rebuild == 'true' && 'macos-15' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      assets-id: ${{ steps.assets.outputs.artifact-id }}
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
      # python.wasm's SHA-256 for the gather, which never holds the assets.
      wasm-sha256: ${{ steps.wasm.outputs.sha256 }}
      # The set's own SHA256SUMS (not the release assets'), for the gather's G2 and G7.
      set-sums-sha256: ${{ steps.set-sums.outputs.sha256 }}
      # Built or reused, from what ran (the compile step's outcome), for the gather's G7.
      set-source: ${{ steps.compile.outcome == 'success' && 'built' || format('reused {0}', needs.inputs.outputs.key) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the tag's commit is checked against main's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The version, and the tag it is released under, agree
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run python release/version.py check --tag "$GITHUB_REF_NAME"
            # A release is cut from main: the tagged commit must be in main's history.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            uv run python release/version.py check
          fi
      - name: Download the pinned inputs
        if: needs.inputs.outputs.reuse != 'true'
        run: scripts/00_download.sh
      - name: Build from the pins
        id: compile
        if: needs.inputs.outputs.reuse != 'true'
        run: scripts/build.sh
      - name: The set this commit's key names
        if: needs.inputs.outputs.reuse == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ needs.inputs.outputs.key }}
          fail-on-cache-miss: true
      - name: The reused set in build/artifacts
        if: needs.inputs.outputs.reuse == 'true'
        run: |
          mkdir -p build
          mv wasi-python-set build/artifacts
      - name: The set is this commit's
        # Every run, no if: each file against the set's own SHA256SUMS, no other file, MANIFEST's
        # pin and recipe lines against this checkout; and a reused set's key.
        env:
          REUSED_KEY: ${{ needs.inputs.outputs.reuse == 'true' && needs.inputs.outputs.key || '' }}
        run: |
          if [ -n "$REUSED_KEY" ]; then
            uv run --no-project python -I release/set_key.py verify build/artifacts --key "$REUSED_KEY"
          else
            uv run --no-project python -I release/set_key.py verify build/artifacts
          fi
      - name: The wheel
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv run --no-project python -I release/licences.py append build/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
          uv run --no-project python -I release/licences.py check dist/wasi_python-*.whl build/artifacts
      - name: The source trees are their tarballs plus the recorded patches
        # On a source run only: a reuse run has no tree here. build-shard runs the same step on
        # every run that judges the build shard, with no if:.
        if: steps.compile.outcome == 'success'
        # All twenty-eight trees must pass (seaborn's sdist the twenty-seventh, statsmodels' the
        # twenty-eighth): a skipped check (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
            -k test_source_tree_matches_its_tarball | tee zero-patch.txt
          grep -Eq "^28 passed, [0-9]+ deselected in" zero-patch.txt
      - name: The SHA-256 of python.wasm, handed to the gather
        id: wasm
        run: echo "sha256=$(shasum -a 256 build/artifacts/python.wasm | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: The SHA-256 of the set's own SHA256SUMS, handed to the gather
        id: set-sums
        run: echo "sha256=$(shasum -a 256 build/artifacts/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: Release assets
        # The set again, just before it is packed: the wheel's copy and the zero-patch step ran
        # since it was checked, and what is packed must be what was checked.
        run: |
          uv run --no-project python -I release/set_key.py verify build/artifacts
          uv run python release/version.py assets build/artifacts dist/wasi_python-*.whl release-assets
      - name: The SHA-256 of SHA256SUMS, handed to every job that reads the assets
        id: sums
        run: echo "sha256=$(shasum -a 256 release-assets/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
      - name: What this run checks, signs and publishes
        env:
          ASSETS_ID: ${{ steps.assets.outputs.artifact-id }}
          ASSETS_DIGEST: ${{ steps.assets.outputs.artifact-digest }}
          SUMS_SHA256: ${{ steps.sums.outputs.sha256 }}
        run: |
          echo "release-assets: artifact $ASSETS_ID, digest $ASSETS_DIGEST"
          echo "SHA256SUMS: sha256 $SUMS_SHA256"
          cat release-assets/SHA256SUMS
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore

  build-shard:
    name: the build shard on a fresh build (ubuntu-24.04-arm)
    # One compile from the pins on arm64 Linux serves two ends. The build shard reads the build
    # tree (the source trees, the compile records, the toolchain), which a reused set does not
    # have, so it runs here on every run that judges it, tags included; its record's artifact and
    # set_sums are this tree's own, and the gather's G2 holds them to the build job's. And the
    # same set's SHA256SUMS and wheel are arm64 Linux's rebuild, which same-bytes compares with the
    # build's, beside x86_64 Linux's. Each rebuild host compiles with its own pinned wasi-sdk
    # clang, and every compile carries -ffp-contract=off, set in the toolchain's own configuration
    # files by step 10: that makes wasi-sdk's x86_64 and aarch64 builds of clang emit the same
    # bytes, so each vote rests on its own host's toolchain. The wheel is built after the shard,
    # whose record must be of a clean tree. A hung job frees the gate after two hours.
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      record-id: ${{ steps.record.outputs.artifact-id }}
      record-sha256: ${{ steps.record-sha.outputs.sha256 }}
      sums-id: ${{ steps.sums.outputs.artifact-id }}
      wheel-id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # as the build job's: the judge reads the checkout's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The runner's own tools (unpinned host inputs, recorded here)
        # nproc: the core count beside every time figure. binfmt_misc: a runner that could run an
        # aarch64 program through its own, unpinned qemu would hide a gap in the emulated
        # compiler's closure.
        run: |
          uname -srm
          nproc
          echo "binfmt_misc: $(ls /proc/sys/fs/binfmt_misc/ 2> /dev/null | tr '\n' ' ')"
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
          # The runner's own python3, which step 10's shim keeps out of the build,
          # named so the log records what stood on PATH.
          python3 --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - name: The source trees are their tarballs plus the recorded patches
        # All twenty-eight trees must pass (seaborn's sdist the twenty-seventh, statsmodels' the
        # twenty-eighth): a skipped check (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
            -k test_source_tree_matches_its_tarball | tee zero-patch.txt
          grep -Eq "^28 passed, [0-9]+ deselected in" zero-patch.txt
      - name: The build shard
        # Only the checks that need the build tree: every component's tree, the compile records and
        # the zlib tarball, on this job's own build. The rest of the judge runs in the judge jobs.
        run: uv run pytest -p no:cacheprovider --shard=build --progress-latest "$RUNNER_TEMP/record/latest.json"
      - name: The record's SHA-256
        id: record-sha
        run: uv run python -c "import hashlib, sys; print('sha256=' + hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$RUNNER_TEMP/record/latest.json" >> "$GITHUB_OUTPUT"
      - id: record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-build-build
          path: ${{ runner.temp }}/record/latest.json
          if-no-files-found: error
      - id: sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-ubuntu-24.04-arm
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv run --no-project python -I release/licences.py append build/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - id: wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-ubuntu-24.04-arm
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-shard-logs
          path: |
            build/logs/
            ${{ runner.temp }}/record/
          if-no-files-found: ignore

  rebuild-linux-x86-64:
    name: rebuild from the pins (ubuntu-24.04)
    # x86_64 Linux rebuilds the whole set from an empty downloads/ and build/, beside the build,
    # and uploads its SHA256SUMS and wheel; same-bytes compares each with the set's, as it does
    # build-shard's from arm64 Linux. Only the release shape rebuilds.
    needs: plan
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      sums-id: ${{ steps.sums.outputs.artifact-id }}
      wheel-id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The runner's own tools (unpinned host inputs, recorded here)
        # As build-shard's: the core count, binfmt_misc, and what stood on PATH.
        run: |
          uname -srm
          nproc
          echo "binfmt_misc: $(ls /proc/sys/fs/binfmt_misc/ 2> /dev/null | tr '\n' ' ')"
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
          python3 --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - id: sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-ubuntu-24.04
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv run --no-project python -I release/licences.py append build/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - id: wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-ubuntu-24.04
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-logs-ubuntu-24.04
          path: build/logs/
          if-no-files-found: ignore

  same-bytes:
    name: the same bytes from every host
    # Each rebuild's SHA256SUMS lists the whole set (the three artifacts, MANIFEST and the licences)
    # and must equal the set's, byte for byte, from arm64 Linux and from x86_64 Linux, each with its
    # own pinned clang. The .tar.xz asset is made from the set deterministically but is
    # outside this claim. attest and publish need this job, so a tag never signs or publishes bytes
    # that both hosts did not rebuild. Only the release shape rebuilds; it checks out this
    # repository for the local action alone.
    needs: [plan, build, build-shard, rebuild-linux-x86-64]
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: The rebuild jobs handed on artifact ids
        env:
          ARM64_SUMS_ID: ${{ needs.build-shard.outputs.sums-id }}
          ARM64_WHEEL_ID: ${{ needs.build-shard.outputs.wheel-id }}
          X86_64_SUMS_ID: ${{ needs.rebuild-linux-x86-64.outputs.sums-id }}
          X86_64_WHEEL_ID: ${{ needs.rebuild-linux-x86-64.outputs.wheel-id }}
        run: |
          for id in "$ARM64_SUMS_ID" "$ARM64_WHEEL_ID" "$X86_64_SUMS_ID" "$X86_64_WHEEL_ID"; do
            case "$id" in
              "" | *[!0-9]*) echo "a rebuild job handed on no artifact id"; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-shard.outputs.sums-id }}
          path: rebuilds/ubuntu-24.04-arm
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-shard.outputs.wheel-id }}
          path: rebuilt-wheels/ubuntu-24.04-arm
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.sums-id }}
          path: rebuilds/ubuntu-24.04
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.wheel-id }}
          path: rebuilt-wheels/ubuntu-24.04
          digest-mismatch: error
      - name: Every rebuild's SHA256SUMS is the set's, byte for byte
        run: |
          mkdir set
          tar -xJf release-assets/*.tar.xz -C set
          sums=$(echo set/wasi-python-*/SHA256SUMS)
          for runner in ubuntu-24.04-arm ubuntu-24.04; do
            cmp "$sums" "rebuilds/$runner/SHA256SUMS"
            echo "$runner: the same SHA256SUMS"
          done
          cat "$sums"
          # The index binds the tarball's files only once each is checked against it: every listed
          # file holds the bytes listed, the tarball holds one folder and nothing else beside the
          # listed files (a nested SHA256SUMS or a symlink cannot hide), and every published file
          # and a licence are among the names, so a file dropped from both still fails.
          if [ "$(find set -mindepth 1 -maxdepth 1 | wc -l)" -ne 1 ]; then
            echo "the set's tarball holds more than its one folder"
            exit 1
          fi
          # Before entering the folder, so the folder itself cannot be a symlink to another place.
          if [ -n "$(find set -type l)" ]; then
            echo "the set's tarball holds a symlink"
            exit 1
          fi
          cd set/wasi-python-*
          sha256sum --strict -c SHA256SUMS
          listed=$(awk '{print $2}' SHA256SUMS | LC_ALL=C sort)
          present=$(find . -mindepth 1 ! -type d ! -path ./SHA256SUMS | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$listed" != "$present" ]; then
            echo "the set's tarball holds other files than its SHA256SUMS lists"
            exit 1
          fi
          for name in python.wasm python-snapshot.wasm python-stdlib.zip MANIFEST; do
            if ! printf '%s\n' "$listed" | grep -qxF "$name"; then
              echo "the set's SHA256SUMS does not list $name"
              exit 1
            fi
          done
          if ! printf '%s\n' "$listed" | grep -q '^LICENSES/'; then
            echo "the set's SHA256SUMS lists no file under LICENSES/"
            exit 1
          fi
          echo "every file in the set's tarball is the bytes its SHA256SUMS lists"
      - name: The wheel carries the set and is the wheel each host rebuilt
        # Three rules name what differs; the last comparison covers everything else in the wheel
        # (runner.py, METADATA), so a wheel built from any other source or set fails.
        run: |
          sums="$PWD/$(echo set/wasi-python-*/SHA256SUMS)"
          wheel="$(echo release-assets/wasi_python-*.whl)"
          mkdir wheel && unzip -q "$wheel" -d wheel
          ( cd wheel/wasi_python/artifacts && sha256sum --strict -c "$sums" )
          cmp "$sums" wheel/wasi_python/artifacts/SHA256SUMS
          listed=$(awk '{print $2}' "$sums"; echo SHA256SUMS)
          present=$(cd wheel/wasi_python/artifacts && find . -type f | sed 's#^\./##')
          if [ "$(echo "$listed" | sort)" != "$(echo "$present" | sort)" ]; then
            echo "the wheel's artifacts are not exactly the set's"
            exit 1
          fi
          for runner in ubuntu-24.04-arm ubuntu-24.04; do
            rebuilt="rebuilt-wheels/$runner/$(basename "$wheel")"
            if ! cmp -s "$wheel" "$rebuilt"; then
              echo "$runner rebuilt a different wheel; entries only in one (name, mode, size, CRC, date):"
              python3 - "$wheel" "$rebuilt" <<'PY'
          import sys, zipfile
          a, b = ({(i.filename, oct(i.external_attr >> 16), i.file_size, i.CRC, i.date_time)
                   for i in zipfile.ZipFile(p).infolist()} for p in sys.argv[1:])
          for row in sorted(a ^ b):
              print("release" if row in a else "rebuilt", *row)
          print("(no entry differs: the zip's own records do)" if a == b else "")
          PY
              exit 1
            fi
            echo "$runner: the same wheel"
          done

  save-set:
    name: keep the set this run built and both hosts rebuilt
    # A run on a branch that built its set writes it to the cache under the key its own checkout
    # gives: a pull request's to its own scope, a push to dev's to dev's, which every pull request
    # reads. On the release shape only once same-bytes has matched it with both rebuilds.
    needs: [plan, build, same-bytes]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.set-source == 'built' && !startsWith(github.ref, 'refs/tags/') && (needs.plan.outputs.rebuild != 'true' || needs.same-bytes.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: The set, out of the release assets
        run: |
          mkdir unpacked
          tar -xJf release-assets/*.tar.xz -C unpacked
          top=$(echo unpacked/wasi-python-*)
          mv "$top" wasi-python-set
      - name: The set's key from this checkout
        id: key
        run: uv run --no-project python -I release/set_key.py key >> "$GITHUB_OUTPUT"
      - name: The set is this commit's
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: uv run --no-project python -I release/set_key.py verify wasi-python-set --key "$KEY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasi-python-set
          key: ${{ steps.key.outputs.key }}

  judge-macos:
    name: judge (macos-15, ${{ matrix.shard }})
    # One leg per shard the plan selected on this system (generated from tests/release_shards.toml).
    # Each leg runs its shard serially against accepted.json and uploads its record under its own
    # name, record-<system>-<shard>; an artifact's name is unique within a run, so the name binds
    # the record to its leg, and the gather finds each record by it.
    needs: [plan, build]
    if: needs.plan.outputs.macos != '[]'
    strategy:
      fail-fast: false
      # One run stays within the plan's 40 jobs at once.
      max-parallel: 18
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.macos) }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The judge reads its repository's text as UTF-8 on every host, as Python 3.15 does by
      # default (PEP 686); Windows' locale codec is not UTF-8 (the branch dry run 39182550825).
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the rules in own-rest read the git history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build's files
        uses: ./.github/actions/verify-artifact
        with:
          assets-id: ${{ needs.build.outputs.assets-id }}
          sums-sha256: ${{ needs.build.outputs.sums-sha256 }}
      - name: Unpack the artifact set; the wheel into dist/
        run: |
          uv run python -c "import sys, tarfile, glob; tarfile.open(glob.glob('release-assets/*.tar.xz')[0]).extractall(sys.argv[1], filter='data')" "$RUNNER_TEMP/set"
          echo "WASI_PYTHON_ARTIFACTS=$(uv run python -c "import glob, sys; print(glob.glob(sys.argv[1] + '/wasi-python-*')[0])" "$RUNNER_TEMP/set")" >> "$GITHUB_ENV"
          mkdir -p dist
          cp release-assets/wasi_python-*.whl dist/
      - name: What the shard needs (the upstream kit and source trees, verified)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run python tests/upstream/fetch.py --shard "$SHARD"
      - name: The shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run pytest -p no:cacheprovider --shard="$SHARD" --progress-latest "$RUNNER_TEMP/record/latest.json"
      - id: record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-macos-${{ matrix.shard }}
          path: ${{ runner.temp }}/record/latest.json
          if-no-files-found: error
      - name: Keep the shard's record when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-record-macos-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

