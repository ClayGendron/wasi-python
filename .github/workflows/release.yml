# The release workflow (context/specifications/004-alpha-releases.md).
#
# A pushed tag v<version> builds the artifact set from its pins, judges it, checks the same bytes on
# Linux, Windows and macOS, rebuilds it from the pins on arm64 Linux and requires the same bytes
# (spec 012), and publishes a GitHub release (and, once the owner enables it, the wheel on PyPI). A
# manual run (workflow_dispatch) is a dry run: build, rebuild and verify, never sign or publish.
# Third-party actions are pinned by commit, their release named beside each.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "1767225600"
  UV_VERSION: "0.9.22"
  # The judge's own environment exactly as uv.lock pins it, on the Python it is developed with.
  UV_LOCKED: "1"
  UV_PYTHON: "3.14.2"
  # Every build of this package, the editable one uv run makes included, uses the pinned backend.
  UV_BUILD_CONSTRAINT: release/build-constraints.txt

jobs:
  build:
    name: build and judge (arm64 macOS)
    # The published set is built and judged on arm64 macOS; the rebuild job checks it from Linux.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag's commit is checked against main's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: The version, and the tag it is released under, agree
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run python release/version.py check --tag "$GITHUB_REF_NAME"
            # A release is cut from main: the tagged commit must be in main's history.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            uv run python release/version.py check
          fi
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - name: The wheel
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - name: Zero-patch check (no upstream tree differs from its pinned tarball)
        # All seven trees must pass: a skipped check (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
            -k test_source_tree_matches_its_tarball | tee zero-patch.txt
          grep -Eq "^7 passed, [0-9]+ deselected in" zero-patch.txt
      - name: The judge
        run: uv run pytest -p no:cacheprovider
      - name: Release assets
        run: uv run python release/version.py assets build/artifacts dist/wasi_python-*.whl release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore

  rebuild:
    name: rebuild from the pins (${{ matrix.os }})
    # A second host rebuilds the whole set from an empty downloads/ and build/, beside the build,
    # and uploads its SHA256SUMS; same-bytes compares it with the set's (spec 012, Decision 7).
    # x86_64 Linux is a pinned build host but not in this gate: its wasi-sdk clang lays out one
    # numpy function's stack differently, so its reactor differs by 21 bytes (spec 012's landing
    # notes; context/research/2026-10-17-x86-64-rebuilds-differ-in-one-function.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: The runner's own tools (unpinned host inputs, recorded here)
        run: |
          uname -srm
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-${{ matrix.os }}
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it (spec 016, Decision 1)
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-${{ matrix.os }}
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-logs-${{ matrix.os }}
          path: build/logs/
          if-no-files-found: ignore

  same-bytes:
    name: the same bytes from every host
    # Each rebuild's SHA256SUMS lists the whole set (the three artifacts, MANIFEST and the licences)
    # and must equal the set's, byte for byte. The .tar.xz asset is made from the set
    # deterministically but is outside this claim. attest and publish need this job, so a tag never
    # signs or publishes bytes that a second host did not rebuild.
    needs: [build, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebuild-ubuntu-24.04-arm
          path: rebuilds/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rebuild-wheel-ubuntu-24.04-arm
          path: rebuilt-wheels/ubuntu-24.04-arm
      - name: Every rebuild's SHA256SUMS is the set's, byte for byte
        run: |
          mkdir set
          tar -xJf release-assets/*.tar.xz -C set
          sums=$(echo set/wasi-python-*/SHA256SUMS)
          for runner in ubuntu-24.04-arm; do
            cmp "$sums" "rebuilds/$runner/SHA256SUMS"
            echo "$runner: the same SHA256SUMS"
          done
          cat "$sums"
      - name: The wheel carries the set and is the wheel the second host rebuilt (spec 016)
        # Three rules name what differs; the last comparison covers everything else in the wheel
        # (runner.py, METADATA), so a wheel built from any other source or set fails.
        run: |
          sums="$PWD/$(echo set/wasi-python-*/SHA256SUMS)"
          wheel="$(echo release-assets/wasi_python-*.whl)"
          mkdir wheel && unzip -q "$wheel" -d wheel
          ( cd wheel/wasi_python/artifacts && sha256sum --strict -c "$sums" )
          cmp "$sums" wheel/wasi_python/artifacts/SHA256SUMS
          listed=$(awk '{print $2}' "$sums"; echo SHA256SUMS)
          present=$(cd wheel/wasi_python/artifacts && find . -type f | sed 's#^\./##')
          if [ "$(echo "$listed" | sort)" != "$(echo "$present" | sort)" ]; then
            echo "the wheel's artifacts are not exactly the set's"
            exit 1
          fi
          for runner in ubuntu-24.04-arm; do
            rebuilt="rebuilt-wheels/$runner/$(basename "$wheel")"
            if ! cmp -s "$wheel" "$rebuilt"; then
              echo "$runner rebuilt a different wheel; entries only in one (name, mode, size, CRC, date):"
              python3 - "$wheel" "$rebuilt" <<'PY'
          import sys, zipfile
          a, b = ({(i.filename, oct(i.external_attr >> 16), i.file_size, i.CRC, i.date_time)
                   for i in zipfile.ZipFile(p).infolist()} for p in sys.argv[1:])
          for row in sorted(a ^ b):
              print("release" if row in a else "rebuilt", *row)
          print("(no entry differs: the zip's own records do)" if a == b else "")
          PY
              exit 1
            fi
            echo "$runner: the same wheel"
          done

  verify:
    name: verify (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Unpack the artifact set
        run: |
          uv run python -c "import sys, tarfile, glob; tarfile.open(glob.glob('release-assets/*.tar.xz')[0]).extractall(sys.argv[1], filter='data')" "$RUNNER_TEMP/set"
          echo "WASI_PYTHON_ARTIFACTS=$(uv run python -c "import glob, sys; print(glob.glob(sys.argv[1] + '/wasi-python-*')[0])" "$RUNNER_TEMP/set")" >> "$GITHUB_ENV"
      - name: The v1.1 to v1.4 checks on these bytes
        # Pass and fail only: the ratchet against the accepted state is the build job's. Fuel
        # differs slightly between hosts, even on the same bytes (spec 004's landing notes), so
        # this job compares with an empty baseline, which the scoreboard announces.
        run: >-
          uv run pytest -p no:cacheprovider --progress-dir "$RUNNER_TEMP/no-baseline"
          tests/checks/test_v1_1_artifact_set.py tests/checks/test_v1_2_portable_and_sealed.py
          tests/checks/test_v1_3_data_stack.py tests/checks/test_v1_4_embedding.py
          tests/unit/test_runner_sweep.py
          tests/unit/test_runner_grants.py
      - name: Nothing passed here is blocked but what this job cannot provide
        # The empty baseline fails only on a failed check; a check that skipped for a missing
        # need would pass unnoticed, so the needs that blocked anything are named here.
        run: |
          uv run python -c "
          import json
          checks = json.load(open('build/progress/latest.json'))['checks'].values()
          blocked = {c['need'] for c in checks if c['status'] == 'blocked'}
          print('blocked by:', sorted(blocked))
          assert blocked <= {'oracle', 'three systems', 'wheel'}, blocked
          "
      - name: The wheel, installed fresh, runs a program in one call
        run: |
          wheel="$(ls release-assets/wasi_python-*.whl)"
          uv run --isolated --no-project --with "wasi-python[run] @ ./$wheel" python -c "
          import tempfile, wasi_python
          done = wasi_python.run(['-c', 'import pandas; print(pandas.Series([1, 2, 3]).sum())'], root=tempfile.mkdtemp())
          print(done)
          assert (done.exit_code, done.stdout) == (0, b'6\n'), done
          "
        env:
          WASI_PYTHON_ARTIFACTS: ""

  attest:
    name: attest the release assets
    # Build provenance for every asset, signed through Sigstore's public-good instance and then
    # verified strictly, before anything is published (spec 009), and only once a second host
    # rebuilt the same bytes (same-bytes, spec 012). Only a pushed tag gets here: a signature is
    # permanent in the public transparency log, so dry runs never sign.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Verify each asset as a user will
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

  publish:
    name: publish the GitHub release
    # Only a pushed tag publishes; a manual run, even started on a tag, never does.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --no-project python release/version.py notes "$version" > notes.md
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "wasi-python $version" --notes-file notes.md --verify-tag $prerelease

  pypi:
    name: publish the wheel on PyPI
    # Off until the owner registers this workflow as a trusted publisher on PyPI and sets the
    # repository variable PYPI_PUBLISH to true.
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Only the wheel goes to PyPI
        run: mkdir dist && mv release-assets/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
