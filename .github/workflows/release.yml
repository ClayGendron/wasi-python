    name: judge (ubuntu-24.04, ${{ matrix.shard }})
    # One leg per shard of this system's plan (tests/release_shards.toml; spec 063, Decision 7).
    # Each leg runs its shard serially against accepted.json, hashes its record and hands on the
    # record's id and SHA-256 under the shard's own names. The legs of one system share every
    # host-side input, so the shared output namespace gives nothing away; the systems are three jobs.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [own-embedding, own-guest, own-runner, own-rest, upstream-groupby, upstream-frame, upstream-numpy-a, upstream-numpy-b, upstream-pandas-small]
