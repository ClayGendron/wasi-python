          RECORD_LINUX_UPSTREAM_PLOT_H: ${{ needs.judge-linux.outputs.upstream-plot-h-sha256 }}
          RECORD_LINUX_UPSTREAM_PLOT_I: ${{ needs.judge-linux.outputs.upstream-plot-i-sha256 }}
          RECORD_WINDOWS_OWN_EMBEDDING: ${{ needs.judge-windows.outputs.own-embedding-sha256 }}
          RECORD_WINDOWS_OWN_EMBEDDING_A: ${{ needs.judge-windows.outputs.own-embedding-a-sha256 }}
          RECORD_WINDOWS_OWN_HOSTILE: ${{ needs.judge-windows.outputs.own-hostile-sha256 }}
          RECORD_WINDOWS_OWN_GUEST: ${{ needs.judge-windows.outputs.own-guest-sha256 }}
          RECORD_WINDOWS_OWN_RUNNER: ${{ needs.judge-windows.outputs.own-runner-sha256 }}
          RECORD_WINDOWS_UPSTREAM_WINDOWS: ${{ needs.judge-windows.outputs.upstream-windows-sha256 }}
          TIER: ${{ needs.inputs.outputs.tier }}
          RECORD_RELEASE_UPSTREAM_RELEASE_A: ${{ needs.judge-release.outputs.upstream-release-a-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_B: ${{ needs.judge-release.outputs.upstream-release-b-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_C: ${{ needs.judge-release.outputs.upstream-release-c-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_D: ${{ needs.judge-release.outputs.upstream-release-d-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_E: ${{ needs.judge-release.outputs.upstream-release-e-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_F: ${{ needs.judge-release.outputs.upstream-release-f-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_G: ${{ needs.judge-release.outputs.upstream-release-g-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_H: ${{ needs.judge-release.outputs.upstream-release-h-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_I: ${{ needs.judge-release.outputs.upstream-release-i-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_J: ${{ needs.judge-release.outputs.upstream-release-j-sha256 }}
          RECORD_RELEASE_UPSTREAM_RELEASE_K: ${{ needs.judge-release.outputs.upstream-release-k-sha256 }}
