      upstream-pure-r-096-sha256: ${{ steps.out.outputs.upstream-pure-r-096-sha256 }}
      upstream-pure-r-097-id: ${{ steps.out.outputs.upstream-pure-r-097-id }}
      upstream-pure-r-097-sha256: ${{ steps.out.outputs.upstream-pure-r-097-sha256 }}
      upstream-pure-r-098-id: ${{ steps.out.outputs.upstream-pure-r-098-id }}
      upstream-pure-r-098-sha256: ${{ steps.out.outputs.upstream-pure-r-098-sha256 }}
      upstream-pure-r-099-id: ${{ steps.out.outputs.upstream-pure-r-099-id }}
      upstream-pure-r-099-sha256: ${{ steps.out.outputs.upstream-pure-r-099-sha256 }}
