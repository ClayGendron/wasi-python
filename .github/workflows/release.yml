# The release workflow (context/specifications/004-alpha-releases.md).
#
# A pushed tag v<version> builds the artifact set from its pins, judges it, checks the same bytes on
# Linux, Windows and macOS, rebuilds it from the pins on arm64 Linux and x86_64 Linux and requires
# the same bytes (specs 012, 040 and 059), and publishes a GitHub release (and, once the owner enables it, the wheel on PyPI). A
# manual run (workflow_dispatch) is a dry run: build, rebuild and verify, never sign or publish.
# Third-party actions are pinned by commit, their release named beside each.
# Every job that reads the build's files downloads them by the id the build job handed on, after a
# step that refuses an empty id, and checks them against the SHA-256 of SHA256SUMS the build job
# handed on before it uses them (spec 057). Values reach scripts through env:, never as expressions.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "1767225600"
  UV_VERSION: "0.9.22"
  # The judge's own environment exactly as uv.lock pins it, on the Python it is developed with.
  UV_LOCKED: "1"
  UV_PYTHON: "3.14.2"
  # Every build of this package, the editable one uv run makes included, uses the pinned backend.
  UV_BUILD_CONSTRAINT: release/build-constraints.txt

jobs:
  build:
    name: build and judge (arm64 macOS)
    # The published set is built and judged on arm64 macOS; the rebuild job checks it from Linux.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      assets-id: ${{ steps.assets.outputs.artifact-id }}
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag's commit is checked against main's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The version, and the tag it is released under, agree
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run python release/version.py check --tag "$GITHUB_REF_NAME"
            # A release is cut from main: the tagged commit must be in main's history.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            uv run python release/version.py check
          fi
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - name: The wheel
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - name: The source trees are their tarballs plus the recorded patches (spec 020)
        # All fifteen trees must pass: a skipped check (a tree not unpacked) would exit 0 too.
        run: |
          set -o pipefail
          uv run pytest -p no:cacheprovider -q tests/checks/test_v1_5_rebuild_from_pins.py \
            -k test_source_tree_matches_its_tarball | tee zero-patch.txt
          grep -Eq "^15 passed, [0-9]+ deselected in" zero-patch.txt
      - name: The judge
        run: uv run pytest -p no:cacheprovider
      - name: Release assets
        run: uv run python release/version.py assets build/artifacts dist/wasi_python-*.whl release-assets
      - name: The SHA-256 of SHA256SUMS, handed to every job that reads the assets
        id: sums
        run: echo "sha256=$(shasum -a 256 release-assets/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
      - name: What this run checks, signs and publishes
        env:
          ASSETS_ID: ${{ steps.assets.outputs.artifact-id }}
          ASSETS_DIGEST: ${{ steps.assets.outputs.artifact-digest }}
          SUMS_SHA256: ${{ steps.sums.outputs.sha256 }}
        run: |
          echo "release-assets: artifact $ASSETS_ID, digest $ASSETS_DIGEST"
          echo "SHA256SUMS: sha256 $SUMS_SHA256"
          cat release-assets/SHA256SUMS
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore

  rebuild-linux-arm64:
    name: rebuild from the pins (ubuntu-24.04-arm)
    # Two more hosts rebuild the whole set from an empty downloads/ and build/, beside the build,
    # and upload their SHA256SUMS; same-bytes compares each with the set's (spec 012, Decision 7).
    # One job per host, not a matrix: a job's outputs are its own, while a matrix's legs share one
    # namespace, so one leg could hand on the other's ids and cast both votes (spec 057, Decision 4).
    # Each runner compiles with its own pinned wasi-sdk clang, and every compile carries
    # -ffp-contract=off, set in the toolchain's own configuration files by step 10: that makes
    # wasi-sdk's x86_64 and aarch64 builds of clang emit the same bytes (spec 059;
    # context/research/2026-10-18-byte-identical-wasm-builds-prior-art.md). So no input runs in
    # both jobs' compilers: each vote rests on its own host's toolchain. Spec 040's emulated
    # compiler stays in the tree, switched off, for one release. Each job's time limit is 120
    # minutes, so a hung job frees the gate after two hours (spec 059, Decision 5).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      sums-id: ${{ steps.sums.outputs.artifact-id }}
      wheel-id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The runner's own tools (unpinned host inputs, recorded here)
        # nproc: the core count beside every time figure. binfmt_misc: a runner that could run an
        # aarch64 program through its own, unpinned qemu would hide a gap in the emulated
        # compiler's closure (spec 040, Decisions 5 and 6).
        run: |
          uname -srm
          nproc
          echo "binfmt_misc: $(ls /proc/sys/fs/binfmt_misc/ 2> /dev/null | tr '\n' ' ')"
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - id: sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-ubuntu-24.04-arm
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it (spec 016, Decision 1)
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - id: wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-ubuntu-24.04-arm
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-logs-ubuntu-24.04-arm
          path: build/logs/
          if-no-files-found: ignore


  rebuild-linux-x86-64:
    name: rebuild from the pins (ubuntu-24.04)
    # The same steps as rebuild-linux-arm64; only the runner and the names differ.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      sums-id: ${{ steps.sums.outputs.artifact-id }}
      wheel-id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The runner's own tools (unpinned host inputs, recorded here)
        # nproc: the core count beside every time figure. binfmt_misc: a runner that could run an
        # aarch64 program through its own, unpinned qemu would hide a gap in the emulated
        # compiler's closure (spec 040, Decisions 5 and 6).
        run: |
          uname -srm
          nproc
          echo "binfmt_misc: $(ls /proc/sys/fs/binfmt_misc/ 2> /dev/null | tr '\n' ' ')"
          cc --version | head -n 1
          make --version | head -n 1
          curl --version | head -n 1
          tar --version | head -n 1
          xz --version | head -n 1
          shasum --version
          git --version
          uv --version
      - name: Download the pinned inputs
        run: scripts/00_download.sh
      - name: Build from the pins
        run: scripts/build.sh
      - id: sums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-ubuntu-24.04
          path: build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: The wheel, as the build job makes it (spec 016, Decision 1)
        run: |
          cp -R build/artifacts src/wasi_python/artifacts
          uv build --wheel --build-constraints release/build-constraints.txt --require-hashes
      - id: wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-wheel-ubuntu-24.04
          path: dist/wasi_python-*.whl
          if-no-files-found: error
      - name: Keep the build logs when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-logs-ubuntu-24.04
          path: build/logs/
          if-no-files-found: ignore


  same-bytes:
    name: the same bytes from every host
    # Each rebuild's SHA256SUMS lists the whole set (the three artifacts, MANIFEST and the licences)
    # and must equal the set's, byte for byte, from arm64 Linux and from x86_64 Linux, each with its
    # own pinned clang (specs 012, 040 and 059). The .tar.xz asset is made from the set deterministically but is
    # outside this claim. attest and publish need this job, so a tag never signs or publishes bytes
    # that both hosts did not rebuild.
    needs: [build, rebuild-linux-arm64, rebuild-linux-x86-64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run (spec 057).
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file (spec 057).
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: The rebuild jobs handed on artifact ids
        env:
          ARM64_SUMS_ID: ${{ needs.rebuild-linux-arm64.outputs.sums-id }}
          ARM64_WHEEL_ID: ${{ needs.rebuild-linux-arm64.outputs.wheel-id }}
          X86_64_SUMS_ID: ${{ needs.rebuild-linux-x86-64.outputs.sums-id }}
          X86_64_WHEEL_ID: ${{ needs.rebuild-linux-x86-64.outputs.wheel-id }}
        run: |
          for id in "$ARM64_SUMS_ID" "$ARM64_WHEEL_ID" "$X86_64_SUMS_ID" "$X86_64_WHEEL_ID"; do
            case "$id" in
              "" | *[!0-9]*) echo "a rebuild job handed on no artifact id"; exit 1 ;;
            esac
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-arm64.outputs.sums-id }}
          path: rebuilds/ubuntu-24.04-arm
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-arm64.outputs.wheel-id }}
          path: rebuilt-wheels/ubuntu-24.04-arm
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.sums-id }}
          path: rebuilds/ubuntu-24.04
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rebuild-linux-x86-64.outputs.wheel-id }}
          path: rebuilt-wheels/ubuntu-24.04
          digest-mismatch: error
      - name: Every rebuild's SHA256SUMS is the set's, byte for byte
        run: |
          mkdir set
          tar -xJf release-assets/*.tar.xz -C set
          sums=$(echo set/wasi-python-*/SHA256SUMS)
          for runner in ubuntu-24.04-arm ubuntu-24.04; do
            cmp "$sums" "rebuilds/$runner/SHA256SUMS"
            echo "$runner: the same SHA256SUMS"
          done
          cat "$sums"
      - name: The wheel carries the set and is the wheel each host rebuilt (spec 016)
        # Three rules name what differs; the last comparison covers everything else in the wheel
        # (runner.py, METADATA), so a wheel built from any other source or set fails.
        run: |
          sums="$PWD/$(echo set/wasi-python-*/SHA256SUMS)"
          wheel="$(echo release-assets/wasi_python-*.whl)"
          mkdir wheel && unzip -q "$wheel" -d wheel
          ( cd wheel/wasi_python/artifacts && sha256sum --strict -c "$sums" )
          cmp "$sums" wheel/wasi_python/artifacts/SHA256SUMS
          listed=$(awk '{print $2}' "$sums"; echo SHA256SUMS)
          present=$(cd wheel/wasi_python/artifacts && find . -type f | sed 's#^\./##')
          if [ "$(echo "$listed" | sort)" != "$(echo "$present" | sort)" ]; then
            echo "the wheel's artifacts are not exactly the set's"
            exit 1
          fi
          for runner in ubuntu-24.04-arm ubuntu-24.04; do
            rebuilt="rebuilt-wheels/$runner/$(basename "$wheel")"
            if ! cmp -s "$wheel" "$rebuilt"; then
              echo "$runner rebuilt a different wheel; entries only in one (name, mode, size, CRC, date):"
              python3 - "$wheel" "$rebuilt" <<'PY'
          import sys, zipfile
          a, b = ({(i.filename, oct(i.external_attr >> 16), i.file_size, i.CRC, i.date_time)
                   for i in zipfile.ZipFile(p).infolist()} for p in sys.argv[1:])
          for row in sorted(a ^ b):
              print("release" if row in a else "rebuilt", *row)
          print("(no entry differs: the zip's own records do)" if a == b else "")
          PY
              exit 1
            fi
            echo "$runner: the same wheel"
          done

  verify:
    name: verify (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run (spec 057).
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file (spec 057).
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: Unpack the artifact set
        run: |
          uv run python -c "import sys, tarfile, glob; tarfile.open(glob.glob('release-assets/*.tar.xz')[0]).extractall(sys.argv[1], filter='data')" "$RUNNER_TEMP/set"
          echo "WASI_PYTHON_ARTIFACTS=$(uv run python -c "import glob, sys; print(glob.glob(sys.argv[1] + '/wasi-python-*')[0])" "$RUNNER_TEMP/set")" >> "$GITHUB_ENV"
      - name: The v1.1 to v1.4 checks on these bytes
        # Pass and fail only: the ratchet against the accepted state is the build job's. Fuel
        # differs slightly between hosts, even on the same bytes (spec 004's landing notes), so
        # this job compares with an empty baseline, which the scoreboard announces.
        run: >-
          uv run pytest -p no:cacheprovider --progress-dir "$RUNNER_TEMP/no-baseline"
          tests/checks/test_v1_1_artifact_set.py tests/checks/test_v1_2_portable_and_sealed.py
          tests/checks/test_v1_3_data_stack.py tests/checks/test_v1_4_embedding.py
          tests/unit/test_runner_sweep.py
          tests/unit/test_runner_grants.py
          tests/unit/test_cli.py
      - name: Nothing passed here is blocked but what this job cannot provide
        # The empty baseline fails only on a failed check; a check that skipped for a missing
        # need would pass unnoticed, so the needs that blocked anything are named here.
        run: |
          uv run python -c "
          import json
          checks = json.load(open('build/progress/latest.json'))['checks'].values()
          blocked = {c['need'] for c in checks if c['status'] == 'blocked'}
          print('blocked by:', sorted(blocked))
          assert blocked <= {'oracle', 'three systems', 'wheel'}, blocked
          "
      - name: The wheel, installed fresh, runs a program in one call
        # Installed by its plain name, no extra: `pip install wasi-python` must run programs, so
        # a wheel whose plain install could not never publishes (spec 028, Decision 4).
        run: |
          wheel="$(ls release-assets/wasi_python-*.whl)"
          uv run --isolated --no-project --with "wasi-python @ ./$wheel" python -c "
          import tempfile, wasi_python
          done = wasi_python.run(['-c', 'import pandas; print(pandas.Series([1, 2, 3]).sum())'], root=tempfile.mkdtemp())
          print(done)
          assert (done.exit_code, done.stdout) == (0, b'6\n'), done
          "
          # The wheel's own command (spec 019) prints the one line its README promises.
          line=$(uv run --isolated --no-project --with "wasi-python @ ./$wheel" \
            wasi-python run -- -c "print(1)")
          echo "$line"
          want='{"exit_code": 0, "fuel_used": null, "stderr": "", "stdout": "1\n", "trapped": null, "truncated": []}'
          if [ "$line" != "$want" ]; then
            echo "the installed command printed another line"
            exit 1
          fi
          # The empty `run` extra, kept for 0.1.0a3's instructions. `uv run --with` installs an
          # unknown extra silently, so an import would prove nothing: assert the metadata.
          uv run --isolated --no-project --with "wasi-python[run] @ ./$wheel" python -c "
          import importlib.metadata, re
          meta = importlib.metadata.metadata('wasi-python')
          extras = meta.get_all('Provides-Extra') or []
          reqs = meta.get_all('Requires-Dist') or []
          print('Provides-Extra:', extras, 'Requires-Dist:', reqs)
          assert extras == ['run'], extras
          assert not [r for r in reqs if re.search(r'extra\s*==', r)], reqs
          "
        env:
          WASI_PYTHON_ARTIFACTS: ""

  attest:
    name: attest the release assets
    # Build provenance for every asset, signed through Sigstore's public-good instance and then
    # verified strictly, before anything is published (spec 009), and only once arm64 Linux and
    # x86_64 Linux rebuilt the same bytes (same-bytes, specs 012 and 040). Only a pushed tag gets here: a signature is
    # permanent in the public transparency log, so dry runs never sign.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run (spec 057).
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file (spec 057).
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Verify each asset as a user will
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

  publish:
    name: publish the GitHub release
    # Only a pushed tag publishes; a manual run, even started on a tag, never does.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify, same-bytes, attest]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run (spec 057).
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file (spec 057).
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --no-project python release/version.py notes "$version" > notes.md
          prerelease=""
          case "$version" in *a*|*b*|*rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "wasi-python $version" --notes-file notes.md --verify-tag $prerelease

  pypi:
    name: publish the wheel on PyPI
    # Off until the owner registers this workflow as a trusted publisher on PyPI and sets the
    # repository variable PYPI_PUBLISH to true.
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: The build job handed on an artifact id
        # An empty artifact-ids makes download-artifact fetch every artifact of the run (spec 057).
        env:
          ASSETS_ID: ${{ needs.build.outputs.assets-id }}
        run: |
          case "$ASSETS_ID" in
            "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.assets-id }}
          path: release-assets
          digest-mismatch: error
      - name: These are the bytes the build job made
        # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
        # handed on, every file against SHA256SUMS, and no other file (spec 057).
        env:
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          set -eu
          case "$SUMS_SHA256" in
            "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
          esac
          if [ "${#SUMS_SHA256}" -ne 64 ]; then
            echo "the build job handed on no SHA-256 of SHA256SUMS"
            exit 1
          fi
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
          ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
          want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
          have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
          if [ "$want" != "$have" ]; then
            echo "release-assets holds other files than the build job's"
            exit 1
          fi
      - name: Only the wheel goes to PyPI
        run: mkdir dist && mv release-assets/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
