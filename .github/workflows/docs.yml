# The documentation site: built strictly on every pull request and every push to main, so a
# broken link or a stale generated page fails before it ships; deployed to GitHub Pages only
# from a release tag, or by hand. It builds a web site and nothing else: it neither builds nor
# publishes the artifact set.
name: docs

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  UV_VERSION: "0.9.22"
  UV_LOCKED: "1"
  UV_PYTHON: "3.14.2"

jobs:
  build:
    name: build the site strictly
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Build the site (a warning is an error)
        run: uv run --group docs mkdocs build --strict
      # The two generated reference pages must equal what the package renders today.
      - name: The Python API page is current
        run: uv run python tests/harness/api.py --check
      - name: The command-line page is current
        run: uv run python tests/harness/cli_doc.py --check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # One deployment at a time, and a running one is never cut short. Only this job queues, so
    # a pull request's build never waits in, or cancels, a release's deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
