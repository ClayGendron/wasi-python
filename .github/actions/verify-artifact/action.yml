# The build's files, as every job that checks, signs or publishes them reads them: one copy of the
# three steps, so every reader runs the same ones. The id the build job handed on is guarded first
# (an empty artifact-ids makes download-artifact fetch every artifact of the run); the
# release-assets artifact is downloaded by that id alone, its digest checked by the action; then
# SHA256SUMS is held to the SHA-256 the build job handed on, every file to SHA256SUMS, and no other
# file may be present. Values reach scripts through env:, never as expressions. The caller checks
# the repository out first, so this file is the commit's own.
name: verify-artifact
description: The build's release-assets, downloaded by id and checked against the build's hash.
inputs:
  assets-id:
    description: The build job's assets-id output.
    required: true
  sums-sha256:
    description: The build job's sums-sha256 output.
    required: true
runs:
  using: composite
  steps:
    - name: The build job handed on an artifact id
      shell: bash
      env:
        ASSETS_ID: ${{ inputs.assets-id }}
      run: |
        case "$ASSETS_ID" in
          "" | *[!0-9]*) echo "the build job handed on no artifact id"; exit 1 ;;
        esac
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.assets-id }}
        path: release-assets
        digest-mismatch: error
    - name: These are the bytes the build job made
      # By id, the digest checked by the action; then SHA256SUMS against the hash the build job
      # handed on, every file against SHA256SUMS, and no other file.
      shell: bash
      env:
        SUMS_SHA256: ${{ inputs.sums-sha256 }}
      run: |
        set -eu
        case "$SUMS_SHA256" in
          "" | *[!0-9a-f]*) echo "the build job handed on no SHA-256 of SHA256SUMS"; exit 1 ;;
        esac
        if [ "${#SUMS_SHA256}" -ne 64 ]; then
          echo "the build job handed on no SHA-256 of SHA256SUMS"
          exit 1
        fi
        if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
        printf '%s  SHA256SUMS\n' "$SUMS_SHA256" > SHA256SUMS.sha256
        ( cd release-assets && $sum -c ../SHA256SUMS.sha256 && $sum -c SHA256SUMS )
        want=$( { awk '{print $2}' release-assets/SHA256SUMS; echo SHA256SUMS; } | LC_ALL=C sort)
        have=$(cd release-assets && find . -mindepth 1 | sed 's#^\./##' | LC_ALL=C sort)
        if [ "$want" != "$have" ]; then
          echo "release-assets holds other files than the build job's"
          exit 1
        fi
