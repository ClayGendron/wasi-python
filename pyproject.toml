[project]
name = "wasi-python"
dynamic = ["version"]
description = "A statically linked CPython for WebAssembly hosts (wasm32-wasip1) with numpy and pandas compiled in."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Clay Gendron" }]
keywords = ["wasm", "wasi", "cpython", "numpy", "pandas", "sandbox", "wasmtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
# The runner binds the host-call import and runs the reactor; plain `wasmtime run` cannot.
run = ["wasmtime>=49,<50"]

[project.urls]
Homepage = "https://wasipython.dev"
Repository = "https://github.com/claygendron/wasi_python"

[dependency-groups]
# wasmtime: the harness drives the guest with fuel metering and its own door binding (spec 002, Decision 10).
dev = ["pytest>=8", "ruff>=0.12", "wasmtime>=49,<50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The one place the version is written (spec 004, Decision 1); release/version.py edits it.
path = "src/wasi_python/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wasi_python"]
# The release workflow copies the artifact set into src/wasi_python/artifacts/ before
# `uv build`. It is git-ignored, which hatchling honours unless the path is named here.
artifacts = ["src/wasi_python/artifacts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["recipes", "fixtures", "scripts", "build", "downloads", "context"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# tests/jobs holds guest programs and the oracle project, not tests.
norecursedirs = ["jobs", ".*", "build"]
markers = [
    "goal(area): a v1 progress check (spec 002); area is v1.1 to v1.5 or rules",
    "slow: a guest job or the oracle; skipped by the fast tier, -m 'not slow'",
]
