[project]
name = "wasi-python"
dynamic = ["version"]
description = "A statically linked CPython for WebAssembly hosts (wasm32-wasip1) with numpy, pandas, scipy, scikit-learn, statsmodels, matplotlib and lxml compiled in."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Clay Gendron" }]
keywords = ["wasm", "wasi", "cpython", "numpy", "pandas", "sandbox", "wasmtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
]
# wasmtime-py runs the guest: `run()` and the `wasi-python` command cannot work without it, so
# `pip install wasi-python` brings it (spec 028). The runner is tested on 50 only (spec 004).
dependencies = ["wasmtime>=50,<51"]

[project.scripts]
# Run one program and print its result as JSON (spec 019).
wasi-python = "wasi_python.cli:main"

[project.optional-dependencies]
# Kept, empty, so `pip install "wasi-python[run]"` from 0.1.0a3's instructions still works;
# wasmtime is now a plain dependency (spec 028, Decision 2).
run = []

[project.urls]
Homepage = "https://wasipython.dev"
Documentation = "https://claygendron.github.io/wasi-python/"
Repository = "https://github.com/ClayGendron/wasi-python"

[dependency-groups]
# wasmtime, which the harness drives the guest with (spec 002, Decision 10), comes from the
# project's own dependency, so the bound is written once (spec 028, Decision 1).
# pytest-xdist runs the judge on several cores (spec 052, Decision 1); pinned exactly, since the
# harness subclasses its scheduler and allows its plugins only at the version uv.lock names.
# mypy type-checks `src/wasi_python` in the judge (spec 106, Decision 5); pinned exactly, as
# pytest-xdist is, since a mypy release changes which lines are errors and the check must give the
# same verdict on every machine and on CI.
# coverage measures the runner's line coverage for the README's badge; pinned exactly, since a
# coverage release can change which lines count and the record must be reproducible.
# wasi-python-judge-options registers the judge's --tier from a pytest11 entry point, so the option
# exists before pytest reads any conftest and `uv run pytest --tier release` parses; it is a member
# of this repository's workspace (tests/judge_options), installed with the dev group alone and
# never a dependency of the wheel.
dev = [
    "coverage==7.17.0",
    "mypy==1.19.1",
    "pytest>=8",
    "pytest-xdist==3.8.0",
    "ruff>=0.12",
    "wasi-python-judge-options",
]
# The documentation site's builder, only for `mkdocs build`; pinned exactly, since a theme
# release changes the rendered site and the strict build's verdict.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[tool.uv.workspace]
members = ["tests/judge_options"]

[tool.uv.sources]
wasi-python-judge-options = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The one place the version is written (spec 004, Decision 1); release/version.py edits it.
path = "src/wasi_python/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wasi_python"]
# The release workflow copies the artifact set into src/wasi_python/artifacts/ before
# `uv build`. It is git-ignored, which hatchling honours unless the path is named here.
artifacts = ["src/wasi_python/artifacts"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The guest package (recipes/guest/, spec 031) is linted and formatted like src/; it stays
# compatible with Python 3.11, since the unit checks load it on the host's Python. The rest of
# recipes/ is other projects' shapes (stand-ins, shims, patches) and is left alone; its files are
# named one by one, since ruff's `recipes/*.py` would also match inside recipes/guest/. The judge
# lints `src tests recipes/guest` (tests/checks/test_rules.py), so a new top-level recipe .py is
# linted only by a bare `ruff check`.
src = ["src", "tests", "recipes/guest"]
extend-exclude = [
    "recipes/mmap_stub.py",
    "recipes/numpy_host_shim.py",
    "recipes/reactor_bootstrap.py",
    "recipes/ctypes_stand_in",
    "recipes/patches",
    "fixtures",
    "scripts",
    "build",
    "downloads",
    "context",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"           # the floor requires-python names; one target on every host
platform = "linux"                # one platform's narrowing on every host (spec 106, Decision 5)
strict = true
files = ["src/wasi_python"]
cache_dir = "build/.mypy_cache"   # build/ is git-ignored (AGENTS.md: artifacts never live in git)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# tests/jobs holds guest programs and the oracle project, not tests. tests/lint holds the writing
# conventions, which the quick job runs by its path (`uv run pytest tests/lint`): not goal checks,
# and not in the fast tier.
norecursedirs = ["jobs", "lint", ".*", "build"]
markers = [
    "goal(area): a v1 progress check; area is v1.1 to v1.5 or rules",
    "slow: a guest job or the oracle; skipped by the fast tier, -m 'not slow'",
]
